artition only when visible or refer client to a contractor.\n\n## Beams\n\n- Beams carry joists and/or bearing walls and distribute weight to columns, foundation, or other walls.\n- Beams should never be cut or notched anywhere—solid wood, tripled joists, or steel.\n- Beams should never be shimmed with wood or clay brick at beam pockets or columns (may rot, crush, or deteriorate); steel plate shims are appropriate and should be welded.\n- Notched wooden beam: recommend further evaluation by a qualified carpenter; notched steel or engineered beam: recommend licensed structural engineer.\n- Beams may be solid wood, steel, aluminum, or engineered (e.g., LVL - laminated veneer lumber).\n\n## Columns and Piers\n\n- Piers are short columns, usually in crawl spaces; both columns and piers must be within a few degrees of plumb (true vertical).\n- Columns and piers should not bear directly on dirt; this is often hard to determine in basements with concrete floors.\n- Materials: steel, wood, masonry (brick/block), and concrete; steel and wood used in basements and crawl spaces; masonry and concrete typically in crawl spaces.\n- Always check the base of wood columns/piers for rot, even in dry-looking basements; probe to confirm.\n- Check steel columns for rust at the base; severe rust (almost rusted through) requires recommendation for carpenter evaluation.\n- Dry-laid (no mortar) masonry piers that are out of plumb should be reported and referred to a carpenter.\n- \"Checking\" (shrinkage cracks) in old timber columns and beams is normal from drying and shrinking.\n\n## Foundations\n\n- View as much of the foundation as possible—exterior is limited, interior may be covered by finishes.\n- Foundations are affected by underlying soil types; unstable foundations often cause issues elsewhere in the house (diagonal wall cracks, binding doors).\n- Vertical cracks in concrete foundations are often not structural (shrinkage) but may allow groundwater seepage; horizontal cracks usually indicate lateral movement and are problematic.\n- Three basic foundation types: basement (walk-in space), crawl space (unfinished, a few feet tall), and slab-on-grade (no access).\n- Slab-on-grade styles: supported (slab supported by foundation), floating (foundation wall taller than slab; common in garages), and monolithic (slab and perimeter footing poured together; common in garages and warm climates).\n- Inspectors need only report \"slab on grade\" if there is no basement or crawl space—not the subtype.\n- Foundation materials: concrete (most common), masonry (block, brick, stone, terra cotta), piers/pier-and-beam (common in wet areas), and permanent wood foundation (PWF, pressure-treated, claimed to last 100+ years).\n- Bad soils: sandy soil has good bearing capacity, silty soil poor, clay expands when wet and shrinks when dry, organic material is worst (still rotting and shifting).\n- Footings are not visible during inspection but are critical; they must be on stable soil and are wider than the foundation wall.\n- Frost line: typical deepest ground freeze depth; local building codes set required footing depths; footings must be at least as deep as frost line (deeper is better).\n- Example frost line depths: Seattle 12\", Chicago 42\", Fargo ND 54\"; check local building department.\n- Sources of heaving: frost heave (footings above frost line), adfreezing (clay sticks to foundation and lifts it), expansive soils, and high water table.\n\n## Inspecting Structural Components\n\n- Serious structural issues are rare but are a major client concern; most serious issues are foundation-related.\n- Structural clues like diagonal wall cracks or binding doors usually point to foundation movement; in a top-down inspection, avoid verbal conclusions until you see the foundation.\n- Four reporting options: say nothing (if OK), recommend monitoring, recommend checking with current owner, or recommend further evaluation (carpenter/framing contractor, foundation contractor, or licensed structural engineer).\n- Recommend monitoring only when you are sure the item is not a structural problem (e.g., minor wall cracking); report language: \"Recommend monitoring of the crack over time and if it appears to change contact a qualified contractor for review.\"\n- NEVER state something \"appears stable\" or \"structurally stable\" unless you are a licensed structural engineer.\n- Recommend checking with current owner when something is likely OK but history is unknown (e.g., a repair); ask who did the repair, when, and if warranties transfer; if no owner available, recommend contractor review.\n- Dimensional lumber defects (cut joists, missing joist hanger nails) → qualified framing contractor/carpenter; foundation issues → qualified foundation contractor; engineered product defects (trusses, I-joists) or anything unusual → licensed structural engineer.\n- Do not practice engineering; if cracking is not \"typical\" in your opinion, direct to a contractor or engineer; don't feel pressured to say \"monitor\" when you believe further evaluation is needed.\n- Typical cracking: most vertical cracks in concrete foundations are shrinkage/settlement; seasonal cracking from wood expansion/contraction; knee-wall ceiling cracks in Cape Cods; shrinkage cracks are hairline, uniform width, near-vertical, and can be monitored (if seepage occurs, epoxy or urethane grouting stops it).\n- Problematic cracking: multiple or paired cracks from a common point, horizontal cracks, differential movement/displacement, cracks widening from point of origin, and exceptionally large vertical cracks.\n- Epoxy grouting in residential foundations is for stopping seepage, not structural repair.\n\n## Structural Inspection: Exteriors\n\n- View the exterior from a distance before getting close to detect leaning or sagging; visually start at the top and work down.\n- Check walls for plumb and square as you walk around corners (turn head 90° to view the plane of the next wall).\n- Significant settling visible from outside (e.g., misaligned window eyebrows, dropped corners) warrants recommending a structural engineer or foundation contractor.\n- Exterior defects (cracked slab, step cracking, patched-and-cracked masonry) often match interior defects; if interior finishes are newer and defects coincide, the house has likely had recent/current movement—recommend further evaluation.\n- Step cracking with differential settlement (corner dropped away) is a classic foundation issue; recommend a foundation contractor.\n- Steel lintels over masonry openings must bear on masonry at least 6 inches; a lintel with no bearing, a rusted lintel, or a collapsing door header should be referred to a masonry contractor.\n- Patched cracks that have reopened indicate ongoing movement; recommend review by a foundation contractor or structural engineer.\n"}, {"title": "Module 9 Structural Inspection 2", "md": "# Module 9 Structural Inspection 2\n\nThis module covers structural inspection of decks, interior and attic clues, basements/crawl spaces, joists, beams, columns, concrete floors, and documentation.\n\n## Decks\n- Deck failures are common: CPSC 2003–2007 data shows 20,200 injuries from structural collapse/failure of deck/porch/railing/stairs, 178,800 injuries from falling off, over 18,000 serious injuries, and nearly 30 deaths.\n- Most common structural defect is an improperly secured ledger board; missing/improper flashing at the top of the ledger board leads to rot of the ledger or rim joist.\n- Ledger board fasteners must be ½-inch diameter lag screws with washers or ½-inch diameter thru-bolts with washers (washers at both head and nut for thru-bolts); lag screw tips must extend at least ½ inch beyond the inside face of the rim joist.\n- Nailing the ledger board to the house is never acceptable, even with ring shank nails.\n- Ledger board bolt spacing (from AWC DCA 6, 2009 IRC) for a 2-inch nominal solid-sawn rim joist: for joist span 10'1\"–12', lag screws every 15\" O.C. and bolts every 29\" O.C.; spacing varies with joist span (shorter spans allow wider spacing).\n- Ledger board must be at least the same size as the deck joist (e.g., 2x10 or 2x12); split, too-thin, or only-nailed ledger boards are unsafe.\n- Always inspect a deck from underneath before walking on it; if unsafe, do not walk on it and advise the client to stay off.\n- Proper ledger flashing: drip cap flashing with a vertical leg under the siding, extending over the ledger board with a drip edge; membrane flashing (e.g., Vycor) works if not exposed to sunlight.\n- Joist hangers are required when the rim joist is structural; missing hangers, too-small hangers, missing nails, or wrong nails (e.g., roofing nails) are defects.\n- Beams must be bolted to posts; shims or unsecured bearing are defects.\n- Posts must be adequately sized (not 2x6), anchored to footings, have lateral bracing, and not be notched; footings must be below frost line to prevent frost heaving.\n- Deck stairs: loose treads, split stringers, stringers pulling away from the deck, and bearing on soil are structural defects; protruding nails are a safety hazard.\n- Corroded hardware (e.g., drywall screws at balusters, rusted bolts) and rotted wood anywhere on the deck are defects.\n- Deck defects can be referred to a qualified carpenter; a structural engineer is not typically needed for decks.\n- If you encounter an immediately hazardous condition (e.g., near-failure deck lacking joist hangers), strongly urge occupants to stay off and proactively notify the homeowner in writing before leaving.\n- Never attach a deck ledger to bay windows, protrusions, or overhangs; secure it only to the main house structure’s permanent rim joist.\n\n## Who to Recommend? (Reminder)\n- Dimensional lumber defects (cut joists, missing hangers) → qualified framing contractor (carpenter).\n- Foundation issues → qualified foundation repair contractor.\n- Engineered product defects (trusses, I-joists) or anything unusual → licensed structural engineer.\n\n## Structural Inspection: Interiors\n- Start at the highest point (attic) and work down; enter the attic when possible—defects are often not visible from the hatch.\n- Many pre-1930s homes have no ridge board; a ridge board is not required if rafters are directly opposed, ceiling joists restrain rafter bottoms, roof slope is at least 4 in 12, and opposing rafters are secured with gusset plates.\n- A cracked rafter (often from reroofing overload) can be sistered by a carpenter; report it.\n- Any damaged or altered truss (loose web, cut chord, removed web, broken chord, loose gusset plate) → recommend licensed structural engineer; trusses are identified by gusset plates.\n- Truss uplift: caused by insulation over bottom chords keeping them warm/dry while top chords expand, lifting the bottom chord; causes ceiling cracks only at center span (not at exterior walls); cosmetic, not structural; recommend carpenter; solution is crown molding nailed to ceiling only.\n- Interior clues: cracks in newer finishes indicate recent movement; seasonal cracks are straight, vertical, single, and at corners of doors/windows; structural cracks are jagged/diagonal, radiating, or multiple.\n- Consider the age of the home: older homes may have settled long ago; doors out of square, cracked plaster, and out-of-level floors may be typical if no corresponding current issues exist.\n- Corresponding movement: exterior step cracks, doors out of square on multiple floors, wall cracks, and basement foundation failure all tie together; recommend foundation contractor.\n\n## Basements and Crawl Spaces\n- Review foundation walls top-down around the perimeter; also examine sill plates, rim joists, and anchor bolts.\n- Typical foundation crack: vertical, narrow, same width throughout; tell client to monitor; epoxy or urethane grouting is for seepage only, not structural repair.\n- Horizontal foundation cracks are almost always structural, caused by lateral thrust (expansive clay, tree roots, hydrostatic pressure); recommend foundation contractor or structural engineer.\n- Concrete block foundations are susceptible to horizontal cracking, especially if unreinforced; a back-pitched driveway can contribute to failure.\n- Anchor bolts must pass through the sill plate with nut and washer; a missed sill plate is a defect (recommend carpenter; if many, structural engineer).\n- Floor heaving along an outer wall is a sign of foundation settlement (wall goes down, soil/slab pushed up).\n- Advise clients to ask sellers about any epoxy grouting repairs: note completion date, whether warranty transfers (often 10-year/lifetime), and if a paid reinspection is required for transfer.\n\n## Joists and Sheathing\n- Maximum hole in a solid joist: 1/3 of joist depth, with at least 2 inches of wood at the bottom; maximum notch depth: 1/6 of joist depth; notches in the center of the span are prohibited.\n- Joist hangers must be properly nailed; missing nails or too-small hangers are defects.\n- Sistering (new joist placed next to original) is a repair; if through-bolted and sound, it may be acceptable; recommend checking with the owner or a carpenter.\n- Check sheathing for rot under bathrooms, kitchens, and exterior doors (especially sliding glass doors—tracks collect water).\n- Bridging/blocking/strapping reduce joist twisting and improve load sharing; solid blocking is best, cross-bridging next, strapping least effective; must be properly attached.\n- Sliding glass door tracks act as rainwater collectors; fastener penetrations leak without proper flashing/sealing, rotting underlying sheathing—always inspect beneath exterior doors thoroughly.\n\n## Beams and Columns\n- No notches or holes are allowed in wood beams (major structural element); if cut, recommend carpenter.\n- Steel beam web holes are usually acceptable (like I-joist webs), but recommend a structural engineer to confirm.\n- Beams must have proper bearing on columns; beam ends separating, rotted beams, crushing at jack posts, and improper piers (dry-laid masonry, blocks laid wrong) are defects.\n- Columns/piers must be plumb, not too thin (2x6 is too thin), anchored to footings, and not settled; check base for rot (wood) or rust (steel).\n- Loose bolts at beam-column connections in older homes are common but should be tightened; recommend carpenter.\n\n## Concrete Floors\n- Concrete floors in basements/crawl spaces are not structural; typical cracking is normal—explain this to the client.\n- Control joints (e.g., Zip-Strip) are intentional straight cracks; concrete may crack elsewhere.\n- Report excessive cracking or roughness with photos.\n\n## Include Photos\n- Always include photos in the report to help the client understand; document blocked areas (stored items, finishes) with photos to minimize liability and allow the client to raise issues at closing.\n"}, {"title": "Module 10 Interior Inspection 1", "md": "# Module 10 Interior Inspection 1\n\nThis module covers the ASHI Standards of Practice for interior inspections, plus garage, attic, insulation/ventilation, and interior living-space inspection procedures and common defects.\n\n## Standard of Practice\n- ASHI SOP Section 10 requires inspecting walls, ceilings, floors; steps, stairways, railings; countertops and a representative number of installed cabinets; a representative number of doors and windows; garage vehicle doors and operators; and installed ovens, ranges, surface cooking appliances, microwaves, dishwashers, and food waste grinders using normal operating controls to activate the primary function only.\n- \"Representative number\" means one component per room for multiple similar interior components (e.g., windows, receptacles); for cabinets, one per room meets the SOP, but checking all kitchen cabinets is better customer service.\n- \"Installed\" means attached such that removal requires tools.\n- Not required to inspect: paint, wallpaper, finish treatments; floor coverings; window treatments; coatings and hermetic seals between window panes (lost seals) — though report lost seals if visible; central vacuum systems; recreational facilities (spas, saunas, steam baths, pools, exercise/entertainment/athletic/playground equipment and accessories).\n- Not required to inspect appliance thermostats, calibration, heating elements, self-cleaning cycles, indicator lights, door seals, timers, clocks, timed features, or every control/feature of an inspected appliance.\n- ASHI SOP Section 11 requires inspecting insulation and vapor retarders in unfinished spaces; ventilation of attics and foundation areas; kitchen, bathroom, laundry, and similar exhaust systems; and clothes dryer exhaust systems.\n- Inspector must describe insulation/vapor retarders in unfinished spaces and the absence of insulation at conditioned surfaces, but is not required to disturb insulation.\n\n## Garages\n- SOP applies to buildings with four or fewer dwelling units and their garages/carports; inspect garages per exterior/interior standards with special attention to the overhead door and automatic opener.\n- Always recommend adding gutters where missing at the eaves of detached garages.\n- For overhead door or automatic opener defects, recommend evaluation by a qualified overhead door contractor; for other garage defects, recommend the appropriate trade (electrician, carpenter, roofer, etc.).\n- A garage door that fits poorly at the slab should be reported; it allows animals and snow entry and may need a bottom seal.\n- Thinner metal garage doors often require a reinforcing strut across the top edge when used with an opener; missing struts can cause door damage.\n- Inspect rollers, tracks, and springs; worn-out rollers look floppy and warrant an overhead door contractor recommendation even if the door operates.\n- A worn-out garage door spring shows gaps between coils when relaxed; it should have a safety cable through it because a failing spring can release with great force and cause damage/injury.\n- Paper facing on insulation must not be exposed in a garage; it is flammable and should be written up as a safety issue.\n- A garage door opener should not be plugged into an extension cord; it should be plugged directly into an outlet, and adding an outlet should be done by a qualified electrician.\n- Electric eye sensors for openers are safety devices and should be mounted a maximum of 4 inches from the floor (some codes allow 6 inches); never on the ceiling or high on the wall.\n- Test the opener safety reverse with light hand pressure on the bottom edge of the door; do NOT use the manufacturer's 2x4 method because it can break plastic gears in the opener.\n- Do not adjust the safety reverse pressure adjustment; test it and report if it fails.\n- If garage attic access is blocked by easily moved shelving, move it for customer service; otherwise report \"not entered, obstructed access.\"\n- Wet/rotted garage roof sheathing seen from inside means you should go back outside and inspect the roof; report the finding.\n- Test garage wall stains with a moisture meter; if wet, report; if dry, recommend checking with the current owner; if mold is visible, recommend a mold specialist (mold is excluded from SOP but good customer service).\n- Attached garages should have a firewall between house and garage: continuous drywall from floor to roof ridge/ceiling, no holes, and a solid fire-resistant door (not hollow core). Pre-1970s houses often lack firewalls; recommend adding for safety.\n- Firewall breaches (holes, hollow-core doors, pet doors) should be reported for safety correction; a door into the garage should be raised above the garage floor (gas curb) so flammable liquid spills cannot roll under it.\n- A breach in the fire separation under living space with an open junction box requires both an electrician and a carpenter (junction boxes cannot be buried).\n\n## Attics\n- Enter attics whenever possible; inspect as much as physically possible, visually starting at the ridge and working down; check structure, look for stains (roof leaks), and review ventilation and insulation.\n- Do not enter an attic where you would disturb insulation and cannot see where to step; report \"attic viewed from hatch, not entered.\"\n- Check pull-down attic ladder hardware (bolts/connections) before using; if very loose, use your own ladder.\n- Attic ladders that are too short or too long are unsafe; recommend a carpenter.\n- Attic access may be hidden in closets or behind furniture; you are not required to move furniture, but moving it is good customer service if the hatch is accessible afterward.\n- Common roof sheathing types: OSB, plywood, boards (older), and skip sheathing (spaced boards for cedar shingles/shakes, also used for slate).\n- Holes in sheathing or through the roof: recommend a carpenter or roofer; report even if missed from the exterior.\n- Leaks at plumbing vents, valleys, or chimney flashing: report and recommend a roofing contractor; use a moisture meter if reachable — wet means currently leaking, dry only means not wet now.\n- Stains/mold in attics may come from exhaust fans dumping into the attic or a damp crawlspace, not necessarily roof leaks; test moisture if possible and report.\n- Rotted or possibly burned sheathing near a fireplace vent: class A stainless steel vent typically requires 1.5 inches minimum clearance; recommend roofing contractor, carpenter, and fireplace/chimney specialist as appropriate.\n- Painted attic framing/sheathing may indicate a past fire (sealing smoke smell) or mold remediation (antimicrobial sealer); tell the client to check with the current owner and local building department for fire records/permits.\n- An offset/corbelled chimney is common in older homes; corbelling means bricks staggered outward.\n- Missing firestop: there should be no openings from lower levels into the attic; if you can see the basement ceiling from the attic, it's a major safety defect because fire can spread quickly to the roof.\n- Stored items in attics: work around them, report limited access, and include a photo.\n- Active insect nests: leave the attic immediately and report not entered due to stinging insects; recommend a pest control contractor.\n- Animal nests (e.g., squirrel): recommend a wildlife specialist; also note missing insulation if present.\n- Animal feces (e.g., raccoon droppings): do not enter; recommend a wildlife specialist; the attic will need cleaning, insulation removal, and reinsulation.\n\n## Attic Insulation & Ventilation\n- Insulation reduces heat loss in cold weather and heat gain in warm weather; vapor barriers should face the heated side to prevent moisture migration into insulation.\n- Higher R-value means better insulation; cold climates recommend minimum R-50, warm climates minimum R-30; most homes have less.\n- Inspect insulation type and approximate depth; it must not block soffit vents or cover lighting fixtures not rated for insulation contact; do not disturb insulation; report \"vapor barrier not observed\" if not visible.\n- Blown-in fiberglass ≈ R-3 per inch; fiberglass batts ≈ R-3.5 per inch; rock wool ≈ R-3 per inch (looks like gray fiberglass, but fiberglass is never gray); cellulose ≈ R-3.8 per inch (ground-up paper with fire retardant); vermiculite ≈ R-2 to R-3 per inch and sometimes contains asbestos; redwood fiber ≈ R-3 per inch (Northwest states); spray foam ≈ R-6 per inch (often applied at roof sheathing, report sheathing as \"not observed\").\n- Vapor barrier on the wrong side can trap moisture and cause mold/rot; insulation pushed against roof sheathing blocks soffit vents; sliced vapor barriers are also incorrect.\n- SOP requires reporting absence of insulation; if joists are visible, there is not enough insulation; recommend an insulation contractor.\n- Attic ventilation rule of thumb: with a vapor barrier, 1 sq ft of ventilation per 300 sq ft of attic floor; without a vapor barrier, 1 sq ft per 150 sq ft; balanced 50/50 between soffit and ridge; estimate only, do not calculate.\n- More venting is usually OK; less is not. Proper ventilation reduces attic temperatures in summer and reduces/eliminates ice damming in winter; no/few vents warrant a roofing contractor recommendation.\n- Exhaust fans and dryer vents must discharge to the exterior, never into the attic; turn on all bathroom/kitchen fans before entering the attic to locate misdirected vents.\n- Ice on sheathing, condensation on soffit vent chutes, or mold on sheathing indicate excess attic moisture from poor venting, exhaust fans dumping into the attic, or a damp crawlspace; recommend an environmental consultant for mold.\n- A ridge vent requires a continuous slot through the sheathing; if covered by felt, the vent is ineffective and should be reported.\n- Soffit chutes keep insulation from blocking airflow; clogged soffit vents/chutes should be reported.\n- Nests clogging roof vents should be reported; if screening has failed, animals may be in the attic.\n- Mechanical attic vent systems are included in the SOP; inspect if accessible, otherwise report \"inaccessible, not inspected\"; attic fans often fail because screening is pushed against the blades.\n- Spray foam is often installed as a ventless system; if in doubt, recommend review by an insulation contractor.\n- An exhaust fan tied to a plumbing vent is wrong; recommend a licensed plumber.\n\n## Interior Living Space\n- In occupied homes, furniture limits the inspection; be thorough but respectful and do not move furniture. In vacant homes, the representative-number concept should not apply — open every window and test every outlet.\n- In each room, start at the ceiling and work down visually, completing the circle.\n- Excessively cluttered rooms should be documented in the report with a photo.\n- Typical interior issues: ceiling heights, ceiling cracks/stains, wall cracks/stains/holes, sagging/sloping floors, bathroom walls/floors, stair steps/railings, cabinets/countertops, interior doors, skylights, window operation/condition, failed insulated glazing, safety glazing locations, fire exiting, and general safety.\n\n## Ceilings\n- Minimum ceiling height is typically 7 feet (7'6\" is better); low ceilings often occur in finished basements/attics; compare to standard doors (6'8\") to estimate height.\n- Check for stains, touched-up paint (look from multiple angles; touched-up paint may indicate a hidden stain), cracks, and nail pops.\n- Ceiling stains/patches: test with a moisture meter; if source is not obvious, tell the client to check with the current owner; consider rooms above (bathrooms/laundry).\n- A typical ceiling crack is usually not structural; recommend monitoring.\n- Plaster that has \"lost its key\" is separating from wood lath; recommend a plaster or drywall contractor.\n- Some old ceiling tiles (especially 9x9 inches) may contain asbestos; recommend testing.\n- Nail pops are common; they can be pounded back and patched, or replaced with a drywall screw for a permanent fix.\n\n## Walls\n- Check for cracks, stains, holes, and mold in hidden areas such as closets (pull clothes back); do not move furniture, and if you do, put it back exactly.\n- A typical seasonal wall crack is usually not structural; monitor it. Cracking on two walls is atypical and warrants review by a carpenter or structural engineer based on other findings.\n- Wall stains: test with a moisture meter; dry means no active leak today; recommend the appropriate trade based on location (roof, plumbing) or checking with the owner.\n- Wall damage hidden behind furniture should be documented with photos; take multiple photos of every finished room from different angles to protect yourself.\n- Drywall damaged behind a door is found by actually testing the door; recommend a drywall contractor or carpenter.\n- Closet walls on outside corners in older masonry homes in cold climates often get condensation and mold due to lack of air movement/heat; inspect with a flashlight.\n- Flaking paint on an outside wall may indicate condensation issues; recommend a painter and possibly other trades based on findings.\n\n## Floors\n- Check for excessive sagging/sloping, multiple cracked tiles (weak floor structure), loose tiles (in basements, moisture), bouncing floors (inadequate joist sizing/spacing or lack of bridging), and tripping hazards.\n- Excessively sagging floors: recommend a carpenter; no level needed — it's a limited visual inspection.\n- Multiple cracked tiles indicate too much deflection; recommend a carpenter and check the structure below; on a slab, the slab is likely cracking elsewhere.\n- Loose floor tiles in basements indicate moisture; recommend a waterproofing contractor in addition to a flooring contractor.\n\n## Bathroom Walls\n- Check wet areas for loose tiles (tap lightly, especially near tub/shower edges), cracked tiles, missing/bad grout, missing/bad caulking, and soft/water-damaged walls (tap lightly).\n- Check tile carefully under recessed soap dishes — it is often loose there.\n- Loose, cracked, missing, or holed tiles and missing grout: recommend a handyman or tile contractor.\n- Gaps in sealant/caulking: recommend caulking maintenance.\n- Soft walls at the tub (pushed in) should not be touched; recommend a drywall or tile contractor.\n"}, {"title": "Module 11 Interior Inspection 2", "md": "# Module 11 Interior Inspection 2\n\nThis module covers interior inspection of bathroom floors, stairways, cabinets, doors, skylights, windows, safety glass, fire safety, general livability, appliances, and basements/crawl spaces.\n\n## Bathroom Floors\n- Check at tubs and toilets for loose flooring, cracked tiles, missing/bad grout, missing/bad caulking, and stains that allow moisture damage.\n- Test for soft floors by stepping on them; do not step on floors that are visually obviously soft (risk of worsening damage).\n- Loose tiles at tub ends are common from water splashing past shower curtains; recommend a tile or flooring contractor.\n- Multiple cracked tiles may indicate excessive floor deflection; recommend a carpenter.\n- Missing grout: recommend a handyman or tile contractor (caulk is only a short-term fix).\n- Stains around a toilet usually mean a failed wax ring at the closet flange; use a moisture meter; recommend a licensed plumber.\n- Straddle the toilet and step on the balls of your feet on each side to detect soft floors; for soft floors recommend both a carpenter and a plumber (fix the leak before the flooring).\n- Moisture meter use is not required by the SOP, but over 90% of inspectors use one; a wet floor proves an active leak.\n\n## Stairways\n- Risers typically 7–8\" tall, all within 1/16–1/8\" of each other; treads typically 9–11\" deep, all equal; tread + riser = 17.5\".\n- Uneven treads or risers are tripping hazards; recommend carpenter evaluation for safety.\n- Handrails 34–38\" above the tread nose; must be grippable: 1.25–2\" diameter circular or max 2.25\" cross-section for other shapes.\n- Balusters: a 4\" sphere must not pass through; at stairs a 4-3/8\" sphere; the triangular bottom area must stop a 6\" sphere.\n- Handrail recommended when there are more than 2–3 risers; missing handrails on open sides should be reported.\n- Handrail must be at least 1.5\" from the wall and not protrude more than 4\" into the stairway.\n- Loose railings are common; gently jiggle every railing; recommend a carpenter.\n- Minimum headroom 6'8\"; minimum stair width 36\".\n- Doors must not open over stairs unless there is a landing at least 30\" wide and not more than one step below.\n- Older homes will not meet all parameters; report awkward or unsafe stairs and let the client decide.\n\n## Cabinets and Countertops\n- Includes built-in cabinets anywhere in the house: kitchens, bars, basements, laundry rooms, bathrooms, garages.\n- Inspect all cabinets, doors, and drawers, not just a sample; use two hands to open two at once.\n- Report cosmetic damage only if excessive; normal wear and tear is not reported.\n- Water damage under a sink: check with a moisture meter or feel; recommend a carpenter or kitchen remodeling contractor.\n- Water damage near a dishwasher: run the dishwasher through a cycle and check for leaks.\n- Sloppy workmanship may be reported, especially if the client requests it.\n\n## Interior Doors\n- Doors should function smoothly; common defects: rubbing at jamb, latch not catching, loose hardware, rubbing on carpet, self-opening/closing (out of plumb), physical damage.\n- Door rubbing carpet damages the veneer; often from new thick carpet with the door not undercut.\n- Hinges should have screws in every hole; loose hinges: recommend a carpenter.\n- Clients expect near-perfect operation in newer homes; use judgment in older homes.\n\n## Skylights\n- Stains at the low end of a skylight are often from condensation; stains at the high end are usually from leaks.\n- Operable skylights: test if the pole, switch, or remote is found; if not, report as not tested.\n- Water damage beyond condensation at the low end indicates a roof leak; recommend a roofer.\n\n## Windows\n- Older window defects: failing paint, failing putty, rotted wood, cracked glass, won't stay open, defective or missing hardware.\n- Newer window defects: cracked glass, warped/won't lock (vinyl), leaking, failed seals, defective hardware, non-tempered glass, egress issues.\n- Test every window lock; warped vinyl windows that won't lock are security and energy-efficiency issues.\n- SOP requires only one window per room, but inspect all accessible windows; do not move personal possessions; photograph blocked windows.\n- Rot starts at side jambs; probe gently with a finger, not a tool.\n- Do not test windows with rotted or damaged sash (may fall apart).\n- Cracked single-pane glass: handyman or homeowner can replace; cracked insulated glass: window contractor (entire glazing unit must be replaced).\n- Broken sash cord: do not test the window; recommend a carpenter.\n- Window stains are usually from winter condensation (check for a whole-house humidifier), not leaks.\n- Mansard roofs commonly leak at window eyebrows; move blinds/drapes to check window heads.\n- Failed seals on insulated glass are excluded from the SOP but should be reported; it is a function issue (reduced energy efficiency).\n\n## Safety (Tempered) Glass\n- Safety glass crumbles when broken; regular float/plate glass shatters into sharp shards.\n- Required: all glass in fixed and operable swinging, sliding, and bifold doors (interior and exterior); within 24\" of door edges and 60\" above the floor; within 60\" above a tub or shower floor; within 36\" of a stair landing.\n- Older homes will not conform; use best judgment and inform the client.\n- Labels may be removable; when in doubt, report it.\n- Shower enclosures are almost always safety glass (thick, machined edges); old thin glass in metal frames likely is not.\n\n## Windows and Fire Safety\n- Egress window (bedroom) criteria: minimum opening width 20\", minimum height 24\", minimum net clear opening 5.7 sq ft (5.0 sq ft for ground floor), maximum sill height 44\".\n- Basement bedrooms often have too-small, too-high windows; report as a safety issue.\n- Security bars trap occupants in fires; always report as a safety issue.\n\n## General Safety and Livability\n- Be alert for dangerous or awkward arrangements clients may not know about.\n- Single-wall vent for a water heater in a closet is a major safety issue (needs 6\" clearance from combustibles); recommend a heating or plumbing contractor.\n- \"Bedrooms\" in unheated closed-in porches may lack insulation and heat; inform the client.\n\n## Appliances\n- SOP covers only installed appliances; many inspectors also check refrigerators, stoves, washers, and dryers; check state licensing laws.\n- SOP requires only a cursory on/off examination, not every cycle.\n- Required by SOP: garbage disposal; typically checked: stove, refrigerator, dishwasher, microwave.\n- Run the disposal only with water running; run the dishwasher through a cycle (no soap); test the microwave with a cup of water.\n- Check washer hot and cold water supply; ensure ovens, dishwashers, and washers are empty before operating.\n- Clothes washer connections are excluded from the SOP but should be checked; rubber hoses can be ready to burst; shut off water if necessary.\n- Plastic dryer vents are flammable; only metal vents should be used.\n\n## Basements and Crawl Spaces\n- Crawl spaces and unfinished basements are mostly structural inspections; finished basements are inspected per modules 10–11.\n- Look for plumbing leaks and groundwater moisture infiltration; dirt or gravel crawl spaces should be ventilated.\n- Note \"restricted view\" when foundation walls are blocked by finishes or stored items.\n- Try to check under baths and kitchens even if the crawl space has less than 24\" of vertical clearance (SOP does not require entry below 24\").\n- Old basement windows: many inspectors do not open them (may not close); report as not opened.\n- Water piping at a crawl space vent in a cold climate is a freeze hazard; recommend a plumber.\n- A dryer vent discharging into a crawl space adds lint and moisture; report it.\n- Bees, ants, and wasps in crawl spaces: recommend a pest specialist; carpenter ant sawdust is called \"frass.\"\n- Remove insulation at the perimeter (especially under exterior doors) to check rim joists and sill plates for hidden rot.\n- Wear heavy rubber gloves in crawl spaces; bacterial contamination from human feces can cause serious illness.\n- Efflorescence (white chalky deposits) = minerals leached by chronic moisture; check exterior grading and downspouts.\n- Corner moisture or mold is often from lack of downspout extensions (direct water at least 5' from the house).\n- Use \"possible mold\" or \"environmentally suspect material\" instead of \"mold\" on reports.\n- A dirt-floor crawl space can contribute several gallons of moisture per day; a vapor barrier (6 mil polyethylene) should be laid, sealed at edges and joints, and ballasted with gravel.\n- Without a vapor barrier: 1 sq ft of vent opening per 300 sq ft of crawl space; vents need intact screens.\n- A flooded crawl space need not be entered (electrocution risk); document it.\n- A sump pump keeps groundwater below the floor; never put your hand in water to activate the float; the sump pit needs a proper cover.\n- Failed sump pump: recommend a plumber or waterproofing contractor.\n- Not included in the SOP: paint, wallpaper, carpeting, window treatments, central vacuums, and recreational facilities (pools, hot tubs, spas, steam baths).\n"}, {"title": "Module 12 Plumbing Inspection 1", "md": "# Module 12 Plumbing Inspection 1\n\nThis module covers the ASHI Standard of Practice for plumbing, supply and DWV piping materials, support and condition, cross connections, vents, and common defects.\n\n## Standard of Practice\n- ASHI SOP Section 6 requires inspection of interior water supply/distribution including fixtures and faucets; interior drain/waste/vent systems including fixtures; water heating equipment and hot water supply; vent systems, flues, and chimneys; fuel storage/distribution; sewage ejectors, sump pumps, and related piping.\n- Inspector must describe interior water supply, DWV piping materials; water heating equipment energy source; and location of main water and main fuel shut-off valves.\n- Not required to inspect: clothes washer connections; inaccessible vent/flue/chimney interiors; wells, well pumps, and water storage; water conditioning systems; solar/geothermal/renewable water heating; fire sprinkler/extinguishing systems; landscape irrigation; septic or other sewage disposal systems.\n- Not required to determine public vs. private water/waste systems, water quality, or adequacy of combustion air; not required to measure water flow/pressure or well water quantity; not required to fill shower pans/fixtures to test for leaks.\n\n## Important Plumbing Concepts\n- Properly designed plumbing protects occupant health; wastewater must go to a municipal sanitary sewer or approved private septic system.\n- Stormwater is typically not allowed in sanitary disposal systems because it costs money to treat, can overload older sewers causing raw sewage backups, and flushes out septic-system enzymes.\n\n## Red Flags and Hidden Piping\n- Foul odors in attics, basements, or crawlspaces indicate problems such as open or cracked vents; report the odor and recommend plumber evaluation even if no visual cause is found.\n- Wet areas wherever supply or waste piping is hidden (ceilings, walls, under concrete) are red flags; report and recommend further evaluation.\n- Much piping is hidden in walls; inspect exposed piping in basements and crawlspaces and look for water damage, stains, or mold as evidence of leaks.\n\n## Supply Piping Materials\n- Service piping runs from the city water main or private well into the house; distribution piping runs within the home from the main valve to fixtures.\n- Copper: widely used since early 1960s; reliable and expensive; Type K or L approved underground, Types K/L/M approved interior; K is thickest, M thinnest; many localities ban Type M; color codes: green=K, blue=L, red=M.\n- Galvanized steel: used 1920s–1960s; interior corrosion reduces flow; life expectancy 40–50 years; seldom installed today except repairs.\n- Lead: used until the 1920s; many lead services remain from main to meter; identify by the ball on the service; report as lead and advise optional water test; lead is soft and bends easily.\n- CPVC: for hot and cold water; solvent-welded; in use since early 1960s; ivory/cream color, sometimes with yellow stripe; not interchangeable with PVC.\n- PVC: cold water only, for service and distribution; solvent-welded; in use since late 1960s; white; Schedule 40 typical, Schedule 80 thicker wall; not for hot water.\n- Polybutylene (PB): gray (Qest) or black; widespread fitting leaks late 1970s–1990s; class action lawsuit no longer active; recommend licensed plumber review if seen.\n- PEX: for hot and cold water; white/clear, red (hot), blue (cold); in use since mid-1990s; service or distribution; freeze-resistant (stretches) but not freeze-proof; uses crimp connections; typically home-run system with separate lines to each fixture.\n- hePEX is for radiant heat only and is stamped “not for potable water.”\n- HDPE: cold water only; service (mains) and underground sprinklers only; common for private wells; black for water, yellow for natural gas; may enter home only to pressure tank, then transition to approved distribution piping.\n\n## Supply Piping Condition and Support\n- Galvanic corrosion occurs when dissimilar metals touch in an electrolyte; copper touching galvanized steel is common, and hot water accelerates it.\n- Prevent galvanic corrosion with dielectric unions (plastic insulating gasket); some electrical inspectors require a brass nipple (pipe less than 6 inches long) instead to maintain an electrical ground path.\n- Avoid galvanized hangers or duct contact with copper; recommend a dielectric union whenever galvanized pipe connects to copper, even without visible corrosion.\n- Horizontal support: copper ≤1\" every 8 ft, ≥1¼\" every 10 ft; galvanized/brass ≤1¼\" every 10 ft, ≥1½\" every 12 ft; CPVC/PVC every 4 ft; PEX every 32 inches; use proper hangers (no wire or sharp edges), usually ½\" straps for plastic.\n- Do not measure support spacing; if pipe sags, recommend additional support.\n- Never assume abandoned pipe unless both ends are visible; advise client to check with owner or recommend plumber review.\n- Report main valve location but never operate it; if water is off, do not turn it on; if client or agent turns it on, report that.\n- Corroded, kinked, or leaking piping: do not touch; recommend a licensed plumber for all plumbing issues.\n- PVC used for hot water is incorrect (should be CPVC); report even if it functions.\n- Frost-proof hose bib must be secured to wall; PVC hose bib protruding from wall may snap off; report.\n- Pipe noises: water hammer is a banging sound on rapid faucet close (air chambers help or can be ignored); pipe groan is a ticking sound, especially hot water in PVC waste lines (proper support and eliminating wood contact help, but piping is often behind walls); make client aware.\n\n## Cross Connections\n- Cross-connection (EPA definition): any actual or potential connection between the public water supply and a source of contamination or pollution.\n- Two types: direct (affected by backpressure or back-siphonage) and indirect (back-siphonage only).\n- Direct example: boiler water supply connected without a backflow preventer; install a backflow preventer (one-way valve).\n- Indirect example: hose left in a utility sink filled with toxic substance; correct by removing the hose.\n- Faucet below the flood rim of a fixture (old tub, bidet) is a cross connection; bidets require a vacuum breaker.\n- Vacuum breakers are needed at outdoor sprinkler systems, garden hose bibs, and bidets; dishwashers often require an air gap device in many areas.\n- Atmospheric vacuum breaker (AVB) opens its air inlet when flow stops, interrupting any back-siphon effect.\n- Water softener, clothes washer, and A/C condensate drains must discharge through a vertical air gap, not directly connect to sanitary drain or vent piping; water softener backwash needs a 2-inch air gap; A/C condensate needs an air gap and a trap after discharge.\n\n## Drainage and Vent Piping Materials\n- Cast iron is used for main drainage, galvanized steel for smaller branches; in use since 1800s; quieter than PVC; lasts 40–50 years horizontally, vertical portions may last longer.\n- PVC (white) is the most widely used DWV material; ABS (black) is also used; both solvent-welded; not typically used together.\n- Brass under-sink drainage (P-traps, tail pieces) is usually chrome-plated; prone to pitting/corrosion; never touch corroded brass—it may be paper-thin and break open.\n- Copper DWV has been used since the 1940s but is not widespread due to cost; Types K, L, M, or DWV acceptable; check bottom of pipe for corrosion; it is noisy.\n- Lead waste piping is from the 1920s–30s; soft and easily bent; no longer code-accepted, but if working it does not need removal (lead poisoning is not an issue with waste piping).\n- Vitrified clay (clay tile) is common in older homes, especially underground to the city sewer; brittle and easily cracked; usually deteriorated underground; excluded from SOP; run lots of water and watch for slow drains.\n\n## Drainage and Vent Piping Condition and Support\n- Every house must have at least one plumbing vent extending through the roof by at least 6 inches, or a whole-house air admittance valve (AAV) in the attic (not allowed in some areas).\n- Vents promote proper drainage and quieter operation; they must terminate 10 feet away and at least 2 feet above any operable window, and at least 1 foot from any wall.\n- In cold climates, roof vents must be minimum 3-inch diameter; warmer climates may allow 1½-inch.\n- If no vent is visible on the roof, check the attic; the vent may stop short or have a whole-house AAV.\n- AAVs are gravity-operated, open on negative pressure, re-close to contain sewer gases; they eliminate individual vent piping and roof penetrations; not allowed in some states/regions (e.g., Illinois and Minnesota statewide).\n- Plumbing vents cannot have A/C condensate drains or anything else connected; vents can tie together in the attic; horizontal vent runs must be pitched so rainwater drains down/out and sewer gas rises up/out.\n- Vents must be open without caps or screens; disconnected or improperly sloped vents allow rainwater and sewer gas into the attic; report.\n- Horizontal support for metal DWV: cast iron 5-ft segments every 5 ft, longer segments every 10 ft; copper every 10 ft; galvanized steel every 12 ft; PVC/ABS every 4 ft with proper hangers.\n- Drainage minimum slope: 3 inches diameter or less = ¼\" per foot; over 3 inches = ⅛\" per foot; slope must be downhill from the fixture.\n- All DWV systems require a cleanout within 5 feet of the waste line building entrance to allow rodding.\n- When inspecting waste piping, operate all fixtures before entering the crawlspace; get under bathrooms, kitchens, and laundry areas; wear rubber gloves to avoid contaminated waste fluids.\n- Common defects to report: cracked cast iron hub, rust cyst (do not touch—it will leak again), leaking ABS/cast iron/PVC, hole in active waste line, back-pitched drain, improperly supported pipe, taped waste line; recommend licensed plumber.\n- A drum trap is a combination P-trap/cleanout; it still meets codes if working.\n"}, {"title": "Module 13 Plumbing Inspection 2", "md": "# Module 13 Plumbing Inspection 2\n\nThis module covers inspecting plumbing fixtures and faucets (bathroom and kitchen), fixture traps, dishwasher drain connections, and water heaters (location, FVIR, combustion air, venting, condition, age/capacity).\n\n## Inspecting Fixtures and Faucets\n\n- Verify each plumbing fixture is properly installed for its intended purpose and location.\n- Actively inspect all fixtures and faucets for visible signs of leakage during the inspection.\n- Confirm fixtures are securely mounted—check that they are tightly fastened to walls, floors, or counters.\n- Operate every accessible fixture and faucet handle/lever to confirm smooth function without binding or sticking.\n\n## Water Pressure\n\n- Acceptable residential water pressure is 30 to 80 PSI.\n- If measuring, test at an exterior hose bib downstream from any pressure regulator; bleed a little water first, then attach the gauge.\n- Read the gauge after the pressure stabilizes; a high reading warrants recommending further evaluation.\n- Measuring numeric pressure is not required by the Standard of Practice; most inspectors rely on functional-flow testing at multiple fixtures instead.\n- Low pressure shows as weak streams/trickles; high pressure shows as water spraying forcefully off fixture surfaces.\n- Homes on hilly terrain or with elevated street pressure typically need a pressure-reducing valve (PRV).\n\n## Fixture Traps\n\n- Every fixture needs a trap; most must be in the same room, except tub/shower pans whose traps go below the floor.\n- A trap's purpose is holding a water seal to block sewer gases from entering living spaces.\n- S-traps are prohibited in modern construction despite functioning adequately; older existing installations may be grandfathered.\n- Unvented S-traps risk slow draining due to trapped air pockets restricting flow.\n- Dry traps occur when closely spaced S-trap loops accelerate water past the second hump, siphoning the lower seal.\n- Adding several inches of vertical pipe between two connected P-traps helps reduce siphon-induced dry trapping.\n- Showers and bathtub traps belong beneath the floor within 24 inches of the fixture opening.\n- Exceeding 24-inch drop distance causes audible noise as falling wastewater strikes the standing trap water.\n- Toilets incorporate integral factory-built traps located directly within the bathroom space itself.\n- An improvised homemade trap formed from corrugated flexible tubing fails code compliance and clogs readily.\n- Corrugated drain pipes lack approval listings and violate standard plumbing regulations across jurisdictions.\n- Grease, soap residue, hair, and debris accumulate quickly inside ribbed corrugated waste lines leading to blockage.\n- Horizontal/sideways-oriented P-traps cannot retain sealing water since gravity prevents pooling in rotated bends.\n- Missing low-point curvature allows raw sewage vapors unrestricted passage upward through open sink connections.\n- Double/tandem installed traps create excessive resistance slowing effluent movement toward main stack unnecessarily.\n- Stacking multiple consecutive traps violates accepted practice requiring immediate professional correction via licensed contractor.\n- Bottle-shaped decorative traps face legality restrictions varying regionally—verify acceptance against applicable municipal/state standards.\n- Some authorities reject bottle traps outright while others permit usage solely based upon aesthetic preference considerations.\n- Improperly positioned unventilated shower traps warrant written deficiency report recommending certified plumber assessment promptly.\n\n## Bathroom Fixtures\n\n- Run all fixtures in the same bathroom simultaneously; avoid testing fixtures on different floors together—this risks overflow accidents and unfair results.\n- Report low flow or reduced pressure when adding a third or fourth simultaneous fixture reveals noticeable drop.\n- Verify toilet is secure/tight to floor; grab gently and rock to detect movement.\n- Confirm sink is firmly attached to vanity or wall without looseness.\n- Check for soft flooring near toilets, tubs, and showers per Module 11 methods.\n- Examine walls for softness and loose/missing tiles around tub/shower enclosures per Module 10 techniques.\n- Test sinks by running hot and cold water concurrently; leave water running while checking underneath for leaks.\n- Before flushing toilet, lift lid and inspect bowl interior for potential clog obstructions.\n- Flush toilet while sink remains running; verify adequate refill performance.\n- Operate tub/shower with sink flowing and toilet tank filling; expect decent shower stream under combined demand.\n- Trickling shower indicates low water flow; document and recommend licensed plumber evaluation.\n- Any bathroom should support at least three concurrent fixtures before visible flow reduction occurs.\n- Low flow commonly stems from aging household piping systems.\n- Maintain minimum 1-inch air gap between faucet discharge outlet and fixture's flood rim level.\n- Pedestal sinks require anchoring to wall framing via hidden mounting holes; test stability by gentle lateral pulls.\n- Pulling outward on pedestal sides revealing motion warrants reporting as unsecured condition.\n- Cracked porcelain sinks leaking necessitate replacement recommendation regardless of severity.\n- Non-leaking cosmetic cracks may warrant disclosure based on client presence or documentation preference.\n- Dripping faucets anywhere merit reporting despite frequent occurrence; correction often simple DIY task.\n- All faucets nationwide follow convention: hot positioned left, cold right when facing fixture directly.\n- Reverse orientation requires noting in written findings.\n- For bathtubs including Roman style, determine left/right perspective seated inside tub rather than standing outside.\n- Optional thermal checks exceeding standards reveal unsafe temperatures; cap recommended limit at 120°F maximum.\n- Excessively heated tap water signals adjustment needed at water heater thermostat setting.\n- Air admittance valves belong beneath sinks exclusively; prohibited locations include enclosed linen cabinets.\n- Supply stops serving sinks/toilets aren't routine operational controls; refrain from exercising unless troubleshooting absence of flow.\n- Closed shutoff discovered prevents operation; record status instead of opening manually.\n- Lightly touch accessible shutoffs detecting dampness indicating active leakage requiring attention.\n- Proper handles mandatory on isolation valves ensuring future operability emergencies.\n- Cracks appearing subtle upright become evident crouching closer to toilet elevation.\n- Typical single-family inspection duration approximates 2½ hours; significantly faster pacing suggests overlooked details.\n- Base fractures plus absent T-bolts compromise structural integrity securing commode to flange below.\n- Wax rings create waterproof seals sandwiched between toilet base and closet flange surfaces.\n- Persistent post-flush running necessitates closing integral shutoff valve preventing waste until repair completion.\n- Interior tank examination occasionally uncovers improvised repairs involving foreign materials affecting function reliability.\n- Moisture readings taken systematically around toilet bases identify historical seepage patterns invisible visually.\n- Dry staining evidence alone justifies inclusion since prior saturation implies compromised sealing components.\n- Accessible undersides exposed basements/crawlspaces permit direct observation subfloor deterioration conditions.\n- Minimum clear width spanning parallel enclosing walls equals thirty inches measured perpendicular axis.\n- Centerline distance separating adjacent vertical surface edge establishes fifteen inch baseline requirement.\n- Front obstruction spacing mandates twenty-one inches toward opposite boundary elements inclusive doors swing paths.\n- Code variations exist regarding exact frontal dimensions though comparable ranges apply universally.\n- Constricted installations impede ergonomic usability creating uncomfortable experiences occupants endure daily.\n- Bathtub adjacency permits leaning compensation unavailable solid partitions causing collision hazards seating transitions.\n- Narrow corridors linking entry points amenities complicate circulation pathways particularly accessing secondary compartments.\n- Basement lavatories proximate utility infrastructure similarly constrain maneuverability demanding explicit acknowledgment reports.\n- Client awareness essential documenting unconventional layouts irrespective perceived acceptance levels homeowners express casually.\n\n### Bathroom Fixtures (Walls, Leaks)\n\n- Report awkward fixture arrangements (e.g., tub exit blocked by toilet), even if seemingly obvious—never assume clients notice such issues.\n- Wet-area walls must be water-resistant; interior-grade paneling near a tub risks future mold growth regardless of coatings applied.\n- Windows within 60 inches of a tub floor require safety glass; ordinary glass poses an injury hazard and warrants reporting.\n- Write up leaking faucet handles, shower diverters, and non-operating shower sprayers; recommend evaluation by a licensed plumber.\n- Visible staining around a showerhead indicates leakage into the wall cavity; note it for plumbing repair plus subsequent wall restoration.\n\n### Shower Stalls\n\n- Shower stall doors should swing outward for emergency access; inward-opening doors hinder rescue efforts in compact spaces.\n- Enclosure glass must be safety glazing per standards; verify compliance during inspections.\n- Minimum acceptable shower stall dimension is 30 by 30 inches; anything smaller restricts usability significantly.\n- Run the shower briefly to test drainage; standing water or ponding in corners means improper slope and requires reporting.\n- Note obstructions preventing full door opening (like adjacent toilets)—clients often overlook functional clearances unless explicitly shown.\n\n### Whirlpool Tubs\n\n- Fill water approximately one inch above jet openings prior to operation; lower levels cause spraying onto surrounding surfaces.\n- Many models feature sensors requiring submersion (often several inches higher than jets) before activation engages safely.\n- Verify adequate service access exists for pumps; inaccessible units complicate future maintenance and warrant written comments.\n- Confirm GFCI protection via dedicated circuit breaker or receptacle located behind pump panels; absence demands correction recommendation.\n- Louvered enclosures count as permanent barriers—removal exceeds routine scope, though visual checks through vents remain permissible.\n\n## Kitchen Fixtures\n\n- Operate garbage disposal only with water running; first check for obstructions—forks, knives, or broken glass commonly fall inside.\n- Inspector is under no obligation to remove disposal obstructions; may report unit as blocked and untested instead.\n- Before testing disposal, push down rubber flap and shine flashlight in to verify it's clear; never insert fingers deep inside.\n- Run dishwasher through a complete cycle without soap to confirm draining/pumping functions work properly.\n- Utility and bar sinks must also be inspected along with main kitchen fixtures.\n- Ordinary wear-and-tear on kitchen fixtures isn't typically reported unless seller claims full remodel/new construction contradicts actual condition.\n- Kitchen sink sprayers frequently leak into base cabinet below; check both retractable-faucet types and separate mounted sprayers.\n- Active leaks discovered during inspection: turn off water promptly, mop up with your own clean rags/paper towels to protect cabinet.\n- Dry water stains with no active source: note location and advise client to ask current owner about prior leak history.\n- Sink leaking at rim damages particle-board countertops via water wicking; report and recommend correction by plumber or carpenter.\n- Proper island-sink venting (without AAV): vent pipe loops upward as high as possible beneath sink, then returns downward.\n\n## Dishwasher Drain\n\n- Even if skipping appliance inspections, inspector must observe dishwasher drain connection under kitchen sink since it's a plumbing function.\n- Dishwasher drain must connect on house side of P-trap; otherwise sewer gas backs up into dishwasher interior.\n- High loop required by all manufacturers: drain tube runs as high as possible under countertop/sink rim before descending to connection.\n- Connecting dishwasher to disposal without high loop creates cross connection allowing foul odors and contaminated food backup.\n- Drain connected beyond trap plus missing high loop voids manufacturer warranty; sewer gas could enter drain tubing.\n- Missing high loop combined with unvented S-trap causes discharge backup into sink due to trapped air pressure.\n- Self-installed dishwashers commonly lack high loop when connected directly to disposal inlet.\n- Without high loop, dishwasher can siphon dry on second cycle as residual water drains away following initial pump-out.\n- Some states/local codes mandate air-gap device mounted on sink rim for dishwasher drainage protection.\n- Certain states prohibit direct dishwasher-to-disposal connections entirely, preventing cross-contamination risk absent high loop.\n- Upstairs dishwasher draining straight down to basement sewer lacks high loop; siphons water out during subsequent wash cycles.\n- Air-gap devices route dishwasher discharge through internal overflow path; backups spill harmlessly onto counter rather than re-entering machine.\n- Incorrectly piped air-gap device sends discharged water up wrong pipe, causing continuous runoff into sink basin.\n- States disallowing disposal connections require dishwasher drain attached to sink tailpiece on house side of P-trap with adequate high loop.\n- Cross connection forms whenever disposal-connected drain lacks high loop, permitting waste migration between systems.\n- Configuration routing sink wastewater into dishwasher hose occurs when drain connects improperly downstream of trap.\n- Dishwasher discharging into open, untrapped pipe allows water splashing/bounce-back causing surrounding wood rot and floor damage.\n\n## Water Heaters - Location\n\n- All units need proper clearances for servicing; water heaters inaccessible due to placement (e.g., behind furnaces) should be reported.\n- Combustion units cannot be in bedrooms, bathrooms, or closets serving those rooms—risk of carbon monoxide and oxygen depletion.\n- Electric water heaters can be placed anywhere since they produce no combustion products.\n- Non-FVIR units: flame/spark devices must be at least 18 inches above garage floor; post-July 2003 FVIR types may sit directly on floor.\n- Local exception exists allowing combustion units in bedroom/bathroom closets if fitted with listed self-closing gasketed door and outdoor combustion air supply; verify locally.\n\n## Water Heaters - FVIR\n\n- Since July 1, 2003, residential water heaters are Flammable Vapor Ignition Resistant (FVIR); older non-FVIR units remain in service.\n- FVIR design prevents ignition of external flammable vapors (like spilled gasoline); vapors ignite only inside combustion chamber.\n- Thermal cutoff trips when internal vapor ignition occurs; homeowners cannot reset it.\n- Units have sealed inner panels with small viewing ports only—opening voids warranty; burners cannot be inspected.\n- Pilots on FVIR units can only be lit via spark igniter; point out instructions to clients.\n\n## Water Heaters - Combustion Air\n\n- Required for gas, propane, and oil units only; electric units need none.\n- Lack of combustion air causes incomplete combustion producing carbon monoxide—a dangerous condition.\n- Sealed closets without grilles/louvers/openings starve the water heater of oxygen; ample air must be provided.\n- Review location alongside heating equipment (Module 15 covers detailed parameters).\n- Refer any water-heater defects to a licensed plumber.\n\n## Water Heaters - Venting\n\n- Gas/propane: single-wall vents require 6″ clearance to combustibles; double-wall B-vent requires 1″ clearance.\n- Oil-fired: single-wall vents require 9″ clearance; double-wall L-vent requires 3″ clearance (oil burns hotter).\n- Vent connectors must rise minimum ¼″ per foot toward chimney; back-pitching causes dangerous back-drafting.\n- Check for separation from draft diverter, crushed diverters, excessive soot, corrosion from condensation—all reportable defects.\n- Distinguish B-vent (dimpled, screw-less twist-lock joints) from single-wall (sheet-metal appearance, screwed seams).\n- Never use thin clothes-dryer vent material for combustion venting; rated flexible connectors are thick and carry listing labels/collars.\n- Direct vent systems draw air in and exhaust through same concentric double-wall vent; power vent units blow products out via blower (up to 100′ away using 3″ PVC) and may run dead-level.\n\n## Water Heaters - Overall Condition\n\n- Inspect top-down for corrosion/damage at top and bottom—top damage suggests pipe leaks or vent condensation; bottom corrosion signals active leak/end-of-life failure.\n- Pre-FVIR units: both inner and outer combustion-chamber doors must be present; missing inner door on FVIR voids warranty entirely.\n- Extra insulation jackets conceal underlying defects and void manufacturer warranties—report both facts regardless of brand (~4 makers exist).\n- Burner should center beneath flue opening (hard to confirm on sealed FVIR designs).\n- Report bulges at outer seams immediately—could indicate failing inner tank risking explosion.\n\n## Water Heaters - Age and Capacity\n\n- Determining exact age is not required by any SOP, but ASHI® SOP requires reporting when a major component is near the end of its service life, so an approximate age is needed; some other association SOPs and state laws specifically exclude life-expectancy comments.\n- Capacity is always on the name/data tag; reporting it is not required but most report forms have a field for it.\n- Age is in the serial number (not the model number) — year of manufacture is usually within the first 2–4 digits; some brands use letter codes for month/year.\n- Cross-check the age estimate against the ANSI revision date on the spec tag (unit cannot predate it); ICA's Reference Library has a water-heater age guide.\n- Storage-tank combustion water heaters last ~10–12 years (national average); ~4–5 years on aggressive well water, up to 20–30 years on soft lake water.\n- Regardless of region, report the water heater as near the end of its service life at 10 years or older.\n"}, {"title": "Module 14 Plumbing Inspection 3", "md": "# Module 14 Plumbing Inspection 3\n\nThis module covers inspection of water heater piping and operation, electric and tankless water heaters, gas piping materials and installation, oil tanks, sewage ejector pumps, and sump pumps.\n\n## Water Heater Piping and TPR Valve\n\n- A shut-off valve is required on the cold water supply within a few feet of the water heater so the unit can be serviced without shutting off water to the whole house.\n- A gas shut-off valve must be within a few feet of the unit, in the same room, and located before a union fitting; a drip leg is recommended on the gas pipe to trap sediment and debris.\n- Union fittings are required on all pipes within 5 feet of the water heater (hot, cold, and fuel); listed flexible connectors may count in some areas, and unions allow easy water heater replacement.\n- The TPR valve must be rated for a maximum of 210°F and 150 psi, and its discharge pipe must be 3/4-inch diameter, extend to within 24 inches of the floor (some areas require 6 inches or exterior termination), and have no threads on the open end.\n- TPR valves must not be tested during an inspection; testing is excluded from Standards of Practice and can cause the valve to leak.\n- A missing TPR valve discharge pipe is a common, serious safety hazard; capped TPR valves are extremely dangerous and require immediate correction by a licensed plumber because they can allow the water heater to explode.\n- TPR valve discharge piping must flow downward, should have only one elbow, and must not be tied into a sewer or drain; upward routing or multiple elbows are improper.\n- Doubled TPR valves are dangerous because the second valve may not open in time to prevent explosion; recommend evaluation.\n- An expansion tank may be required by some local authorities because a water heater is a pressure vessel; if hung on CPVC piping, it can sag and needs proper support or metal pipe.\n- Seismic straps and a flexible gas connector are required for water heaters in earthquake-prone areas (e.g., west coast) to prevent tipping and gas line breaks.\n- CPVC plastic piping must not connect directly to a combustion unit; metal nipples at least 6 inches long are required between the unit and plastic transition.\n\n## Water Heater Operation and Defects\n\n- If gas or oil to a combustion appliance is shut off, leave it off and report it; do not relight a standing pilot, and ask the owner for the reason.\n- To verify operation, run hot water from a nearby faucet rather than adjusting the thermostat; if you do adjust it, reset it to the original setting.\n- Check for backdrafting at the draft diverter only after the unit has fired for at least a minute; brief backdrafting for the first 30–45 seconds is normal.\n- Popping or gurgling noises from a combustion water heater indicate sediment at the bottom of the tank and that the unit is near the end of its life; electric units do not make this noise because elements sit above sediment.\n- Water heater temperature should be no higher than 120–125°F; a measured 143°F is too hot, and a high setting may indicate sediment or a safety issue.\n- A yellow flame means incomplete combustion and carbon monoxide production; a natural gas flame should be blue.\n- Some inspectors measure carbon monoxide in combustion products (beyond the Standard); high levels (e.g., 2,197 ppm) indicate incomplete combustion and a danger if venting fails.\n- Oil-fired water heaters have the same general requirements as gas units, including TPR valve piping.\n- Galvanic corrosion leaks occur when copper contacts galvanized vent material; separate dissimilar metals to avoid failure.\n- Melted plastic sleeves around hot/cold connections indicate severe backdrafting or excessive soot; recommend evaluation by a licensed plumber or heating contractor.\n\n## Electric Water Heaters\n\n- Electric water heaters can be installed almost anywhere with proper electricity because there are no combustion products; most requirements for gas units apply except fuel piping, venting, and combustion chamber issues.\n- Testing heating elements with an ohmmeter or ammeter exceeds the Standard; most inspectors only verify that hot water is produced at fixtures.\n- If one heating element (usually the lower one) is burned out, the unit still provides hot water but at half capacity; resistance testing is safer because power must be off, and ammeter testing requires proper training.\n\n## Tankless Water Heaters\n\n- Larger tankless units (usually gas) provide endless hot water, but cheaper units serve only one fixture; small electric point-of-use units mount under a sink for a single faucet.\n- Tankless operation: a flow sensor detects water flow, ignites the burner, and water passes through a heat exchanger; there is a few-second delay before hot water arrives.\n- Cheaper tankless units ($300–500) serve one fixture; units that handle simultaneous showers cost $1,500–$2,000 (2020 prices).\n- Colder climates require larger BTU units; for example, a unit producing 8.5 gpm at 75°F incoming water produces only about 5 gpm at 45°F incoming water for 110°F output.\n- Gas/propane tankless units have better flow capacity than electric; good gas units operate at 150,000–200,000 BTU input versus 34,000–50,000 BTU for storage tank units.\n- High-BTU tankless units require 5–6 times more combustion air than storage tanks; NFPA 54 requires two openings each with 1 sq in net free area per 1,000 BTU/hr (150–200 sq in per opening for typical units), so a closet door may block sufficient air.\n- Most tankless units are direct vent, drawing combustion air from outside through a concentric vent; units with holes on the front take indoor air and need adequate combustion air.\n- Tankless units require special-order stainless steel vents (not B-vent), with 8–12 inches clearance to combustibles.\n- Maintenance requirements: clean the inline screen filter on the cold water inlet periodically, flush the unit per the manual, and install water heater isolation valves (required by all manufacturers; missing isolation valves is a defect).\n- A pressure relief valve (PRV) is required on the hot water supply; it is not a TPR valve because it has no temperature probe, and plastic piping is usually not directly connected to the unit.\n- Tankless units provide no hot water below a minimum flow rate (typically 0.3 gpm), and repeated short faucet use causes a \"cold water sandwich effect\" due to ignition lag; tanked units do not have this issue.\n- Exterior-mounted tankless units need heat trace tape on piping in any climate that can freeze.\n\n## Gas Piping Materials\n\n- Common gas piping materials include black iron, galvanized, aluminum, copper, brass, CSST, polybutylene (PB), high-density polyethylene (HDPE), and flexible appliance connectors.\n- Black iron is galvanized pipe without the coating; galvanized pipe is accepted for gas piping by major codes and utilities despite installer concerns about flaking.\n- Copper for gas must use flared fittings (never soldered) and be labeled \"Gas\"; copper and brass require low hydrogen sulfide levels (<0.3 grains per 100 cu ft), which federal regulations ensure.\n- Aluminum alloy tubing is not allowed on the exterior or underground; it is most commonly seen in gas log fireplaces.\n- CSST is continuous, bendable stainless steel with a yellow PVC jacket, usually run from a central manifold to each appliance; it has overtaken black iron because it is lightweight, quick to install, and has fewer connections.\n- CSST must be labeled with size and usage, is not a flexible appliance connector, and all fittings must be in accessible locations (access panels acceptable).\n- CSST must be electrically bonded to the grounding electrode system at the gas service entry with a bonding jumper not smaller than 6 AWG copper (2009 NFPA 54); missing bonding is dangerous and requires immediate review by a qualified electrician.\n- CSST can be punctured by nails; striker plates are recommended where it penetrates wall studs or near potential penetration threats.\n- CSST should not be painted (it must remain yellow and labeled), and kinked CSST indicates amateur installation—recommend evaluation by a licensed plumber or heating contractor.\n- Polybutylene and polyethylene gas piping are for underground use only, may terminate above ground only in a protective sleeved adapter, and use heat-fused or mechanical joints; most utility gas lines are polyethylene (yellow; black is for water).\n- Flexible appliance connectors may not be concealed or pass through floors, walls, ceilings, or appliance housings; maximum length is 3 feet, except 6 feet for ranges or dryers.\n- Uncoated brass appliance connectors (not made since the mid-to-late 1970s) are dangerous and should be replaced immediately; the CPSC safety alert recommends a qualified professional handle replacement.\n\n## Gas Piping Installation and Support\n\n- No gas pipe may run through air ducts, chimneys, vents, or plenums.\n- Steel plate protection is required in a wall if gas piping is less than 1 inch from the face of framing, except for galvanized or black iron pipe.\n- Unions, bushings, and copper/aluminum/CSST connections must be in accessible locations only.\n- Drip legs are good practice to trap dirt and moisture; recommend adding one if missing.\n- Gas shut-off valves are required within a few feet of every appliance and in the same room; an outdoor shut-off is also required.\n- Gas pipes must not be buried under a concrete slab unless in an accessible recess or a schedule 40 steel, iron, or plastic sleeve.\n- Horizontal support for metal gas piping: copper 1 1/4\" or less every 6 ft, over 1 1/4\" every 10 ft; galvanized/black iron 1/2\" every 6 ft, 3/4\" and 1\" every 8 ft, over 1 1/4\" every 10 ft; CSST every 4 ft or per manufacturer.\n- Saddle tee connections are allowed in some areas; if unsure, recommend further evaluation.\n- Propane tank placement: tanks under 750 gallons water capacity must be at least 5 ft from the house, windows, and crawl space openings; 501–2,000 gallon tanks at least 10 ft; filling connection at least 10 ft from ignition sources; nearest line of adjoining property at least 25 ft (minimum 10 ft for any size); tanks should be parallel to the house, not pointing toward it.\n\n## Oil Tanks and Piping\n\n- Fuel oil is still used in some areas; inspect for leaking tanks and pipes.\n- Oil burners must have an emergency shut-off switch in the living space (e.g., at the top of basement stairs), not on the equipment itself.\n- Underground oil tanks are excluded from the inspection Standard; if fill and vent pipes are seen but no tank is found, or an abandoned tank is found, recommend review by an environmental consultant.\n- A leaking fuel oil tank in the basement is an environmental concern; recommend an environmental consultant if any oil may have reached the ground.\n- Leaking fuel oil piping in the basement can be corrected by a qualified heating contractor; no environmental consultant is needed unless ground contamination is suspected.\n- The oil tank level gauge should be operational.\n\n## Sewage Ejector Pumps and Pits\n\n- A sewage ejector pump is needed when the main waste line exits through the foundation wall above a plumbing fixture or floor drain; this arrangement is sometimes called an \"overhead sewer.\"\n- The sewage pit must have an airtight cover and must be connected to the vent system.\n- Pump discharge and vent pipes must be a minimum of 2 inches in diameter, and a check valve is required to prevent backflow.\n- Ejector pits are often hidden in closets; they can be located by running water and listening for the pump.\n- Improper plastic vent material at an ejector pit is not a permanent installation; recommend evaluation by a licensed plumber.\n\n## Sump Pumps and Pits\n\n- Sump pumps handle stormwater/groundwater, not sewage; they keep the water level below the basement or crawl space floor.\n- Sump pits collect groundwater from footing drains, and the pump discharges water well away from the house.\n- A sump pump should not be connected to the sanitary sewer (and never to a septic system); it may usually be connected to a storm sewer.\n- A check valve on a sump pump is optional (unlike a sewage pit), and the
