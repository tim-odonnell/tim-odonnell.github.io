discharge should extend at least 5 feet from the house—more is better.\n- Sump pits need proper covers for safety; never put your hand in the water to activate a float switch.\n- A sump pit does not need to be connected to the plumbing vent system (unlike a sewage ejector pit).\n- Plumbing items not included in a home inspection: well and septic systems, water conditioning systems, fire sprinklers, lawn sprinklers, and solar water heating.\n"}, {"title": "Module 15 Heating Inspection 1", "md": "# Module 15 Heating Inspection 1\n\nThis module covers the inspection of forced-air combustion heating systems, including ASHI Standards of Practice, equipment types, combustion air requirements, component inspection, common defects, and safe operation testing.\n\n## Standard of Practice (ASHI Section 8)\n- Inspector shall open readily openable access panels; a readily openable access panel is one provided for homeowner inspection/maintenance, readily accessible, within normal reach, removable by one person, and not sealed in place.\n- Inspector shall inspect installed heating equipment, vent systems, flues, chimneys, and distribution systems; describe energy source(s) and heating system type.\n- Inspector is NOT required to inspect: interiors of vent systems/flues/chimneys not readily accessible, heat exchangers, humidifiers/dehumidifiers, electric air cleaning/sanitizing devices, ground/water-source/solar/renewable heating systems, or heat-recovery whole-house ventilation systems.\n- Inspector is NOT required to determine heat supply adequacy/distribution balance or adequacy of combustion air components, but should recognize and report obvious deficiencies.\n- Clearances referenced are from national model codes (NFPA); local codes vary—check local building department; all heating defects should be reported and referred to a qualified heating contractor.\n\n## Forced-Air Combustion Basics\n- Combustion equipment (gas, propane, oil) needs large amounts of air for oxygen; heat is transferred to circulation air via a metal heat exchanger, and combustion products exit through chimneys/vents.\n- A cracked heat exchanger can allow combustion products to contaminate circulation air—a serious hazard; such furnaces are usually replaced.\n- Low-efficiency furnaces: open burners, natural draft, 60–65% efficient, mostly old units.\n- Mid-efficiency furnaces: induced draft, monoport/in-shot burners, 80–83% efficient.\n- High-efficiency furnaces: sealed combustion, forced draft, combustion air piped from exterior, 90%+ efficient, also called condensing or “90+” furnaces; exhaust feels like warm moist air.\n- Exterior high-efficiency piping: combustion air intake is the lower pipe, exhaust is the upper pipe, typically 12–24 inches apart; concentric vents combine both in one unit.\n- Furnace configurations: up-flow (blower below burners), down-flow/counter-flow (blower above burners, common on slabs/crawl spaces), horizontal (older style, blower beside burners; replaced with up/down-flow units using conversion kits).\n- Upper-80s efficiency furnaces take combustion air from inside via a grille, unlike sealed 90%+ condensing units piped outdoors.\n\n## Inspection Process\n- Inspection sequence: location (combustion air), vent connector, exterior cabinet, accessories, filter, blower compartment, controls/burners, heat exchanger (as possible), operation.\n\n## Location & Combustion Air\n- Check clearances from combustibles and for servicing, proper combustion air, return air arrangement; oil furnace must be at least 5 feet from an unenclosed oil tank.\n- Combustion furnaces are prohibited in bedrooms, bathrooms, closets serving them, and spaces accessed through them; exceptions: attic furnace accessed from bedroom is OK, and 90+ sealed units may be allowed in bedrooms (check local codes).\n- Propane units in basements/pits require mechanical ventilation because propane is heavier than air; this requirement is often ignored locally—verify local enforcement.\n- Furnaces in bedroom closets create risks of carbon monoxide poisoning and oxygen depletion; always report regardless of how long they have been there.\n- Manufacturer clearance requirements (listing) are on the unit; listed gas-fired units use B-vent (double wall), oil-fired units use L-vent (hotter); flame/spark devices must be at least 18 inches above garage floor.\n- Typical clearance chart: front 3 inches, back/side 0 inches for many units, vent clearance 6 inches (1 inch if B-vent), service clearance 24 inches per manufacturer or 30 inches if not specified.\n- Attic furnaces: should be within 20 feet of access hatch, have a 24-inch-wide solid walkway, and a 30x30-inch service platform; most attic units do not meet these.\n- Combustion air needs: up to 29 cubic feet of air per cubic foot of gas/propane burned; oil requires 215 cubic feet of air per pint of #2 heating oil.\n- NFPA 54 (gas) and NFPA 31 (oil) define unconfined space as at least 50 cubic feet per 1,000 Btu/hr of all appliances in the space; example: 134,000 Btu/hr total requires 6,700 cubic feet (about 838 sq ft with 8-ft ceiling).\n- If the furnace room is not unconfined, it must have two permanent openings to adjacent rooms, each at least 1 square inch free area per 1,000 Btu/hr input, located within 12 inches of floor and ceiling.\n- Metal louvers provide only 75% net free area; wood louvers only 25%; example: 109,000 Btu/hr in a closet needs two 12x12-inch metal louvers.\n- Outdoor combustion air: only one permanent opening needed, 1 square inch per 3,000 Btu/hr, within 12 inches of ceiling; less total air needed because it is dedicated to the equipment.\n- Inadequate combustion air is a common defect—report it and refer to a qualified heating contractor; marginal cases may be accepted by contractors, but clear blockages or solid-door closets with no air source must be reported.\n- Return air intake grilles must be at least 10 feet from any combustion source OR separated by a tight-fitting solid door with a latch; violation can distribute carbon monoxide throughout the house.\n- High-efficiency sealed-combustion furnaces can have return air grilles closer than 10 feet because no combustion products can escape.\n- Garage installations: check return ductwork for holes/damage, ensure burners/pilots/spark igniters are at least 18 inches above floor, and protect equipment from vehicle impact (e.g., pipe bollards).\n\n## Vent Connector\n- Vent connectors must rise a minimum of 1/4 inch per foot to aid convection of combustion products.\n- A smaller vent connector (e.g., water heater) can join a larger one; where two enter a chimney, the larger/higher-Btu vent (furnace) should enter below the smaller one.\n- Clearances from combustibles: gas/propane single-wall vent 6 inches, double-wall B-vent 1 inch; oil single-wall 9 inches, double-wall L-vent 3 inches.\n- Identify B-vent by dimples and no screws; single-wall vent is plain galvanized metal fastened with screws.\n- Defects to report: rusted-through vent connector (can leak carbon monoxide—a leading cause of CO deaths), loose connection at furnace, condensation deposits, corroded holes (check hidden back sides with mirror/camera/fingers), gaps at masonry chimney (must be grouted with fireproof material), and inadequate clearance (e.g., single-wall vent near combustibles).\n- Oil furnaces need a barometric damper that operates easily; it can be used to view vent interior and combustion area.\n\n## Exterior Cabinet & Accessories\n- Report cabinet corrosion, rust, or leaks; high-efficiency furnaces may have condensation leaks.\n- A shut-off switch is required on or near the furnace, within sight; oil furnaces also need an emergency shut-off in or near living space.\n- Humidifiers are excluded from SOP but often leak; give a brief inspection and report obvious defects; Aprilaire-type units need annual filter media change and maintenance.\n\n## Filter\n- Verify a filter is present, properly sized, upstream of the blower, and accessible; it protects the blower and evaporator coil, not occupants.\n- Clogged filters can cause short cycling, AC freeze-ups, and premature heat exchanger failure.\n- Maintenance schedule: disposable filters monthly; 4-inch pleated types (e.g., Space-Gard) 1–2 times per year; electronic pre-filters every 1–6 months, main cells every 6–12 months (Honeywell recommends hosing off or dishwasher cleaning).\n- Report loose, wrong-type, clogged, or inaccessible filters; filters blocked by vent connectors or other obstructions must be corrected.\n\n## Blower Compartment\n- Check door switch (blower interlock) operation: set thermostat to fan ON, heat/cool OFF; blower should run, then stop when the blower compartment panel is removed.\n- Furnaces without central AC may not have a fan setting; pre-1980s units may lack a door switch.\n- A removed, taped, or hot-wired door switch is a safety defect—report it.\n- Inspect blower condition, visible wiring, and interior for stains/corrosion; orange stains indicate moisture from AC condensate or vent connector—report even if dry.\n\n## Controls & Burners\n- Furnace must start from the thermostat; if it won’t, report it; if a smart thermostat cannot be operated, report that the furnace was not operated and recommend further review.\n- Obtain age and capacity data from the nameplate; age is in the serial number, not model number, often in first 2–4 digits; use common sense (e.g., furnace cannot be older than the house).\n- ASHI requires reporting when equipment is near end of service life; forced-air combustion furnaces average about 20 years—report at or beyond 20 years regardless of condition.\n- Age clues: Rheem/Ruud/Weather King serial numbers use third/fourth digit after F or M; Goodman uses first digits; ANSI code revision dates; combination gas valve date codes; newer units often show manufacture date directly.\n- Online resources: buildingcenter.org and Preston’s Guide for equipment ages.\n- If gas/oil is shut off, leave it off; if a standing pilot is out, do not light it—report it.\n- Never touch a hot surface igniter (finger oil ruins it); avoid disturbing wiring; inspection is limited visual.\n- Oil burner components: combustion blower, oil pump, oil filter, reset button, transformer, ignition control; check for oil leaks especially under the pump.\n- Very old furnaces with a gas train (no combination gas valve) lack automatic pilot shut-off—a gas leak occurs if pilot goes out; report as a safety hazard.\n- Uncoated brass appliance connectors (pre-mid/late 1970s) have a CPSC safety alert—replace immediately with plastic-coated brass or stainless steel; do not move appliance to check; report and recommend immediate evaluation.\n- Flexible gas connectors must not run through a furnace cabinet wall.\n- Report charred control wiring, cracked inducer motor housing, condensate leaks, and rust/corrosion blocking burners.\n- High-efficiency sealed combustion units have a viewing port only—never remove the cover; use the port to verify burner ignition.\n- Oil furnaces should have an emergency oil shut-off valve (e.g., Fire-O-Matic) in addition to a living-space shut-off switch.\n\n## Heat Exchanger\n- Heat exchangers are excluded from all Standards of Practice, but visible defects in front of burner ports should be reported (e.g., severe corrosion, obvious holes).\n- For oil furnaces, try to view the heat exchanger through the inspection port with a small camera if possible.\n\n## Operation\n- Operate the furnace last, for at least 5 minutes, and return the thermostat to its original setting.\n- Basic sequence: thermostat calls for heat → burners ignite → circulation blower starts after a short time → thermostat satisfied → burners shut down → blower stops after a short time.\n- Check for: short cycling, back drafting (older units only, at draft hood/diverter), ignition pop or flame roll-out (gas leak or clogged heat exchanger), proper sequence, unusual sounds, and gas leaks (beyond SOP but recommended with a combustible gas detector).\n- Oil furnace checks: short cycling, barometric damper flapping (puff back), oil pump noise (should be inaudible), burner roar should be smooth not rumbling, proper flame through inspection port, black smoke from chimney.\n- Yellow flame indicates incomplete combustion—recommend a qualified heating contractor.\n- Carbon monoxide testing is beyond the SOP; if performed, get proper training for the device (e.g., Bacharach) and understand methods differ from utilities/fire department.\n"}, {"title": "Module 16 Heating Inspection 2", "md": "# Module 16 Heating Inspection 2\n\nThis module covers electric forced-air furnaces, ductwork inspection, boiler types and components, boiler inspection procedures, operation sequences, and radiant heat distribution systems.\n\n## Electric Forced Air Furnaces\n- Electric forced-air furnaces have no combustion air, vent connector, burners, or heat exchanger; inspect the cabinet, accessories, filter, blower compartment, and operation.\n- Heating elements (typically 5 kW each) are controlled by sequencers that energize them at 30–90 second intervals to avoid electrical demand surges; staged furnaces add elements only while the thermostat temperature continues to drop, and may use only one or two elements for minimal demand.\n- The fan limit switch starts the blower when the plenum reaches about 125°F (or with the elements) and shuts off when elements cool; the high limit is typically 200°F, and the switch shuts down equipment on overheating.\n- Testing elements with an ohmmeter or ammeter exceeds the SOP; with a 4-coil unit, two burned-out coils still produce heat but at half capacity. Resistance testing is safer because power is off at the breaker; ammeter testing involves live 240V and requires electrician/heating technician training. Most inspectors only verify heat at registers.\n- Heating elements are behind a panel not intended for homeowner access; individual elements are easily and cheaply replaced, so electric furnaces often remain in service long-term.\n\n## Ductwork\n- Duct materials include steel (most common), rigid fiberglass board, flex-duct (foil-lined metal coil, often insulated), plastic, and asbestos in old homes; inspect where accessible—basements, crawl spaces, attics.\n- All habitable rooms (not closets or pantries) should have a permanent heat source and register/airflow; set the thermostat fan to \"on\" to check airflow; report rooms noticeably warmer or colder.\n- Dirty registers indicate poor filter maintenance and filthy ducts; dirty air can clog the AC evaporator coil and cause freezing.\n- Common duct defects: excessively leaky joints (some leakage is normal), disconnected ductwork, sagging, corrosion/moisture, poor/broken supports, and asbestos; recommend a heating contractor.\n- Damaged/leaking fiberboard duct, flex-duct jacket deteriorated by UV, an active duct open in a crawlspace (unusual—question and report), and condensation on duct from a damp crawlspace (will rust out; moisture-control issue) are all reportable.\n- Under-slab ductwork: lift a few floor registers to inspect; often damaged during slab pour causing no/poor airflow; may be rusted, have standing water, mold, or asbestos. If wet/muddy, control moisture first, then evaluate replace or line; if collapsed, cannot line—may abandon and re-duct through attic.\n- Transite (asbestos material, 1940s–50s) in ductwork: recommend testing; can be lined by a duct lining contractor without tearing up floors. Asbestos at a register: recommend testing by an environmental consultant.\n\n## Boiler Basics and Categories\n- A boiler heats water over burners; hot water or steam moves through pipes to radiators, baseboards, convectors, or radiant tubing, then returns. A boiler is a pressure vessel; water expands when heated, requiring relief valves and expansion tanks; no filters, blowers, or ducts are needed.\n- Categories: steam (only type that actually boils water; since mid-1800s), hydronic circulated (uses a pump; most common), and hydronic gravity (convection, no pump, always old; replaced with circulated when changed).\n\n## Steam Boilers\n- Steam systems are one-pipe (steam up center, condensate down walls) or two-pipe (supply and return); normal operating pressure is 1/2–2 psi; operating temperature is 215°–218°F; relief valve blows at 15 psi.\n- Steam boilers have a water level gauge (sight glass) on the boiler—only steam has this; also have a Hartford Loop (prevents boiler draining dry from wet-return leaks), pressuretrol, automatic water feed (except very old units), pressure and temperature gauges, and a float-type low-water cut-off with blowdown valve to remove sludge (blow down periodically per local water quality).\n- Gauge glass levels: cold starting level 1/2–2/3 full; operating level about 1/3 full or less; low-water danger level just below the bottom of the gauge glass; never operate unless water is visible.\n\n## Circulated Boilers\n- Circulated boiler identification: no sight glass, has a circulating pump (usually on the return side); operating temperature 140°–160°F (may reach 170–175°F); normal pressure 12–15 psi; relief valve blows at 30 psi; has a Tridicator (temp/pressure gauge) and an aquastat controlling water temperature.\n- Uses virtually no make-up water; has a pressure reducing valve (PRV) for make-up water, a backflow preventer upstream of the PRV (required on all boilers connected to the water supply), and a compression tank (older by ceiling, newer next to boiler).\n- May have multiple pumps or zone valves, each serving a separate thermostat for zoned heating; a typical single-zone system has one pump, no zone controls, and one thermostat.\n- Float-type air vent releases hydrogen and oxygen gases from water breakdown; this is why occasional make-up water is needed.\n- High-efficiency circulated boilers take combustion air from outside and exhaust through PVC pipes; they are modulating (variable output) and use digital/smart thermostats.\n\n## Gravity Boilers\n- Gravity boilers are open or closed systems; open has an expansion tank in attic/high point with an open vent/overflow pipe through roof or to basement, no pump; closed has a compression tank without vent/overflow, no pump.\n- They work because a cubic foot of water at 180°F weighs 2 lb less and takes up 5% more space than at 40°F, so hot water rises; no moving parts.\n- A gauge glass on an expansion tank does NOT mean steam—only a gauge glass on the boiler itself means steam.\n- Old (1950s and before), often still work but inefficient; cold start can take hours to reach the farthest radiator; provide even heat in consistent cold; advise client not to expect immediate heat.\n- ASHI requires reporting ancient-looking equipment; other standards allow omitting age if functioning, but noting it is strong customer service.\n\n## Boiler Inspection: Vent, Jacket, and External Components\n- Boiler inspection includes location/combustion air (same as furnaces), vent and jacket, gauges/controls/pumps/piping, inner controls/burners, heat exchanger, and operation.\n- Since the 1980s, most gas boilers have an automatic vent damper that opens only when burners ignite; vent defects (patched, stained, corroded) warrant a heating contractor; some contractors specialize in boilers.\n- Boiler jacket should be free of rust/stains/damage; older boiler outer skin is a loose jacket (slight looseness normal, falling off is a defect); stains mean leaks past or present; leaking underneath may indicate a cracked heat exchanger; scorching at the side means combustion products leaking (possible CO hazard).\n- Boiler must start via thermostat; if shut off at service switch/breaker, leave off and report. Check gauges: circulated ~12 psi even cold; steam 0 psi cold, <2 psi operating; temps: room (cold), 140–180°F hydronic, ~215°F steam.\n- 15 psi on a steam boiler is too high (relief blows at 15 psi)—emergency: evacuate basement, shut off at thermostat; 50+ psi on a circulated boiler is hazardous (relief set at 30 psi)—immediate evaluation.\n- Circulating pumps: check operation and leaks; older boilers may not start pump until water reaches operating temp (30+ min); newer units start pump with burners; pumps should be quiet—feel housing for vibration.\n- Pressure relief valve must have a pipe extension to the floor; missing extension is a scalding hazard. Backflow preventer required on all boilers connected to water supply. Shut-off switch must be within sight of the boiler.\n\n## Inner Controls, Burners, and Heat Exchanger\n- Remove the front panel (readily accessible) to inspect gas valve, pilot/igniter, wiring, limit controls, aquastats, gauges; if gas/oil is off, leave it off; if a standing pilot is out, don't relight; don't disturb wiring.\n- Boiler age: serial numbers are useless; use ANSI code revision date, date codes on combination gas valve and pressure relief valve (e.g., 1986 codes + 1983 ANSI = 1986 boiler).\n- Clearances vary; example boiler needs 59\" clear above, 9\" left, 6\" rear, 6\" front, 1\" right, 6\" flue; not pushed against walls.\n- Remove the flame shield (beyond SOP but easy) to see burners and bottom of heat exchanger; flame roll-out scorch marks indicate gas leak or dirty unit—recommend contractor.\n- Heat exchanger is mostly invisible and excluded from SOP, but a cracked boiler heat exchanger leaks water visible underneath at burners; use flashlight/mirror/phone to view; watch for excessive rust, rust cysts, dripping water; surface rust is normal; if leaking, recommend further evaluation (likely cracked); don't quote prices.\n\n## Operation\n- Let the boiler operate at least 5 minutes to check short cycling and backdrafting.\n- Steam (hot): burners ignite, may cycle off at pressuretrol high limit (2 psi); shut down when thermostat satisfied. Cold steam: burners cycle on/off until steam moves through system; thermostat may take hours.\n- Modern circulated: burners and pump start together; both stop when thermostat satisfied. Older circulated (1960s and earlier): pump may start without burners (hot) or pump won't start until water reaches operating temp (cold, 30+ min); pump may run after burners stop.\n- Gravity: burners fire until water reaches ~180°F; cold start may take 45+ min to reach temp, then slowly cycles; thermostat may take many hours.\n- Gas operation checks: short cycling, backdrafting, ignition pop/flame roll-out (usually gas leak), proper sequence, unusual sounds; gas leak checks recommended beyond SOP; CO optional.\n- Oil operation checks: short cycling, flapping barometric damper (puff back), oil pump noise (should be inaudible), burner roar normal but should be smooth not rumbling/rough, proper flame via inspection port, no black smoke from chimney.\n- Don't operate a steam boiler unless water is visible in the gauge glass; don't operate a circulated boiler unless at least 10 psi on the gauge (0 psi in winter with working boiler likely broken gauge).\n- An older boiler in summer won't deliver heat in 5–10 minutes; advise client heat at radiators could not be verified due to warm season; may offer paid return visit.\n\n## Radiant Heat Distribution\n- Distribution methods: radiators, baseboard convectors, fan coil units (common in older condos), and radiant loops under the floor.\n- Steam radiator air vent may hiss normally; hot water radiators with cold spots at top need bleeding via bleeder valve until water runs out; recurring cold spots may indicate hidden water leaks.\n- Check every radiator valve for leaks by touching underneath; exposed steam piping (215°F) must be insulated/protected.\n- Fan coil units: remove accessible cover, show filter (change monthly); buildings run hot water in winter, chilled water in summer.\n- Radiant floor systems use PEX tubing; under-floor loops require metal reflector plates or insulation batts underneath to push heat up; a 2-inch gap with batt insulation creates a warm plenum; reflector plates give even heat.\n"}, {"title": "Module 17 Heating Inspection 3", "md": "# Module 17 Heating Inspection 3\n\nThis module covers inspection of space heaters, fireplaces, wood stoves, stovepipes, and vent systems, including clearances, safety hazards, and required report language.\n\n## Space Heating\n- Installed space heating warms a single room or area using smaller wall-mounted units; may be gas, propane, or electric.\n- Most combustion gas space heaters are not allowed in bedrooms, bathrooms, or confined spaces due to oxygen depletion and combustion-product leakage (including carbon monoxide); direct vent (sealed) units are often allowed—check local AHJ.\n- Direct vent units use a concentric double vent: the outer section brings in exterior combustion air, the inner section exhausts combustion products, virtually eliminating combustion hazards.\n- Unvented (ventless, vent-free) gas space heaters intentionally vent combustion products into the living space, including water vapor (mold risk) and possible carbon monoxide; they are banned in many states and localities.\n- Inspect space heaters for: location (proper combustion air if needed, clearances from combustibles), exterior cabinet and vent, filter if applicable, controls/burners, heat exchanger if visible, gas/propane leaks, and operation.\n- Combustion heaters of any type except direct vent units should not be in bedrooms or bathrooms.\n- Newer gas space heaters (since the 1980s) usually have oxygen depletion sensors meant to shut off below 18% oxygen, but testing shows these sensors are not always reliable.\n- Ventless gas units are subject to manufacturer requirements, including minimum room size in cubic feet and maximum operation times.\n- Recommended report comment for a ventless gas space heater: “A ventless gas space heater was present, which vents combustion products directly into the living space. These units are not designed to be a primary source of heat: installation and operation in complete accordance with the manufacturer’s requirements is strongly recommended.” If illegal locally, report that it does not appear installed in accordance with local practice.\n- Typical direct vent space heater clearances: 36 inches clear at top, 12 inches at sides, 24 inches in front.\n- The outer cover on most space heaters lifts off without tools; remove it for inspection—cracked heat exchangers may be plainly visible and should be reported even though heat exchangers are excluded from the SOP.\n- Any wall heater (electric or combustion) must be at least 12 inches from the edge of a door and never behind a door.\n- Electric baseboard and wall units can exceed 200°F; keep electrical cords, drapes, and furnishings away—cords melt and draperies can scorch or ignite.\n- Electric wall heaters accumulate lint and must be cleaned annually (more often in dusty/laundry areas); a lint fire is a serious hazard.\n- Floor furnaces hang below the floor (require basement/crawlspace), collect dirt, debris, and toys through the grille, and should be cleaned/vacuumed and reviewed annually by a heating contractor.\n- Floor furnaces must be at least 12 inches from the edge of a door.\n- Old floor furnaces may have bare brass gas connectors (covered by CPSC safety alert) and cracked heat exchangers.\n- Permanently installed space heaters in garages are included by reference in the SOP and must be inspected; if gas is shut off, report it as shut off; if operable, operate it.\n\n## Fireplace Standard of Practice\n- ASHI SOP section 12 requires inspection of fuel-burning fireplaces, stoves, fireplace inserts, fuel-burning accessories, and chimneys/vent systems, and requires describing those systems/components.\n- Not required to inspect: interiors of vent systems/flues/chimneys not readily accessible, fire screens/doors, seals/gaskets, automatic fuel feed devices, mantles/fireplace surrounds, combustion air components or their adequacy, heat distribution assists, and fuel-burning appliances outside the inspected structure.\n- Not required to determine draft characteristics or to move fireplace inserts, stoves, or firebox contents.\n\n## Fireplace Components\n- Know the proper names: smoke chamber, damper, mantle, smoke shelf, casing, facing, throat, lintel, firebox, ash pit cover, hearth, cleanout door, ash pit, foundation.\n\n## Fireplace Types\n- Fireplaces may be masonry or manufactured metal boxes with refractory panels; built-in or freestanding; conventional, direct vent, or ventless; wood-burning, gas-starting, gas log, or alcohol gel.\n- Conventional wood-burning fireplaces are poor efficiency—massive amounts of heated indoor air escape up the chimney, often removing more heat than they contribute.\n- Direct vent fireplaces use a concentric metal vent (outer pulls combustion air, inner exhausts); a fan circulates room air around the firebox, keeping it separate from combustion products, and radiant heat passes through the glass.\n- To confirm a fireplace is direct vent rather than ventless, check the exterior for the concentric vent termination.\n- Ventless fireplaces vent combustion products into the living space, are not approved for bedrooms/bathrooms, are banned in Canada and several US states, and can increase humidity/mold.\n- Recommended report comment for a ventless gas fireplace: “A ventless gas fireplace was present, which vents combustion products directly into the living space. These units are not designed to be a primary source of heat and should only be installed and operated in complete accordance with the manufacturer’s recommendations.” If illegal locally, report it as not conforming with local requirements.\n\n## Wood Stoves\n- Wood stoves may be stand-alone, hearth-mount, or inserts; often use clearance reduction systems (factory-provided or site-built per NFPA 211); includes pellet stoves and masonry heaters.\n- Pellet stoves burn compressed wood or corn pellets (some burn wheat, seeds, cherry pits), feed fuel from a hopper into a burn-pot, produce a hot constant flame, and require electricity for blowers.\n- A masonry heater is a wood stove surrounded by stone/masonry thermal mass that radiates heat for many hours (up to 24+ hours).\n- Wood stoves cause over 5,000 residential fires annually in the US; all are preventable.\n- Wood stove surface temperatures regularly exceed 400°F; firebox temperatures exceed 1,000°F.\n- Listed stoves (most since the 1980s, tested by UL or other lab) are installed per manufacturer; unlisted stoves are installed per NFPA 211; local code may supersede both.\n- Recommended report comment for any wood stove: “A wood stove was present, which operates at high temperatures and should only be installed and operated in complete accordance with the manufacturer’s instructions. Be sure to keep children well away from the stove when in use. All wood stoves should be cleaned and inspected by a qualified chimney sweep prior to the start of each heating season.”\n\n## Clearances\n- Clearances in this course are based on national model codes; local codes and practice vary.\n- Clearances for stoves, manufactured fireplaces, and Class A solid-fuel appliance vents are as listed by the manufacturer, but local code may supersede the listing.\n\n## Inspecting Fireplaces\n- Inspect: exterior condition, clearances from combustibles, hearth extension, doors/screens/glass, hidden piping/controls if accessible, firebox and damper, gas control, flue as possible; recommend a fireplace specialist for defects.\n- Exterior soot may indicate overloading, poor draft, or a clogged flue.\n- No combustible material within 6 inches of the firebox opening for material up to 1.5 inches thick (sealed direct vent/vent-free units usually exempt); no combustible material within 12 inches if material is over 1.5 inches thick.\n- Hearth extension must be at least 16 inches deep from the front and 8 inches to each side for openings less than 6 square feet; at least 20 inches deep and 12 inches to each side for openings 6 square feet or greater.\n- In crawlspaces/basements, check under the fireplace for charred framing under the hearth extension—a gap between firebox and hearth can allow embers to fall onto wood framing.\n- Doors and screens should operate smoothly; report obvious defects even though excluded from the SOP.\n- Gas log units often have a room air circulation damper; verify it opens and closes.\n- Hidden gas controls behind access panels should be checked for leaks; if gas is shut off, report that the unit could not be tested.\n- Firebox defects: loose/cracked bricks, loose/missing mortar, cracked refractory panels, rusted-out metal liners (common in 1940s–50s fireplaces at top, bottom, damper, and smoke shelf).\n- Damper should work smoothly and easily; firebox should be free of soot, ash, and creosote.\n- Creosote is a fire hazard; stage 3 glazed creosote is a fire waiting to happen—recommend immediate cleaning and no operation until cleaned.\n- Do not move ash/soot in the firebox; recommend cleaning and further review by a chimney sweep.\n- A chain in the firebox indicates a flue-top damper; check its operation.\n- Corkscrew damper actuators commonly fail when a pin rusts away, causing the damper to collapse; report as defective.\n- A gas starter for a wood-burning fireplace requires a hard gas line, not an appliance connector, because real burning wood can damage thin connectors.\n- Gas valves must not be located within the firebox; they are acceptable only if an external gas valve also exists.\n- Each wood-burning fireplace or stove requires its own separate flue.\n- Always include in the report: “The majority of the fireplace (or wood stove) flue was not visible: a level II chimney inspection prior to closing is recommended for personal safety.” Include this regardless of visible creosote or seeing light at the top.\n- NFPA 211 14.5.1 requires a level II chimney inspection upon sale or transfer of property; level II includes level I (limited visual exam) plus panel removal, attic/crawlspace/basement entry, and video scanning of flue liner condition, material, sizing, and clearances.\n\n## Inspecting Wood Stoves\n- Inspect: exterior condition, hearth extension, clearances from combustibles, clearance reduction system, doors/glass, firebox/dampers, visible stovepipe; recommend a fireplace specialist for defects.\n- Stove must sit on a non-combustible hearth extending at least 18 inches in front and 8 inches at sides/rear (or per listing); many newer listed stoves need as little as 6 inches clearance due to shields/design.\n- Unlisted (older) stoves need at least 12 inches clearance to combustibles even with the best clearance reduction systems per NFPA 211.\n- Listed stoves have clearance tags (rear for freestanding, front for inserts); tags are often hidden by clearance reduction shields—check the manual or online.\n- If a stove is not listed or listing cannot be determined, unlisted stoves need 36 inches clearance to combustibles, or 12–24 inches with an approved clearance reduction system per NFPA 211 chart 12.6.2.1.\n- NFPA 211 approved clearance reduction systems include masonry walls, noncombustible insulation board, and 24-gauge sheet metal with ventilated air space; sheet metal mounted directly on a surface without an air space is not approved.\n- No unlisted stove may be closer than 12 inches to combustibles regardless of clearance reduction system.\n- Almost any wood-burning stove needs 60 inches top clearance.\n- No hearth extension with carpet in front of a stove is a fire hazard.\n- Check door and latch operation; firebox should show no cracks or wear; check stovepipe damper operation.\n\n## Stovepipes\n- Single-wall stovepipe needs 18 inches clearance to combustibles.\n- Double-wall stovepipe needs 6 inches clearance to combustibles.\n- Horizontal stovepipe runs need a minimum ¼-inch rise per foot to promote proper draft.\n- Stovepipes require a proper thimble where penetrating a wall and a ceiling support box rated for Class A pipe where penetrating a ceiling.\n- Single-wall stovepipe too close to wood framing will char the wood—report as a fire hazard.\n\n## Vent Types\n- Gas fireplaces and inserts burn at 350°F and require a standard B-vent (1-inch clearance all around).\n- Wood fireplaces and stoves burn at 1,100–1,200°F and require a Class A vent (rated to 2,100°F, 2 inches clearance all around; never less than 1.5 inches).\n- Pellet stoves burn at 450°F and require a Class PL vent (rated to 570°F, 3 inches clearance all around).\n- Any of these can use masonry, but the flue must be properly sized.\n- B-vent defects seen in attics: touching roof sheathing (needs 1-inch clearance), corrosion/holes, and separated sections.\n- Sooting at the exterior vent of a direct vent gas fireplace indicates a problem—recommend a fireplace specialist.\n- Recommend that clients have all chimneys cleaned and inspected annually by a qualified chimney sweep; thousands of chimney fires occur yearly and are preventable.\n"}, {"title": "Module 18 Air Conditioning Inspection 1", "md": "# Module 18 Air Conditioning Inspection 1\n\nThis module covers the ASHI Standard of Practice for air conditioning, system styles and types, heat transfer principles, inspection procedures for exterior and interior components, age/capacity determination, and safe operation testing.\n\n## Standard of Practice\n- ASHI SOP section 9 requires opening readily openable access panels; inspecting central and permanently installed cooling equipment and distribution systems; describing energy source(s) and cooling system type. \"Readily openable access panel\" means a panel provided for homeowner inspection/maintenance, readily accessible, within normal reach, removable by one person, and not sealed in place.\n- ASHI SOP does not require inspecting electric air cleaning/sanitizing devices, determining cooling supply adequacy/balance, inspecting window or non-permanently installed units, or inspecting ground-source/water-source/solar/renewable cooling systems (e.g., geothermal); instructor recommends inspecting geothermal anyway as customer service.\n\n## Air Conditioning Maintenance\n- Recommend annual maintenance by a qualified heating contractor; all defects should be referred to a qualified heating contractor for review/correction.\n- Air filter maintenance: 1-inch disposable filters monthly; 4-inch high-efficiency filters 1–2 times per year; electronic filters cleaned several times per year.\n\n## Central Air Conditioning Styles and Types\n- Split system (most common) has compressor/condenser outside and evaporator coil inside with an air handler (usually a forced-air furnace); includes conventional forced air, high-velocity, and ductless mini-splits. Package unit (common in southeast) has compressor, condenser, and evaporator coil in one exterior cabinet; may provide both heating and cooling.\n- Top-discharge units are standard; side-discharge units are old. High-velocity systems use 2-inch diameter ducts, often for retrofits. Ductless mini-splits have an interior evaporator/air handler per room or combined space.\n- Electric (vapor compression) is by far the most common; natural-gas-fired absorption units exist but are rare in residential. Chilled/hot water fan coil units are common in older/high-rise condos; water comes from a building common boiler/chiller, and heating/cooling availability dates are set by association bylaws.\n\n## Heat Transfer\n- Refrigerant captures heat from one location and releases it in another, cycling from liquid to gas and back; pressure manipulates boiling points. R22 boils at -40°F; R410A boils at -58°F.\n- Refrigerants absorb heat when changing liquid to gas (endothermic at evaporator coil) and release heat when changing gas to liquid (exothermic at condenser coil); expansion valve regulates the phase change. Line set is copper tubing: larger insulated suction line and smaller uninsulated liquid line.\n- One ton of cooling = 12,000 BTUs; capacity reporting is optional. Technically we remove heat from a space, not \"cool\" it. SEER = Seasonal Energy Efficiency Ratio; higher SEER means less energy. Current minimum is 13 or 14 depending on area; previous standard 10; pre-1995 units may be 6–7; units up to 27 SEER available; higher SEER generally means larger physical unit.\n\n## Inspecting Central A/C\n- Inspection process: check exterior unit location/condition and line set, take nameplate data; check interior air handler and line set; condensate drain; filter and blower compartment; operate if temperature permits. Interior components are usually part of heating inspection.\n\n## Exterior Unit Condition\n- Top-discharge exterior units need 5 feet clear at top and 12 inches at sides; poor clearance reduces efficiency and can shorten equipment life. Unit should be level and plumb; settled pad should be re-leveled; unsupported pad can shift/topple; unit moving off pad can break line set and release refrigerant.\n- Dryer vent should be at least 5 feet away from exterior unit (manufacturers say 3) to prevent lint clogging condenser coil. Condenser fins clogged/dirty, leaves/mulch, or foliage within 12 inches restrict airflow and reduce efficiency; keep clear.\n- Hail damage or impact can reduce efficiency and cause refrigerant leaks; pressure washing can ruin fins and require replacement; dog urine acids eat aluminum fins and expose coil—only fix is replacing exterior unit. Older/rusted unit may still work safely; report if beyond expected lifespan.\n- Condo/townhouse units often unlabeled; use clues (running unit, age, labels); if unsure report \"unable to identify, recommend checking with current owner\"; roof-mounted units may be inaccessible.\n- Suction line must be insulated entire length; any frost on suction line should be reported (possible refrigerant deficiency or inadequate airflow). Frozen lines can harm compressor—immediately turn unit off and advise servicing.\n- Exterior unit mounted on supporting brackets sitting too close to bracket edge warrants caution flag; recommend further evaluation.\n\n## Age and Capacity Data\n- Age is in serial number (usually first 2–4 digits); capacity is in model number (number divisible by 12, e.g., 36/12 = 3 tons); maximum amperage on nameplate should be compared with breaker/fuse protection—exceeding it voids warranty only if unit is less than five years old.\n- ASHI requires reporting when components are near end of service life; other standards/state laws may exclude life-expectancy comments. Average lifespans: exterior condenser/compressor ~15 years; air-source heat pump 12–14 years; geothermal 20–25 years.\n- Capacity can also be estimated by dividing compressor RLA by 7 for very old units or 6 for 10 SEER or better (since ~1995); report capacity as \"estimated capacity.\" Manufacturer coding: Rheem/Ruud/WeatherKing age is 3rd and 4th digits after letter F or M in serial number; Lennox age is 3rd and 4th digits of serial number. Use common sense (unit appearance, house age, disconnect condition) to verify.\n- Internet resources like buildingcenter.org provide ages for most units including mini-splits and geothermal.\n\n## Interior Air Handler Condition\n- Report any condensate leakage signs (orange stains, water in drip pan, bucket under unit) even if dry; attic units must have a drip pan—all AC units will leak eventually.\n- Frozen evaporator coil shows as condensation on plenum and ice-cold surface; never operate furnace in heating mode if coil is frozen (ice water can damage heat exchanger and flood); report furnace not tested.\n- Attic installation should have drip pan with emergency float switch that shuts off AC before overflow; missing drip pan risks ruining insulation/ceilings. Suction line missing insulation causes condensation dripping; report. Oil leak from evaporator coil or disconnected condensate line: report and recommend heating contractor.\n\n## Condensate Drain\n- Condensate drain must never connect to a plumbing vent in attic; recommend licensed plumber. Emergency drip pan drain must discharge separately, not tie into primary drain (otherwise both clog together).\n- Condensate drain needs an air gap at point of discharge with a trap after; direct connection to sewer allows sewer gas into house.\n- Condensate pump is an accessory not required to test, but report if leaking. Condensate discharging into crawl space causes rotting/mold.\n- Condensate drain routed against hot furnace vent connector will melt; report and refer to qualified heating contractor.\n\n## Filter & Blower Compartment\n- Clogged filters reduce airflow across evaporator coil, can freeze it, and cause liquid slugging (liquid refrigerant returning to compressor) which can destroy compressor. Filthy blower suggests clogged evaporator coil; check airflow at registers. Dirty coil restricts airflow to all rooms.\n\n## Operation\n- Do not operate AC if outdoor temperature has been below 60°F within last 24 hours, or if power to unit has been off (many units need power on at least 12 hours for crankcase heater) to prevent liquid slugging.\n- When operating, there should be no squealing/groaning/vibrating; discharge air from top should be noticeably warmer than ambient. SOP requires inspecting using normal operating controls and readily openable access panels; deciding if unit operates correctly is up to inspector. Most inspectors check for cold air from diffusers; some measure Delta T.\n- Delta T: drop thermostat at least 5°F, let AC run at least 15 minutes; expected temperature drop across evaporator coil is 15–20°F (return ~75°F, supply ~55–60°F). Less than 15°F indicates a problem; over 20°F may be overcharged; over 25°F on old unit may be freshly charged to compensate for a leak.\n- Delta T is not valid for variable-speed units (smart systems vary output); smart thermostats need temporary hold; if can't set lower, report \"programmable thermostat: AC not tested.\"\n- Let unit run 5–10 minutes; liquid line should be warm, suction line cold (not frozen). Temperature drop increases closer to evaporator coil. Use filter slot, supply grille on plenum, or supply register near furnace for probe; feel under contractor labels for test holes.\n- Humidity lowers Delta T: if unit was off and house humid, Delta T may be only 12–14°F. If not measuring Delta T, ensure colder air from diffusers as close as possible to equipment; if air supply not cold near equipment, recommend further evaluation.\n"}, {"title": "Module 19 Air Conditioning Inspection 2", "md": "# Module 19 Air Conditioning Inspection 2\n\nThis module covers ductless mini-split systems, high-velocity A/C, refrigerants, air-source and geothermal heat pumps, through-wall units, and evaporative coolers, including identification, inspection procedures, measurements, and common defects.\n\n## Ductless Split Systems (Mini-Splits)\n\n- Ductless split systems eliminate the large air handler and ductwork, making them ideal for homes with boilers or other ductless heat; many in warmer states are heat pumps.\n- The exterior condenser/compressor connects via a line set to an interior wall-mounted evaporator/air handler; most are bottom-discharge mounted near the ceiling, a few are top-discharge mounted lower on the wall.\n- Bottom-discharge units must be at least 6 feet above the floor, measured to the underside of the air handler.\n- One exterior condenser/compressor can serve 4 to 5 interior evaporator/air handlers; installation requires only a 3-inch hole in the wall.\n- Mini-split equipment costs about 30% more than conventional A/C equipment, but that price excludes ductwork labor and materials, making it competitive.\n- Most mini-splits will not operate in cooling mode if the interior temperature is below 70°F.\n- AC-only mini-splits should not be operated when the exterior temperature is below 65°F.\n- Mini-splits have primary and secondary filters (some have a third); clean or replace them, and many units have a filter indicator light that comes on after about 400 hours of use.\n- Advise clients to clean or change filters monthly and check the owner's manual; filter access is usually from the front and bottom, and many filters can be vacuumed or shaken clean.\n\n## High Velocity Air Conditioning\n\n- High-velocity (\"Hi-V\") systems are more flexible and easier to install than conventional large-duct systems and provide better moisture removal.\n- The Hi-V air handler distributes air through a large trunk line, then through 2-inch diameter plastic tubes to diffusers in floors, walls, or ceilings.\n- Each 2-inch duct must be at least 6 feet long (to act as a muffler) and no more than 30 feet long (beyond that, friction loss reduces airflow).\n- Floor diffusers must have a grill to keep debris out of the 2-inch duct; wall and ceiling diffusers commonly do not have grills.\n- Hi-V systems remove about 30% more humidity than conventional central A/C, allowing the thermostat to be set 2 to 3°F higher for the same comfort.\n- Conventional A/C operates at 400 to 600 cfm/ton at low static pressure; high-velocity A/C operates at up to 2,000 cfm at higher static pressure.\n- Temperature drop (delta T) for a high-velocity system is 20 to 30°F, compared to 15 to 22°F for conventional A/C; measuring delta T is not required by the Standards of Practice.\n\n## Refrigerants\n\n- R-22 (commonly called Freon, which is DuPont's brand name) was the residential refrigerant until 2010; many R-22 systems remain in use.\n- R-22 is an HCFC (hydrochlorofluorocarbon) phased out by the EPA for new equipment because of its chlorine content.\n- R410A, an HFC (hydrofluorocarbon), is the current residential refrigerant; Puron is Carrier's brand name for R410A.\n- Condenser/compressor units designed for R-22 cannot be used with R410A because the refrigerants have different vaporization points; recovered/recycled R-22 can continue to be used in existing R-22 equipment with no legal removal deadline.\n- When an R-22 system is replaced, it must be replaced with an R410A system.\n- Some components (line set, evaporator coil) may be rated for either refrigerant, but the compressor can never be used with both; the installing contractor decides whether to reuse any R-22 components.\n\n## Air Source Heat Pumps\n\n- Heat pumps use refrigerant to transfer heat in either direction—out of the house in cooling or into the house in heating.\n- Most heat pump systems include supplemental or \"emergency\" heat: electric resistance coils or a combustion furnace.\n- Heat energy exists outdoors down to absolute zero (-460°F), but technology and economics limit how well air-source heat pumps operate at low temperatures.\n- A heat pump is essentially a conventional air conditioner with a reversing valve, two metering devices, and two bypass valves; the reversing valve is the defining component.\n- In summer mode, refrigerant absorbs heat indoors and releases it outdoors; in winter mode, the reversing valve reverses flow so refrigerant absorbs heat outdoors and releases it indoors.\n- Heat pump exterior compressors always have a sump/crankcase heater.\n- Air-source heat pumps deliver supply air at about 90°F, versus 110 to 140°F for a combustion furnace, but run longer and provide a more constant temperature; the cooler supply air can feel drafty.\n- Heat pumps consume less primary energy than fossil-fuel heating systems and may be cheaper to operate depending on local electricity costs.\n\n## Inspecting Air Source Heat Pumps\n\n- Inspect the location and condition of the exterior unit and line set, read the nameplate, check the interior air handler, line set, condensate drain, filter and blower compartment, and verify operation and sound.\n- Heat pump identification clues: exterior unit on short legs (to stay above snow), unit appears taller/narrower than typical, both refrigerant lines are insulated, nameplate says \"heat pump,\" or thermostat has an emergency heat setting.\n- Heat pumps should be elevated 4 to 12 inches above the ground in snow states; not all manufacturers provide legs.\n- Do not confuse a heat pump on legs with a conventional A/C unit mounted on a shelf or bracket; read the nameplate carefully (take a photo and enlarge it if needed).\n- An \"emergency heat\" or \"EMHT/EMER\" thermostat setting indicates a heat pump; emergency heat is the backup system (electric coils or furnace).\n- Test the heat pump first by raising the thermostat only 3 to 4 degrees, then test supplemental heat by raising it further or tripping the emergency heat switch; digital thermostats may differ, and the Standards of Practice do not require resetting or reprogramming thermostats.\n- Air-source heat pumps have an expected lifespan of 12 to 14 years; ASHI Standards require advising clients when equipment is beyond its expected lifespan.\n- Heat pumps may be mini-splits, package units, or roof-mounted (common in the Southwest).\n- Locate the exterior unit away from drifting snow, snow sliding off roofs, and prevailing winds; units under gutter drip lines can ice up and restrict airflow.\n- A heat pump completely covered with drifted snow has blocked airflow and can be permanently damaged; turn it off, switch to emergency heat, and recommend evaluation by a qualified contractor.\n- A heat pump shelter works for a mini-split but not for a top-discharge unit.\n- Test a heat pump in cooling mode only when the outdoor temperature is at or above 60°F; test in heating mode only when it is below 60°F.\n- Temperature drop in cooling mode is 15 to 22°F; temperature rise in heating mode is 15 to 30°F.\n- Balance point: the outdoor temperature at which heat pump capacity matches building heat loss; for most current air-source heat pumps it is about 30°F, below which the compressor cannot keep up.\n- Testing in heat mode is not recommended when the outdoor temperature is below 15°F because temperature rise will be too small to measure.\n- Unrestricted heat pumps continue operating at all temperatures, with supplemental heat kicking in near the balance point; a typical unit can still provide some heat down to -10°F.\n- Restricted heat pumps use an outdoor thermostat or sensor to shut off the heat pump below a preset limit (usually near the balance point); only supplemental heat then operates.\n- The outdoor thermostat for a restricted heat pump is usually mounted inside the unit behind a cover and set from 25 to 40°F; an outdoor sensor may be mounted on the soffit.\n- During heating, water running off the outdoor coil is normal condensation.\n- Frost/ice buildup on the outdoor coil triggers a defrost cycle; steam rising from the unit for a few minutes is normal, and supplemental heat may operate during defrost.\n- If the defrost cycle is not working (heavy ice buildup while the fan runs), turn the unit off and recommend repair by a qualified contractor.\n- Some inspectors take amperage or resistance readings on electric supplemental heat, but that is beyond the Standards of Practice; most inspectors simply verify warm air output.\n\n## Geothermal Heat Pumps\n\n- Geothermal heat pumps are also called GHPs, GeoExchange, earth-coupled, ground-source, or water-source heat pumps; first installed in 1945 but not economically feasible then due to high installation costs, cumbersome technology, and low energy costs.\n- Installation costs are 3 to 4 times conventional HVAC, with payback in 5 to 15 years; equipment lasts 20 to 25 years.\n- Installation costs range from $12,000 to $25,000 depending on climate, capacity, available land, and efficiency.\n- Geothermal systems save 30 to 70% on heating and 20 to 50% on cooling costs compared to conventional systems.\n- An optional desuperheater boosts water heater temperature by 5 to 10°F, adding savings.\n- Geothermal is more efficient than air-source because the earth below the frost line is always 50 to 55°F; the ground holds more heat than air in winter and less in summer, making it a better heat sink.\n- Ground loops are usually high-density polyethylene (HDPE) pipes buried in horizontal trenches or vertical boreholes; a transfer fluid of water and glycol circulates through them.\n- Ground loops require hundreds of feet per ton of capacity; vertical and horizontal loops are not typically combined.\n- Geothermal systems have three to four closed circuits: air circuit (ducts), refrigerant circuit (air coil, compressor, expansion valve, water-to-refrigerant heat exchanger, reversing valve; uses R-22 or R410A), ground loop circuit, and optional desuperheater circuit.\n- Only heat energy moves between circuits; only the refrigerant circuit changes direction; the ground-loop transfer fluid always pumps in the same direction.\n- All geothermal equipment is indoors.\n- Ground loop types: vertical (multiple borings, each hundreds of feet deep), horizontal (several hundred feet per ton), slinky (requires less area; depth depends on climate), pond loop (needs at least 8 to 10 feet of water depth; uses a pond plate or plain polyethylene tubing), and open well loop; pond loops require pond access.\n\n## Geothermal Heat Pump Types\n\n- Three main types: package units (water-to-air) with compressor, air coil, blower, and coax in one cabinet; split units with compressor separate from the air handler, connected by a refrigerant line set; and hydronic units (water-to-water) that send hot or cold water to fan coil units or radiant floor loops.\n- The package unit is the most common; its flow center contains circulating pumps and three-way valves for flushing, which should be done periodically (about annually).\n- If defects are found, recommend evaluation by a qualified geothermal heat pump installer because it is a specialty trade.\n- A desuperheater is a hot-water assist with a storage tank that provides only a 5 to 10°F boost; it is not commonly installed.\n- Geothermal equipment life expectancy is 20 to 25 years; ground loops are expected to last 50+ years (HDPE tubing may last 100+ years).\n- Maximum supply air temperature in heating mode is about 125°F, but typically 85 to 95°F.\n- Hybrid systems reduce installation costs: geothermal heat with air-source cooling in the South, geothermal cooling with gas heating in the far North, and dual-source units combining geothermal with air-to-air.\n\n## GHP Inspection Issues\n\n- Although ASHI Standards exclude geothermal heat pumps, the instructor recommends inspecting them because they are no more difficult than forced-air systems.\n- GHP blowers and filters are the same as any forced-air system; boiler-related issues (pumps, pipes, leaks) apply, and GHP circulating pumps are essentially the same as boiler pumps.\n- Inspect overall condition, piping, pumps, and air filter; check the system in both heating and cooling modes in all seasons (heating has a time delay).\n- Per WaterFurnace: temperature rise in heating mode should be 20 to 35°F; temperature drop in cooling mode should be 15 to 25°F; check backup heat separately.\n- The filter may be in a slot outside the unit; show the client and recommend annual maintenance by a geothermal contractor.\n- Common geothermal brands include WaterFurnace (number one), ClimateMaster, GeoSmart, Lennox, Rheem, Trane, and Carrier.\n\n## Through Wall Air Conditioning\n\n- Through-wall units are essentially window units installed in a wall sleeve; they are included in the Standards of Practice because they are permanently installed.\n- Test that they provide cold air, control knobs work, and there is no physical damage.\n- A foam rubber filter is located under the front panel; snap the panel off to show the client, but use judgment if the panel is old or cracked.\n\n## Evaporative Coolers\n\n- Evaporative coolers (\"swamp coolers\") are used in dry climates; evaporating water and moving air can reduce indoor temperatures by up to 30°F.\n- Cooler pads should be changed 2 to 3 times per year, or when covered with mineral deposits.\n- The unit should be cleaned and winterized every year.\n- Components include a blower, blower motor, evaporative pads, water distribution lines, recirculating pump, float, and pump screen.\n- A leaking swamp cooler on a roof can deposit minerals that damage roof shingles; report and recommend further evaluation.\n- Mineral deposits on the unit indicate it needs cleaning; annual servicing is required.\n"}, {"title": "Module 20 Electrical Inspection 1", "md": "# Module 20 Electrical Inspection 1\n\nThis module covers the fundamentals of residential electrical inspection, including the ASHI Standard of Practice requirements, basic electrical theory and terms, the service drop/lateral, clearances, wire sizing, and service amperage/voltage determination.\n\n## Standard of Practice (ASHI SOP Section 7)\n\n- The inspector shall inspect: service drop, service entrance conductors/cables/raceways, service equipment and main disconnects, service grounding, and interior components of service panels and sub-panels.\n- Removing panel covers is justified by the requirement to inspect interior components of panels.\n- The inspector shall inspect conductors, overcurrent protection devices (breakers/fuses), a representative number of lighting fixtures/switches/receptacles, and GFCIs and AFCIs.\n- \"Representative number\" means one component per room for interior items and one per side of building for exterior items; in a vacant home, checking every outlet is recommended.\n- The inspector shall describe: amperage rating of service, location of main disconnect(s) and sub-panels, presence/absence of smoke and CO alarms, and predominant branch circuit wiring method (e.g., Romex, conduit, knob and tube).\n- The inspector is NOT required to inspect: remote control devices, test smoke/CO alarms or security systems, low-voltage wiring (<120V), ancillary wiring not part of primary power distribution, or solar/geothermal/wind/renewable systems.\n- The inspector is NOT required to measure amperage, voltage, or impedance, nor to determine age/type of smoke/CO alarms (NFPA recommends replacing smoke alarms every 10 years).\n\n## Reporting Electrical Defects\n\n- All electrical defects must be reported, no matter how minor or inexpensive.\n- Report defects in terms of safety, not code.\n- Always recommend further evaluation and correction by a qualified (or licensed, if known) electrician.\n\n## National Electric Code (NEC)\n\n- NEC is the oldest and most widely used code in America; it is safety-focused and the basic language of electrical inspection, but not a how-to guide.\n- NEC affects what inspectors see more than any other code because local jurisdictions adopt different editions.\n- Latest NEC revisions only take effect after adoption by the local Authority Having Jurisdiction (AHJ); AHJs often add their own amendments.\n- Course references are based on the 2017 NEC; local codes and practices vary.\n\n## How Electricity is Delivered\n\n- Two main objectives of an electrical system: provide a safe path for electricity to enter, work, and leave; and dissipate excess heat generated.\n- Electricity moves only through conductors (metals); non-conductors include wood, rubber, plastic, glass.\n- Wires are usually copper, sometimes aluminum; they are sheathed with plastic or rubber insulation.\n- Electromagnetic energy from a source (power plant, generator, battery) moves electrons, creating current.\n- Current must complete a circuit by returning to its source; a switch opens/closes the circuit.\n- Residential current returns to its source via the nearest transformer (intended path) or the Earth (grounding, alternate path); all power plants are connected to Earth.\n- A complete circuit must include a load (motor, lamp, etc.); a circuit without a load is a dangerous short circuit.\n- Current with energy travels on the hot wire; energy is used at the load; current without energy returns on the neutral wire.\n\n## Fundamental Electrical Terms\n\n- Amps/Amperage: quantity of electrical current (like gallons per minute of water).\n- Volts/Voltage: pressure behind current (like psi in a hose).\n- Ohms: resistance to current flow; smaller wires have higher resistance.\n- Watts: rate of work/power produced.\n- Resistance generates heat; more current requires larger wires for safety.\n- Doubling the current quadruples the heat generated.\n- Ohm's Law: Amperage × Voltage = Watts (not required on inspection but useful).\n- Example: 15-amp, 120-volt circuit = 1,800 watts; a 900-watt microwave + 1,200-watt coffee maker = 2,100 watts, so they cannot run together on that circuit.\n- Residential voltage is 120/240 volts; 120V for lamps/small appliances, 240V for central AC, electric stoves, dryers, forced-air heat, water heaters.\n- Standard service amperages: 60, 100, 125, 150, 200, 400 amps; 60-amp is usually older fuse panels; newer homes typically 200 amps; only very large homes need 400 amps.\n- Enclosed wires/panels/junction boxes require air space to dissipate heat; boxes cannot be crammed full of wiring.\n\n## Service Drop/Lateral\n\n- Electrical service includes conductors and equipment from utility to main disconnect.\n- Service drop = overhead from utility pole; service lateral = underground.\n- Service drop from pole is typically triplex cable (two hot wires and one neutral); neutral is uninsulated and doubles as support cable.\n- At the house, the service point is where utility-owned drop meets homeowner-owned service entrance conductors; utility owns the drop and meter; homeowner owns service entrance conductors, weatherhead, service mast, and meter housing.\n- Service mast may be IMC (intermediate metal conduit), RMC (rigid metal conduit), or RNC (rigid nonmetallic conduit, gray PVC listed for electrical use—not plumbing PVC).\n- SE (service entrance) cable is used in many areas; it requires a special weatherhead; Style U has neutral as mesh around hots, Style R has separate neutral.\n- Service lateral must be protected by metal conduit or schedule 80 RNC to a depth of 18 inches below grade (not verifiable on inspection).\n- Exterior panels: utility responsible only for meter; everything else is homeowner's.\n- Obsolete service drops: individual open conductors indicate outdated panel and circuits; recommend electrician evaluation.\n- Damaged sheathing, missing weatherhead, gaps at service mast, poor drip loops, exposed hot conductors at service point splices, loose anchors, leaning masts, rusted clamps, exposed service laterals, and rusted meter enclosures are all reportable defects.\n- Drip loop is required to keep moisture out of the service mast; NEC says bottom of drip loop should be 18 inches above roof (poorly enforced; use discretion).\n- Broken neutral in triplex cable is very dangerous and needs immediate utility correction; report and recommend electrician.\n- Service drop must be supported by a proper clamp on mast or anchor on house; loose anchors are dangerous.\n- Service drop hot wire touching metal soffit is a shock hazard; avoid placing aluminum ladders against metal gutters/soffits in such cases.\n\n## Service Drop Clearances\n\n- Clearances measured from lowest point or bottom of drip loop.\n- Over walkways, patios, ground adjacent to house: 10 feet minimum.\n- Over balconies, decks, porches: 10 feet above walking surface, and 10 feet for 3 feet past railing/edge.\n- Over yards and driveways: 12 feet minimum.\n- Over roads: 18 feet minimum.\n- From openable windows: 3 feet minimum.\n- Over roofs with less than 4:12 slope: 8 feet minimum clearance.\n- Over roofs with 4:12 slope or greater: 3 feet minimum clearance.\n- Over swimming pools: 22½ feet minimum clearance.\n- From trees, antennae, chimneys: use common sense.\n- Weatherheads must be above points of attachment; extension masts that are not proper are defects.\n- Service drop tangled in trees is usually homeowner's responsibility; recommend tree trimmer.\n- Service drop touching antenna mast may carry voltage potential to control box; report.\n- Low-voltage wiring (telephone, antenna) cannot be on the service mast.\n- Overhead wires from house to garage are not service drops but same clearance requirements apply; homeowner maintains them.\n- Service drop cables may be smaller than service entrance conductors (e.g., 3 AWG drop for 100A with 2/0 entrance for 200A) because open air dissipates heat; this is often acceptable but if in doubt recommend electrician.\n\n## Wire Diameter (Gauge)\n\n- Wire size must match maximum current; larger current needs larger wire.\n- Wire gauge determined by NEC tables considering ampacity, ambient temperature (e.g., attics), and bundling/raceway use—collectively called derating.\n- Smaller gauge number = larger wire; \"0\" pronounced \"ought\" (e.g., 2/0 = two-aught).\n- Wire gauges over 8 are usually stranded.\n- Copper branch circuit gauges: 14 AWG on 15-amp, 12 AWG on 20-amp, 10 AWG on 30-amp, 8 AWG on 40-amp, 6 AWG on 50 & 60-amp breakers/fuses.\n- Aluminum branch circuit gauges must be one size larger than copper for same amperage (aluminum has 61% conductivity of copper): 12 AWG on 15A, 10 AWG on 20A, 8 AWG on 30A, 6 AWG on 40A, 4 AWG on 50/60A.\n- Solid aluminum wiring has been problematic (discussed in Module 21).\n- Service entrance copper gauges: 6 AWG for 60A, 2 or 3 AWG for 100A, 1 AWG for 150A, 2/0 AWG for 200A, 400 kcmil for 400A.\n- Service entrance aluminum gauges: 4 AWG for 60A, 1 or 1/0 for 100A, 2/0 for 150A, 4/0 for 200A.\n- Central A/C is an exception: wire size is based on nameplate \"minimum circuit ampacity,\" not breaker rating; often one size smaller than normal (e.g., 14 AWG on 20A is allowed only for that specific A/C unit).\n- A 14 AWG wire on a 20-amp breaker for any other branch circuit is wrong and should be reported.\n\n## Amperage/Voltage of Service\n\n- Service must lead to a main disconnect, usually in the main service panel; may be a separate exterior disconnect.\n- Service amperage is determined by the rating of the main disconnect (60, 100, 125, 150, 200, or 400 amps).\n- Main disconnect rating must not exceed the rating of service entrance wires or the panel's specification tag rating.\n- Voltage is almost always 120/240 volts; only two service entrance wires indicate 120 volts only (obsolete).\n- Nothing is measured during inspection; it is a limited visual inspection.\n\n## Branch Circuits\n\n- Current from service entrance is distributed to branch circuits or sub-panels within the main panel.\n- Each branch circuit has its own breaker or fuse and serves smaller areas of the home.\n- Most homes have one main (service) panel; additional panels fed from the main are sub-panels.\n"}, {"title": "Module 21 Electrical Inspection 2", "md": "# Module 21 Electrical Inspection 2\n\nThis module covers residential wiring methods, materials, defects, and the electrical theory inspectors need to evaluate branch circuits and grounding.\n\n## Complete Circuits\n- Electrical current must complete a circuit back to its source (the utility transformer) to flow and do work; hot wires carry current to the load, neutral wires return it.\n- If the circuit is incomplete, no current flows and no work is accomplished.\n\n## Wiring Colors\n- NEC® mandates only two wire colors: neutrals must be white; grounds must be bare copper or green insulated.\n- Violating these color rules can cause reverse polarity or shock hazards.\n\n## Wiring Methods and Materials\n- Branch circuit wiring types include: NM, UF, SE; metal conduit (EMT, IMC/RMC); armored cable (AC/BX); metal clad (MC); flexible metal conduit (FMC/LFC); knob and tube (K&T); electrical nonmetallic tubing (ENT/RNC).\n\n## Non-Metallic Sheathed Cable (Type NM, \"Romex\")\n- Type NM is used in over 90% of U.S. homes for 120/240V circuits; call it \"non-metallic sheathed cable\" on reports, not the brand name Romex.\n- NM contains hot, neutral, and usually a ground wire in a plastic jacket; indoor use only.\n- NM from the 1950s–1990s is white/off-white or black; since 2001 most manufacturers voluntarily color-code jackets: white=14 gauge, yellow=12, orange=10, black=8/6 (not NEC-required).\n- Type UF (underground feeder) is moisture-resistant, can be direct buried, but must be protected by rigid conduit where it emerges along a building; typically grey and marked \"UF.\"\n- Type SE (service entrance) can be used for 240V branch circuits (dryers/ranges) and must be installed like NM indoors.\n- Very old NM (1930s–1950s) has cloth/rubberized sheathing (\"rag wrap\"), has no ground conductor, and is obsolete; recommend further evaluation by a qualified electrician.\n- Pre-1960 NM generally has no ground conductor.\n- NM must be secured within 12 inches of every junction box, panel, or fixture; staples need not be insulated but must not be over-tightened (overdriven staples can split sheathing and cause arcing/fire).\n- In basements/crawl spaces: 14, 12, and 10 gauge NM must run through bored holes or on running boards; 8 gauge and larger may be secured directly to joist bottoms.\n- NM must be secured at least every 4½ feet; loose attic runs are common but technically against code.\n- NM must not be bundled because heat cannot dissipate; lay it flat.\n- NM within 6 feet of an attic hatch must be protected from physical damage (method not specified).\n- NM must be protected from sharp edges (e.g., metal gusset plates) that can cut the jacket.\n- NM outer sheathing must extend at least ¼ inch into any panel, box, or fixture, and proper clamps are required; screw-type clamps must not be over-tightened.\n- NM run through wall studs must have at least 1¼ inches of wood covering or steel plate protection to prevent nail/screw penetration.\n- All splices must be enclosed in a proper electrical box; never leave open splices.\n- Never assume wiring is abandoned unless you can see both cut ends; otherwise recommend further evaluation.\n- Even taped-off wire ends are open wiring; they must be terminated with wire nuts and enclosed in a box.\n- Local codes vary (e.g., loose attic NM, missing clamps if secured within 12 inches); check local practices, but always report sloppy work.\n\n## Metal Conduit\n- EMT (electrical metal tubing) is sometimes used to protect NM in exposed areas; in a few areas (e.g., Chicago) all circuits use EMT and metal boxes with loose wires.\n- In an all-EMT system, the metal conduit and boxes serve as the ground path; every connector must be tight for a continuous ground (visual inspection only).\n- Separated conduit loses the ground path.\n- EMT can be used outdoors but must not be buried; it is \"thin wall\" and some electricians avoid it outdoors.\n- Box/conduit fill: resistance generates heat, so there are limits on conductor quantity/gauge; inspectors do not remove junction box covers, but if a cover is missing or the panel cover is off, check fill.\n- Rule of thumb: junction boxes and conduits should appear more than 50% empty; if overfilled, recommend further evaluation (\"too many conductors: may overheat\").\n- An extension ring can enlarge an overfilled box.\n- IMC (intermediate metal conduit) and RMC (rigid metal conduit) are similar; used mostly for exterior service entrances and sometimes to connect main panels to subpanels.\n\n## Armor and Metal Clad Cable\n- Type AC (armored cable, \"BX\") uses the outer steel jacket as the ground path, has paper filler, and since the late 1950s includes an aluminum bonding wire.\n- Type MC (metal clad) has a separate green insulated ground wire and plastic inner wrapping; common in commercial, sometimes residential.\n- The bonding wire in AC reduces resistance of the metal sheathing; it must be terminated outside the box/panel (wrapped around the armor), not brought inside.\n- Type AC requires anti-short bushings (\"red-heads\") to protect wire from the sharp metal edge; often missing but should be noted.\n- Type MC cannot use the jacket as a ground; it relies on the green ground wire.\n- AC and MC cables must not be in soil contact, even in crawl spaces; if seen, leave the crawl space and report it.\n- Proper clamps are required wherever AC or MC enters a box, panel, or fixture.\n\n## Flexible Metal Conduit\n- FMC (flexible metal conduit, \"Greenfield\") and LFC (liquidtight flexible conduit, \"sealtight\") are empty conduits; appropriately sized wires and a separate ground wire are pulled through.\n- FMC cannot be used in wet locations (not outdoors); LFC has a PVC jacket and is waterproof, so it is allowed outdoors.\n- FMC cannot serve as a ground path; a separate green ground wire is required.\n\n## Knob and Tube Wiring\n- Knob and tube is the original residential wiring system (late 1800s through 1940s, some areas into early 1950s); open wires on porcelain knobs with porcelain tubes through framing.\n- Always recommend further evaluation: it has no ground path, brittle sheathing, is often improperly altered, and cannot be covered with insulation in walls or attics (NEC violation due to overheating and hidden open wires).\n- Exposed conductors are extremely hazardous; a short-term repair is electrical tape, but replacement is needed.\n- A \"virgin\" knob and tube system is grandfathered by NEC, but altered systems are not.\n- Never assume knob and tube is abandoned unless you can see both cut ends.\n\n## Electrical Non-Metallic Tubing\n- ENT (electrical nonmetallic tubing, \"smurf\" tubing) is flexible plastic tubing with loose wires pulled through; may be blue, orange, or other colors.\n- ENT is sometimes used for 120/240V circuits but more often for low-voltage cables (networking, coax, speakers), which are not part of a home inspection.\n\n## Mixed Wire Types\n- Older homes often mix Romex, BX, conduit, and knob and tube; newer additions are frequently not properly integrated.\n- Look carefully for improper open splices, damaged sheathing, and overcrowded junction boxes.\n- Romex and BX grounding methods are not compatible; recommend further evaluation when mixed.\n\n## Wiring Method Basics\n- All splices must be in proper junction boxes; all boxes must have covers; no open holes (missing knockout covers need proper caps, not tape); all wiring/conduit must be secured with proper clamps/connectors.\n- Common defects to report: missing covers, open splices, loose NM, missing clamps, improperly spliced ground wires (need wire nuts), taped splices, white wire used as hot, garden hose used as conduit, lamp cord for permanent wiring, exposed NM in closets, and open wiring in crawl spaces.\n\n## Solid Aluminum Wire\n- Solid conductor aluminum branch circuit wiring (not stranded) was used from mid-1960s to mid-1970s; it has a higher risk of arcing and fire due to \"cold flow\" (heat causes permanent size/shape changes, loosening connections).\n- Identify it by markings on the cable jacket (\"aluminum,\" \"KA\" for Kaiser, \"Alcan\") and by the silver color of conductors in the panel; aluminum wiring always has plastic (not cloth) sheathing.\n- Overheating is especially common at breakers and splices; melted wire nuts are a serious defect.\n- Reporting solid aluminum wiring is required by law in several states whether or not it appears damaged; recommended report language: \"Solid aluminum branch circuit wiring was observed, which has a higher rate of overheating than copper wiring. Further evaluation by a qualified electrician is recommended.\"\n- Do not confuse it with pre-1960s tin-clad copper wire, which also looks silver but has thick rubber-based or cloth sheathing.\n\n## Electrical Theory for Inspectors\n- Electricity's normal path home is the neutral wire back to the transformer; if that path is blocked (loose/broken neutral), it seeks an alternate path—ideally the ground conductor (bare copper in NM, or metal conduit).\n- The transformer is a low-resistance path; the earth is a high-resistance path.\n- The intended circuit begins and ends at the utility transformer; the se
