<script>
const DOCS=[{"title": "Module 1 Overview of the Home Inspection Profession", "md": "# Module 1 Overview of the Home Inspection Profession\n\nThis module introduces the home inspection profession, its definition, standards of practice, licensing, and common defects found during inspections.\n\n## Introduction to Home Inspections\n- Home inspectors provide an unbiased written opinion of a home's overall condition, usually for a home buyer, and have no financial interest in the sale.\n- Inspectors are not appraisers; they report on condition, not value, and should never give an opinion on a home's worth.\n- Successful inspectors typically perform 2–3 inspections per day; a typical inspection takes about 2.5 hours for a 3–4 bedroom, 2,500–2,800 sq ft home.\n- The job is physically demanding: climbing ladders, entering attics and crawl spaces, and working in all weather conditions.\n\n## Home Inspection Defined\n- Home inspections began in the late 1960s/early 1970s; the American Society of Home Inspectors (ASHI) was founded in 1976.\n- The inspector's job is to produce a written report of the general condition of the house and garage at the time of inspection, based on a limited visual examination using normal operating controls.\n- \"At the time of inspection\" means the report is valid only for the inspection period; components can fail afterward, and the inspector has no control over post-inspection changes.\n- \"Limited visual examination\" means the inspector does not move furniture or personal items, cut walls, remove finished materials, or move insulation.\n- \"Normal operating controls\" means operating equipment with standard switches; inspectors do not operate circuit breakers, electrical disconnects, main water/fuel valves, or plumbing fixture supply valves.\n- Inspectors are generalists; knowing when to recommend further evaluation by a qualified expert is more important than knowing everything about construction.\n- Treat the house and current owner with respect; leave the property as if never there.\n\n## Training and Licensing\n- Even experienced tradespeople need training to become home inspectors; a basic knowledge of all residential trades is required.\n- Many states license home inspectors, requiring state-approved education, possibly field training, adherence to a Standards of Practice, insurance, and continuing education.\n- Ongoing education is important even in non-licensed states to keep up with new construction materials and methods.\n\n## Standards of Practice\n- Standards of Practice (SOP) define what is included and excluded in an inspection, limit scope and liability, and set client expectations.\n- The three major associations are ASHI, NAHI, and InterNACHI; this course is based on ASHI standards.\n- Home inspectors are not building code inspectors; they do not quote codes, cannot enforce them, and older homes are not required to meet current codes.\n- Inspectors are function and safety inspectors; they report safety hazards, not code violations.\n- Excluded from typical inspections: private well/septic systems, environmental issues (radon, asbestos, lead paint, mold, indoor air quality, fuel oil), swing sets, pools, hot tubs, wood-destroying pests, and outbuildings (only the house and one attached/detached garage are included).\n- Inspectors are not required to provide cost estimates or recommend repair methods; they should never tell a client whether to buy the house.\n- Inspectors cannot pass or fail a house; they are consultants making recommendations.\n\n## What Happens at an Inspection\n- Communication (oral and written) is central; inspectors must remain unbiased regardless of findings.\n- Many issues are routine and inexpensive; good inspectors help clients distinguish cheap fixes from costly professional repairs.\n- Water heater temperature should not exceed 120°F; higher is a safety hazard.\n- Inspectors provide maintenance and emergency information, such as the location of the main electrical disconnect and main water shutoff.\n\n## Typical Items Inspected\n- Standard inspection covers: grading/drainage, roofing/siding, exterior/structure, garages/carports, attics/insulation/ventilation, interiors, doors/windows, sinks/toilets/tubs, foundations, electrical, plumbing, heating/cooling.\n\n## Common Defects by System\n- Grading/drainage: low areas along foundation, house in a low spot, driveways/walkways settled toward the house.\n- Roofing: old shingles beyond lifespan, open/missing flashing, missing/damaged shingles, bad patches; walking the roof is optional per SOP.\n- Siding: buckled/rippled/loose, failing paint, physical damage, bad mortar.\n- Exteriors: overgrown vegetation, missing downspout extensions, loose/missing handrails, rotted wood trim.\n- Structure: buckling concrete block foundations, large settling cracks, brick cracking (differential settlement), damaged roof trusses (recommend structural engineer).\n- Garages: damaged overhead doors, rotted trim, automatic safety reverse often misadjusted; openers over 30 years old lack safety reverse.\n- Attics: insufficient insulation, insufficient ventilation (causes shingle overheating and ice damming), bathroom exhaust must vent to exterior.\n- Interiors: minor wall/ceiling cracks (seasonal), doors out of adjustment, loose stair handrails (safety issue).\n- Doors/windows: lost seals (fogging), cracked glass, peeling paint/old putty (maintenance issues).\n- Sinks/toilets/tubs: loose toilets (leak and rot subfloor), dripping faucets, slow drains (often hair).\n- Foundations: seepage from improper drainage, small vertical cracks (sealable), larger diagonal cracks (structural movement, recommend engineer).\n- Electrical: missing cover plates, incorrectly wired outlets (reverse polarity/open ground), open junction boxes; always recommend electrician.\n- Plumbing: missing TPR extension pipe on water heater (safety), leaks at valves/fittings, corroded/leaking pipes under sink.\n- Heating/cooling: dirty equipment, filthy filters, clogged evaporator coils, premature failure.\n\n## End of Inspection\n- Inspector reviews results with buyer and answers questions; report typically delivered within 24–48 hours via email or FTP.\n- Reports may be handwritten (NCR) but most are computer-generated; style/length not regulated except in Texas; most include defect photos.\n- After report delivery, the inspector's job is finished but should remain available for questions.\n"}, {"title": "Module 2 The Legal and Business Aspects", "md": "# Module 2 The Legal and Business Aspects\n\nThis module covers the business and legal decisions for starting a home inspection company, including employment options, legal structures, finances, insurance, daily operations, liability management, and marketing.\n\n## Employment and Franchise Options\n- Most home inspectors are self-employed; employee inspector positions are rare because most companies have only one or two inspectors.\n- Employee inspectors typically earn a percentage of the inspection fee and avoid marketing/business duties, but earn less than owners.\n- Home inspection franchises cost tens of thousands of dollars upfront plus ongoing royalty payments of about 6–7% of gross revenue.\n- Franchises provide marketing materials, training, and a premium report format, but do not guarantee success—you still must do your own marketing.\n- Independent inspectors are their own boss and can create their own marketing materials with help from a local graphic artist.\n\n## Company Legal Structures\n- Sole proprietorship is the simplest and most common structure, but offers no separation of liability—all personal assets are at risk if sued.\n- General partnership is like a sole proprietorship with two or more people; each partner is liable for the acts and debts of the other partners, so it is best avoided.\n- Limited liability partnership (LLP) provides limited personal liability and pass-through taxation, but is uncommon for home inspectors.\n- S-corporations are common for home inspectors because the separate legal entity protects personal assets; they have higher setup costs and more complex taxes.\n- C-corporations are for larger businesses; S-corporations are for smaller businesses.\n- LLCs provide the liability protection of an S-corp with simpler taxes and operational flexibility; state laws vary on whether a single person can form one.\n- To form an LLC or S-corp, you must file paperwork with your state government; otherwise you remain a sole proprietor regardless of separate checkbooks.\n- Consult an attorney in your state before choosing and forming a legal structure.\n\n## Handling Your Money\n- Keep business and personal bank accounts completely separate; commingling funds eliminates the liability protection of an S-corp or LLC.\n- Shop around at several banks for a business checking account because costs and paperwork vary.\n- Hire a good accountant, especially for an S-corp or LLC; ask local business owners for recommendations or interview candidates.\n- Use accounting software (QuickBooks, Sage 50, Wave, Zoho Books) to track income and expenses, with separate accounts for different services (e.g., radon, pest).\n- Federal, state, and possibly local taxes must be paid annually; payroll taxes may be due quarterly or monthly depending on your business structure.\n- Consider retirement plans (401k, SIMPLE IRA) and health savings accounts (HSA, MSA) to offset income and reduce taxes.\n- Accept credit cards; processing fees are typically 3–5% per transaction, with funds deposited in 2–3 days; offset the cost by raising fees slightly.\n\n## Insurance\n- Three types of insurance to consider: disability/workers compensation, general liability, and errors and omissions (E&O).\n- Disability insurance pays you if you are injured on the job; it is not required, and workers comp for yourself may be cheaper.\n- If you have employee inspectors, workers compensation may be required by state law.\n- General liability covers incidents out of your control (e.g., a client falls off your ladder); typical coverage is $1–2 million, and some states require it.\n- E&O insurance protects you against expensive defects you allegedly missed; it is a specialty policy and may not be available from local agents—verify you are buying the correct policy.\n- E&O costs more than general liability; some states require it, but many inspectors rely on S-corp/LLC protection instead—decide based on your attorney’s advice.\n\n## Daily Business Operations\n- Most inspectors work from home; consider using a PO box for your business address to avoid clients showing up at your house.\n- If you hire employee inspectors, you can still work from home because they rarely come to the office; otherwise, consider renting a small office.\n- Basic office equipment: computer with internet/email, printer/scanner/fax, telephone with voicemail, cell phone, shredder, and file cabinets.\n- Do not take phone calls during an inspection—clients expect your full attention—but do not let calls go to voicemail because callers will move to the next inspector.\n- Options for answering phones: phone-answering firms that specialize in home inspectors (fee per inspection), a spouse, or a paid-per-inspection person working from home.\n\n## Additional Services\n- Common additional services offered alongside inspections: radon testing, termite/pest, well and septic, and mold.\n- Termite and well/septic inspections are licensed in most or all states; radon, lead, asbestos, and other environmental services are licensed in some states.\n- Services not usually state-regulated: mold, indoor air quality, commercial properties, thermal imaging, EIFS, energy audits, pools/hot tubs, HUD/FHA (requires federal training), condo reserve studies, bank draw inspections, weatherization, and home safety inspections.\n- Radon testing is the most common additional service; get training to offer it, or develop a referral list for services you do not provide.\n\n## Start-Up Costs and Budget\n- Non-franchise start-up costs: training/licensing/legal setup $750 and up; materials/equipment $750 and up; many inspectors start for under $2,000, assuming you have a decent vehicle.\n- Most inspectors use an SUV, van, or pickup truck; a car may work depending on the ladder setup.\n- Ongoing expenses for marketing and inspections run 30–45% of gross fees, including gas, marketing materials, and report materials; the higher end applies to licensed states and E&O insurance.\n- Typical budget items: rent (you can charge yourself rent if working from home as an S-corp/LLC), utilities, phone, internet, gasoline, vehicle maintenance, insurance, accounting, taxes, continuing education, marketing (3–7% of gross), licensing, office supplies, salary/draw, and legal/claims.\n- You will not make money immediately; have cash to cover personal bills for at least six months.\n- Many successful inspectors were full-time from day one, relying on savings or a working spouse; starting part-time makes growth harder because inspection slots are limited to evenings and weekends.\n\n## Liability and the Pre-Inspection Agreement\n- Liability exists because clients make major financial decisions based on your report; they may expect perfection and may not understand the limits of the Standards of Practice.\n- No matter how thorough you are, you will eventually miss a defect, something will fail in your hands, clients will misinterpret, or others will blame you for issues.\n- Minimize liability by adhering to a recognized Standards of Practice, carrying E&O insurance, obtaining continuing education, and having clients sign a pre-inspection agreement.\n- The pre-inspection agreement must be signed before the inspection begins; getting it signed days in advance by email or fax is better than at the job.\n- The agreement defines the scope of the inspection, incorporates the Standards of Practice (ASHI, InterNACHI, or state), and states the fee.\n- Review the agreement briefly with the client before starting, mentioning excluded items (e.g., swing sets, sheds, pools), that it is not a code inspection, that it is a limited visual inspection, and when payment is expected.\n- A limitation of liability clause caps your liability at the inspection fee, but it is not allowed in all states and does not prevent lawsuits—you can still incur legal costs even if you win.\n- Have any contract reviewed by a competent attorney in your state and ensure it complies with your state’s licensing laws.\n\n## Marketing\n- Choose a company name that is easy to pronounce and spell; check domain availability and state business registration for name conflicts; short and simple is best.\n- Project a professional image: good grooming, clean clothes, company shirts with clean slacks (not jeans), and vehicle signage (vinyl lettering is affordable).\n- Keep your marketing area small—in urban areas, no more than a few miles from home; in rural areas, it may be an entire county or two.\n- Real estate agents provide 85–90% of inspection business; referrals also come from past clients, lenders, and attorneys (in some areas).\n- Face-to-face contact with real estate agents is the quickest way to grow your business; follow up within 2–3 weeks and then every few weeks.\n- Spending 15–20 minutes with three agents is more productive than spending a minute or two with fifty agents.\n- Speaking at real estate office meetings is a great way to reach many agents at once, but requires decent public speaking skills and knowing key people in the office.\n- Agents often refer three inspectors to minimize their own liability; your goal is to be one of the three or get on the list.\n- Brochures should include training, expertise, inspection style, what is included, Standards of Practice used, report delivery, and licenses/certifications—do not list fees.\n- A professional website is essential; it should be easy to navigate and not amateurish; consider hiring a designer.\n- Stay in touch with past clients through mailings (postcards or newsletters) a couple of times a year, or periodic emails.\n- Other marketing methods: website SEO (growing, can start at $15–20/month), social media (growing, costs only time), network groups, and tables at local fairs (more effective in smaller areas); flyers, yellow pages, and newspaper ads are not effective.\n- Set your fees by calling 10–15 local inspectors with a listing sheet, asking for a price, discarding outliers, and averaging the rest; repeat for different house types and use *67 to block caller ID.\n- Common pricing criteria: total square footage, number of rooms, foundation type (slab, basement, crawlspace), list price, or a combination.\n- Successful inspectors are good at marketing; the wealthiest inspectors are not always the best inspectors but the best at marketing.\n"}, {"title": "Module 3 The Inspection Process", "md": "# Module 3 The Inspection Process\nThis module covers the home inspection process from pre-inspection preparation, standards of practice, tools, communication, and conduct at the inspection.\n\n## Before You Leave the Office\n- Technical competency requires general knowledge of home systems/components, ability to identify damage, malfunction, improper installation, and hazards; you do not need to be a builder.\n- Use common sense: if something seems wrong, it probably is; report it and recommend further evaluation by a qualified tradesperson.\n- The home inspector's role is to produce a written report of the general condition of the house and garage at the time of inspection, based on a limited visual examination using normal operating controls.\n- Knowing when to recommend further evaluation is more important than knowing everything about construction; inspector opinions are not legally binding.\n- ASHI and InterNACHI standards can be used without membership, but you cannot claim membership or use their logos unless you join; state law may dictate which standard to follow.\n\n## Standards of Practice\n- This course follows the ASHI Standard of Practice (March 1, 2014 edition); ASHI is the oldest and most universally recognized standard in courts and licensed states.\n- Home inspection = visual examination of readily accessible systems/components; \"readily accessible\" means no moving personal property, dismantling, destructive measures, or risk to persons/property.\n- \"Installed\" means attached and requires tools for removal; a portable heater is not installed, so report the lack of a permanent heat source.\n- The inspector must report systems/components that are not functioning properly, significantly deficient, unsafe, or near the end of their service lives (professional judgment).\n- \"Unsafe\" = significant risk of serious bodily injury during normal day-to-day use due to damage, deterioration, improper installation, or a change in accepted construction practices (e.g., ungrounded knob-and-tube wiring).\n- The inspector must provide recommendations to correct/monitor or recommend further evaluation; they are not required to determine methods, materials, or costs of corrections.\n- The inspector must explain deficiencies that are not self-evident (e.g., what \"ungrounded\" means) and report systems present but not inspected, with reasons.\n- The SOP applies to buildings with 4 or fewer dwelling units plus attached/detached garages/carports; 5+ units is a commercial inspection, but a condo/townhouse unit is a home inspection.\n- The inspector is not required to determine: remaining life expectancy, strength/adequacy/efficiency, causes of deficiencies, future conditions, code compliance, market value, advisability of purchase, presence of wood-destroying organisms/mold/environmental hazards, operating costs, acoustical properties, soil conditions, or recalls/controversy.\n- The inspector is not required to offer warranties or guarantees; the inspection is not a warranty.\n- The inspector is not required to operate shut-down systems, systems not responding to normal controls, shut-off valves, or automatic safety controls; normal operating controls are thermostats, switches, and valves intended for homeowner day-to-day use—circuit breakers are not normal controls.\n- The inspector is not required to enter dangerous areas or crawlspaces/attics not readily accessible; not required to inspect underground items, non-installed items, decorative items, detached structures other than garages/carports, common elements in multi-unit housing, every occurrence of similar components, or outdoor cooking appliances.\n- The inspector is not required to move personal property, dismantle systems, reset/reprogram devices, ignite pilot lights, or probe surfaces that would be damaged or show no visible deterioration.\n- Exceeding the SOP is allowed, but attorneys advise staying close; exceeding in one area may create liability for not exceeding in others—exceed only for customer service with a plan (e.g., recommending asbestos testing).\n- Must adhere to the ASHI® Code of Ethics as part of the Standard of Practice (SOP 2.2.C).\n- Inspector is not required to determine suitability of the property for specialized uses (SOP 13.2.A.7).\n- Inspector is not required to determine effectiveness of systems controlling/removing hazardous plants, animals, or environmental hazards (SOP 13.2.A.13).\n- Inspector is not required to offer architectural, engineering, contracting, surveying, or trade services beyond home inspection (SOP 13.2.B.2–B.3).\n- Systems/components may be excluded from inspection if agreed upon with the client beforehand (SOP 2.3.C).\n\n## Tools and Equipment\n- Only four tools are required to meet the SOP: good flashlights, screwdrivers (powered), ladders (dual-use), and a GFCI outlet tester.\n- Common additional tools include digital camera, moisture meter, probe thermometer, infrared thermometer, gas detector, voltage sniffer, binoculars, two-prong outlet tester, water pressure gauge, inspection mirror, carbon monoxide meter, and multimeter/ammeter.\n- A moisture meter determines if a stain is currently wet (active leak) but cannot prove a leak doesn't exist.\n- For crawlspace safety, wear heavy rubber gloves to avoid contamination from leaks; use a respirator/dust mask, head protection, and overalls.\n\n## Pre-Inspection Agreement\n- The contract must be signed before the inspection starts; email/fax it at least 24 hours in advance so the client can't claim unawareness, otherwise sign it at the inspection before starting.\n\n## Quality Report Format\n- The report is the only product the client keeps; invest in good reporting software (often the inspector's biggest investment) and set it up before your first paid inspection.\n\n## Communication and Consistency\n- Deliver bad news in a non-alarming manner; avoid politics/religion; remain neutral—you don't care if the deal closes.\n- Clients are the most important people at the inspection; address all concerns, even trivial ones, and explain technical terms in plain language (e.g., \"double tap\").\n- Have clients at the inspection when possible; absentee clients lead to more issues and require more detailed reports.\n- Consistency: perform every inspection in the same manner and order; do what you promise; write what you say and say what you write.\n- Inspection order: top-down (roof to ground, attic to basement, ceiling to floor in each room) and outside-in (exterior to garage to interior); work a complete circle around the exterior and each room.\n- Last three items in order: electrical panel(s), water heater(s), heating equipment (always last); check the attic when you find access; work rooms off rooms by going to the farthest room first.\n\n## At the Inspection\n- Arrive at least 20 minutes early (30 is better); have a clean vehicle, dress professionally, don't park in the driveway; knock on the door and introduce yourself.\n- On the exterior, note the electric meter location (panel is usually behind it) and plumbing vent (if none, check for an air admittance valve in the attic); be aware of kids, animals, and hazards.\n- Meet and greet: address all clients equally, give business cards to all adults, review the contract, explain your plan, and show them around the exterior.\n- Review the pre-inspection agreement: mention excluded items (swing sets, sheds, pools, hot tubs), that it's not a code inspection, it's a limited visual inspection, and when payment is expected.\n- Interior: start upstairs or in the bedroom area, work down; check the attic when found; turn the thermostat fan on to check airflow; enter data/notes as you go.\n- Be careful with built-in attic ladders—hardware is often loose; report it and consider using your own ladder.\n\n## Inspection Tips\n- Never start an oven or dishwasher without checking the interior first; start the dishwasher early enough to complete a full cycle (no soap) to check for leaks.\n- Use your moisture meter liberally; always check under bathrooms and kitchens in the crawlspace; run water before entering the crawlspace to detect leaks.\n- Report restricted views (blocked areas, covered foundation walls) with photos; note stains wet or dry; use your ears to detect water running (e.g., toilet tank leaking into bowl).\n\n## Control the Inspection\n- Do not deviate from your normal process unless absolutely necessary; politely defer questions to the appropriate time; check everything yourself regardless of owner/agent claims.\n- Do not discuss findings with the owner, but ask pertinent questions (why circuit off, gas shut off); if the owner is belligerent, reschedule if needed; avoid confrontations.\n\n## Know Who's at the Inspection\n- Introduce yourself to all parties, find out who they are and why they're there; don't share findings with non-clients; write down names for records.\n- Don't let appraisers, termite inspectors, or others mooch information; they must do their own job; minimize interference.\n\n## Be a True Professional\n- Be courteous to everyone; leave everything as found; if you break something, admit it and deal with it; maintain dialogue with clients but keep moving; don't tell war stories.\n\n## Present Your Findings\n- Review findings/report with the client discreetly (away from the owner); ask questions, collect your fee, thank clients, and tell them to call you with questions for as long as they live there; thank the agent for the referral if appropriate.\n"}, {"title": "Module 4 Roofing Inspection 1", "md": "# Module 4 Roofing Inspection 1\nThis module covers roofing inspection fundamentals: ASHI standards, roof framing styles and terminology, leak principles, ventilation, flashing, crickets, valleys, roofing material types and selection, and the inspection process.\n\n## Standard of Practice\n- ASHI SOP Section 5 requires inspectors to inspect roofing materials, roof drainage systems, flashing, skylights, chimneys, and roof penetrations, and to describe roofing materials and the methods used to inspect the roofing.\n- Inspectors are NOT required to inspect antennas, interiors of vent systems, flues, or chimneys that are not readily accessible, or other installed accessories.\n- Inspectors are not required to walk the roof (ASHI 13.2 F.1), but walking it is better customer service and can reveal defects not visible from the ground or ladder.\n\n## Roof Framing Styles and Purpose\n- Typical residential roof framing styles: hip, gable, mansard, gambrel, and flat/low slope; less common: shed, saltbox, geodesic, butterfly; combinations (e.g., gable/hip, gable/shed) also occur.\n- A hip roof has ridge areas running from corners up to the center ridge; a gable roof has rakes on two sides; mansard roofs come down onto the side of the house; gambrel is the classic barn style.\n- Roofs exist to shed water, repel weather (hail, snow, wind), resist UV rays, and enhance appearance.\n\n## Leak Principles and Terminology\n- Water should always fall DOWN onto another surface; any vertical surface adjoining a roof, any roof penetration, and any area where water changes direction are potential leak areas.\n- Anywhere water has to move UP over an edge is a potential leak and is probably wrong; water collecting at a low spot on a roof is a bad sign and should be checked from inside underneath.\n- Roofing terms to know and define for clients: ridge (highest point), hip (high joint of two planes), gable (end wall area), rake (gable edge), valley (low joint of two planes), fascia (face of overhang), soffit (under overhang), eave (lowest roof edge), dormer, sheathing/decking, underlayment, roof vent, plumbing vent/stack, cricket/saddle/diverter, flashing, drip edge, gutter.\n- Dormers are \"bump outs\" in the roof to gain space, usually for bedrooms; a shed dormer has a shed-style roof.\n\n## Sheathing and Underlayment\n- Sheathing and decking are the same thing; materials include solid wood, plywood, OSB, and hybrid sheathing/moisture barrier combinations; on a typical inspection you usually see sheathing only from the attic.\n- Underlayment is installed on sheathing under roofing material for additional moisture protection; traditionally 15 or 30 lb felt (asphalt-based, weighing 15 or 30 lb per 100 sq ft, a \"square\"), but synthetic underlayments are increasingly used.\n- Underlayment is required by building codes and most roofing manufacturers to keep the warranty; hybrid sheathing/moisture barrier products include underlayment as part of the system.\n- Missing underlayment allows leaks to enter before missing shingles are discovered.\n\n## Roof Ventilation and Ice Damming\n- Ventilation should be 1 square foot per 300 square feet of attic floor, balanced 50/50 between soffit and ridge; more venting is usually OK, less is usually not.\n- Proper ventilation reduces attic temperatures in summer and reduces/eliminates ice damming in winter; continuous ridge vents need continuous soffit vents.\n- Exhaust fans from living spaces must be extended to the exterior, never discharged into the attic; clogged soffit vents and insufficient ventilation prevent convection and cause heat buildup.\n- Lack of venting can heat roof decking to 161°F and cause premature asphalt shingle failure/cracking (e.g., 5-year-old shingles).\n- Ice damming occurs when poor insulation/ventilation warms the attic, melting snow; the cold soffit area forms an ice dam that backs water up under shingles, causing leaks and shingle damage.\n- A leak barrier (ice and water shield) installed under shingles can prevent interior damage from ice damming; it is self-sealing around nails.\n- To stop ice damming, keep the attic/sheathing below freezing by insulating and sealing air gaps, and by providing balanced ridge/eave ventilation.\n- For inspection, you do not need to measure or calculate ventilation; if vents are absent or very few, recommend further evaluation by a qualified roofing contractor.\n\n## Crickets\n- A cricket (also called saddle or diverter) is a raised/ridged structure that diverts water around an obstruction such as a chimney.\n- Crickets are required on the high side of any chimney wider than 30 inches and recommended for obstructions over 24 inches; they are normally the same pitch as the roof but don't have to be.\n- Smaller crickets are covered with metal flashing; larger ones can be covered with the same material as the rest of the roof.\n\n## Flashing\n- Flashing keeps water from getting under roof material edges at roof-wall intersections, roof penetrations, and exposed edges; it is usually metal.\n- Types include step flashing, counter flashing, head wall flashing, drip edge flashing, and plumbing vent flashing (boots or lead shields).\n- Step flashing is interwoven with each course of roof material starting at the eaves and working up; where siding covers the wall, the siding covers the top edges of step flashing.\n- Counter flashing protects the top edges of step flashing at masonry walls/chimneys; its top edge should be inserted into reglets (slots cut into mortar joints) and secured with high-quality sealant.\n- Counter flashing installed as a solid piece without reglets relies only on sealant and is not the best, but is common; if sealant is intact, many roofers consider it acceptable.\n- Head wall flashing is solid horizontal flashing where a roof's top edge meets a wall; its top edge is protected by counter flashing, which is either covered by siding or inserted into reglets.\n- Drip edge flashing along rakes protects the exposed sheathing edge; along eaves it also keeps water from getting behind the gutter.\n- Plumbing vent flashing is specific to pipe material: cast iron (rough) needs lead flashing shields/jacks covering the entire vent above roof level; plastic (PVC/ABS) uses a rubber flashing boot for a tight seal.\n- Skylight flashing uses head (top) flashing, step flashing at sides, and bottom flashing; head flashing is a single solid piece installed under roofing material but over the top row of step flashing; bottom flashing has an apron extending over roofing material below.\n\n## Valleys and Parapets\n- Valley types: open (usual with rigid materials; metal \"W\" flashing is best), closed cut (asphalt only), and woven (asphalt only, very watertight because two layers of shingles).\n- Woven valleys require each strip to extend at least 12\" beyond the valley center, with 36\" roll roofing 50 lb or heavier and extra nails in strip ends.\n- Flat/low-slope roofs often have parapet walls; the top is covered with coping—terra-cotta for masonry parapets, metal for wood-frame parapets—to protect the parapet.\n- A rubber membrane roof may be brought up over a parapet without coping, which is acceptable.\n\n## Roofing Material Selection and Performance\n- Roofing material selection order: type of application (pitched vs flat), price, appearance, life expectancy, weight, availability.\n- Performance is affected by sun orientation/exposure (south face ages faster), weather, insulation, ventilation, roof pitch (steeper lasts longer), material quality/color (lighter and heavier are better), and quality of installation.\n- Roof pitch is expressed as rise in inches per 12 horizontal inches; flat = 0:12 to 2:12, low slope = 2:12 to 3:12, conventional = over 3:12; 12:12 is 45°.\n- A \"20-year\" asphalt shingle weighs about 205 lb per square; a \"50-year\" shingle weighs about 425 lb per square (a square = 100 sq ft).\n\n## Roofing Inspection Process\n- Inspection process: identify roofing material; verify roof pitch matches material; determine number of layers (for shingles); identify overall condition; check all valleys, all rake/head wall/miscellaneous flashings, all penetrations (plumbing vents, roof vents condition and quantity, skylights, masts, etc.), and all ridge cap shingles.\n- Also inspect chimneys, roof drainage systems, roof structure/sheathing in accessible attic spaces, and review finished ceilings closest to the roof for leakage signs.\n- For any roof defect, recommend further evaluation by a qualified roofing contractor; if roofers are known to be locally licensed, say \"licensed\" instead of \"qualified.\"\n- Slate, tile, wood, and standing-seam roofs are specialties; recommend a specialty contractor for those materials.\n- Do not state that a roof requires replacement; report it as \"beyond its expected life\" or \"beyond its designed lifespan\" and let a roofer recommend replacement—this keeps you within the SOP by not determining methods, materials, or costs.\n- Picture rating system: yellow check = essentially correct/safe; blue question mark = functioning/safe, inspector decides whether to report; big red X = essentially wrong/dangerous, must be reported.\n\n## Roofing Materials\n- Asphalt shingles (composition) cover 80–85% of North American residential roofing; types include three-tab (most common), architectural/dimensional (laminated), and T-Lock/interlocking (windy areas, limited availability); minimum pitch 3:12.\n- All flexible shingles are asphalt; most have fiberglass mats, some organic; architectural shingles are almost all fiberglass; report all as asphalt shingles.\n- Architectural shingles last longer than three-tabs; maximum two layers in cold climates, three in warm climates (check local codes); each additional layer has about 25% less life; asphalt shingles need ½\" to 1\" overhang at eaves/rakes and a starter course; no exposed nails or seal strips; can be carefully walked on.\n- Cedar shingles are ~½\" thick, min 3:12 pitch, lifespan 10–25 years; cedar shakes are 5/8\" to ¾\" thick, min 4:12 pitch, lifespan 20–40 years; do not walk on wood roofs.\n- Wood shakes usually use 30 lb felt interlayment (18\" wide); wood shingles/shakes need 1\" to 1½\" overhang at eaves and are installed with about 1/3 exposed, 2/3 covered; exposed nails on replaced individual shingles are normal and don't leak; report any wood roof as \"wood.\"\n- Fiber cement shingles: pre-1980 may contain asbestos; newer last 20–30 years; heavy (up to 600 lb/square); min 3:12; brittle, don't walk.\n- Clay and concrete tiles: lifespan 50–80 years; 500–1300 lb/square (need stronger roof structure); min 3:12; brittle, don't walk; if unsure, report as \"tiles\"; barrel tiles need bird stops.\n- Slate: lifespan 100+ years; 700–1200 lb/square; min 6:12 (4:12 with double felt); ~1½\" overhang; slick/brittle, don't walk; slate valleys must be lined with flashing; beware slate imitators (metal, polymer, composite, fiber cement).\n- Polymer/resin shingles simulate wood or slate; min 3:12; typically 50-year warranties; report as \"synthetic shingles\"; don't walk.\n- Composite shingles are made from wood fibers, resins, recycled plastics/tires; min 3:12; warranties 30–50 years; report as \"synthetic shingles\"; sometimes walkable.\n- Metal shingles (steel/aluminum): lifespan 20–50 years; 100–150 lb/square; min 3:12; can simulate other materials; 26-gauge is walkable but not recommended.\n- Metal standing seam: steel, aluminum, copper, galvalume, or tin; lifespan 20–75 years; acts as radiant barrier; fastened with hidden clips, no exposed fasteners; better wind resistance; pitch minimum varies by manufacturer; don't walk.\n- 90 lb asphalt rolled roofing: 3-foot-wide rolls, 5–10 year life, any pitch, can be carefully walked; distinguish from thicker modified bitumen by ripples.\n- Modified bitumen (torch down or self-adhering): asphalt/polymer blend, lasts up to 20 years; for flat/low slope only; report as modified bitumen or membrane roofing.\n- Built-up roofing (BUR/tar and gravel): 3, 4, or 5 plies of alternating asphalt and felt; average life 15, 20, 25 years respectively; flat/low slope only; gravel reflects UV; coatings extend life; alligatoring indicates many seal coats, not necessarily failure.\n- Single-ply membrane (usually EPDM rubber): residential since 1980s; lifespan 20–30 years; thin and easily damaged; fully adhered or ballasted (river rock); can be carefully walked; with parapet, membrane goes under coping or to a retainer bar.\n- Photovoltaic shingles/panels produce electricity; warranties 20–60 years; don't walk; can be deck-laid, woven in, or laid over traditional shingles; if deck-laid they need underlayment; report that you did not verify operation.\n- If unsure of roofing material, don't guess; verify from a ladder when possible (e.g., a roof that looks like clay tile may be steel).\n- Traditional cedar skip sheathing used open boards for breathing/drying and expansion; modern solid deck is common and acceptable.\n- Real slate often outlasts its fasteners (\"slates outlast the nail\"), requiring heavy structural support (700–1200 lb/sq ft).\n\n## Pitch vs Material and Overlays\n- Roof pitch dictates material: less than 2:12 is flat and requires membrane or built-up; 2:12 to 3:12 is low slope and requires membrane-type materials; over 3:12 requires shingle or tile materials (no membranes or built-ups); manufacturers also dictate pitch.\n- Too-flat slopes for shingles or shakes are defects; use a pitch gauge/app or estimate by eye.\n- Asphalt shingle overlays: max two layers in winter climates, three in warmer climates; check layers at rake edge on gable roofs, or gently lift a shingle at the eave on hip roofs (don't count starter strip); each new layer has 25% less life; more than three layers is too many anywhere.\n- Checking number of layers is not required by the SOP but is good customer service because it affects whether a tear-off is needed.\n\n## Overall Condition and Safety\n- Many roofing jobs are sloppy, causing leaks and premature failure; some defects are only visible by walking the roof.\n- ASHI SOP 13.2 F says inspectors are not required to perform procedures that are likely dangerous to themselves or others, or that could damage property; also not required to move personal property, furniture, equipment, plants, soil, snow, ice, or debris.\n- Walk as many roofs as possible (material permitting); if you won't walk your own roof, don't feel pressured to walk others; walking reveals defects like flashing gaps, exposed nails, damaged vent flashing, and cracked chimney flues.\n- If not walking, use a ladder at the eaves and move it to each side; use binoculars for penetrations and flashings; check the attic carefully.\n- If the roof is covered with snow or cannot be seen, say so on the report with a photo; never tell the client how much longer a roof might last.\n- Report isolated issues individually; if the roof is in poor overall condition, recommend further evaluation by a qualified roofer; report areas currently or potentially leaking separately.\n- Defects to report: mismatched shingles, missing tabs (wind damage), moss and sagging sheathing, ponding water on flat roofs, tile roofs sliding down, and roofs beyond their expected lifespan.\n"}, {"title": "Module 5 Roofing Inspection 2", "md": "# Module 5 Roofing Inspection 2\n\nThis module details the systematic inspection of roofing components—valleys, flashings, penetrations, ridge caps, isolated defects, chimneys, vents, and drainage—including specific clearances, common defects, and recommended referrals.\n\n## Valleys\n- Inspect each valley individually; valleys suffer more wear from stormwater, snow, and ice, especially at the low end.\n- Common valley defects include tabs not cut away, exposed nails, and improper weaving; report and recommend a roofing contractor.\n- A woven valley may still shed water even if top shingles are bad because underlying shingles remain intact.\n- Move leaves away from valleys to inspect; if the lower 3–5 feet of a valley is sound, the upper portion is likely sound.\n- Metal valley flashing cut too short at the gutter line exposes sheathing and allows water behind the gutter, causing rot and leaks.\n- Open valleys using rolled roofing fail in 5–10 years versus 20-year shingles; the valley must be replaced.\n- Dead-end valleys against walls or obstructions are red flags; check attic/ceilings below for stains, patching, or fresh paint.\n- Repaired but unmatched patches that function safely merit seller inquiry; note misplaced heating vents separately from roof defects.\n\n## Flashings\n- Missing step flashing (only sealant) fails due to expansion/contraction; proper installation requires step flashing and counter flashing cut into reglets.\n- Missing kickout/diverter flashing at the eave allows water behind siding; install kickout to divert water into the gutter.\n- Exposed top edges of step flashing allow water behind; fix by removing siding and reinstalling flashing properly.\n- Counter flashing not cut into reglets (straight piece) is not watertight; tar smears indicate leaks.\n- Exposed felt (underlayment) over flashing directs water onto sheathing—incorrect.\n- Missing head wall flashing: roofing pushed under siding; wind-driven rain/snow can leak; check ceilings below.\n- Missing drip edge exposes sheathing; drip edge protects sheathing and directs water into gutters.\n- A cricket is required for chimneys wider than 30 inches; without it, water/ice backs up under shingles and leaks.\n- Nail pops and exposed nail heads are minor defects; recommend sealing exposed heads.\n- On licensing/exam questions, specify crickets for chimneys wider than 30 inches; despite personal preference for 24″, 30″ remains the accepted test answer.\n\n## Penetrations\n- Rubber boots on plumbing vents fail in 8–12 years from UV on south/west exposures; check for cracks.\n- A vent boot missing—sealant alone is not correct and will leak soon.\n- Tar/caulking on the roof (except counter flashing reglets) indicates past or potential leaks; question and recommend a roofer.\n- Tile roof flashing must have a hem (folded edge) to stop wind-driven rain; missing hem allows water under.\n- An antenna on a PVC vent causes movement that breaks the rubber boot seal; also check boot condition.\n- Turbine vents need wind; galvanized steel rusts and locks up; manually spin to check.\n- A capped plumbing vent is likely left from a pressure test; try to remove; if not, recommend a plumber.\n- Ridge vents require continuous soffit vents for proper convection.\n- Skylight head flashing must be used; step flashing at the top will leak; moss indicates moisture.\n- Sagging or delaminated sheathing (H-clips are normal between rafters) warrants a carpenter referral before further comment.\n\n## Ridge Caps\n- Check ridge cap shingles separately; they often crack or damage even when the rest of the roof has life.\n- Cracks in ridge caps are common in cold climates due to cold installation; not visible from the ground.\n- Roofers may use inferior-grade shingles for ridge caps; they won't last as long as the main roof.\n- Missing ridge shingles or a missing ridge vent are active leaks; report.\n- Slipped rake or concrete-tile edge caps signal imminent leaks and are easily missed; view clay tile through upper windows if roof unwalkable.\n\n## Isolated Roof Issues\n- Wood shingles/shakes are harder to inspect due to irregular pattern; take time.\n- Galvanized nails on cedar cause black streaks—cosmetic only.\n- Missing starter strip and underlayment with rotted sheathing under new shingles requires full replacement.\n- Membrane roofs: look for loose/torn seams; built-up roofs: look for cracks, fissures, blisters.\n- Flat roofs: check entire perimeter, parapet, and coping; open seams are leaks.\n- Heavy moss shortens roof life; recommend a roof cleaning contractor.\n- Ponding on flat roofs leads to leaks; report and recommend a roofer.\n- Slates/tiles slipping down indicate nail failure; recommend a specialty slate/tile contractor.\n- Mansard/gambrel roof eyebrows often leak; check inside at window heads and below windows.\n- Cracked asphalt shingles in a pattern indicate fiberglass mat failure; recommend a roofer.\n- Built-up roof blisters form from moisture evaporating between plies; fissures or split seams are actual leakers while alligatoring complicates detection.\n- Coping and parapet failures warrant both masonry and roofing contractors; always walk entire flat-roof perimeter including parapet and coping.\n- Eave holes from impacts, branches, or animals may be invisible from attics due to soffit corners; inspect carefully.\n- Coated or patched membrane areas: ask the seller who applied them, when, and warranty status; recommend independent review if uncertain.\n\n## Chimneys and Vents\n- Chimneys must be at least 3 feet above the roof (measured on the shorter side) and 2 feet taller than anything within 10 feet.\n- Gas vents: minimum 12 inches above the roof and 2 feet taller than anything within 8 feet.\n- Oil vents: minimum 24 inches above the roof and 2 feet taller than anything within 10 feet.\n- Class A stainless steel vents for wood: same clearances as chimneys (3 ft above roof, 2 ft taller than anything within 10 ft).\n- Cannot mix solid fuel (wood) with gas/oil in the same flue; fireplaces/stoves each need their own flue; gas appliances can share.\n- If a high-efficiency furnace is sidewall vented, the masonry flue may be too large for the remaining water heater; a metal liner is needed to prevent condensation.\n- Old unlined chimneys with deteriorated mortar allow combustion products into the house; need a flue liner.\n- Broken flue tiles are fire/backdrafting hazards; walk the roof to see down flues.\n- Always recommend a rain and animal cap if missing; recommend annual chimney sweep for fireplaces.\n- Report that most chimney flue/vent interiors could not be observed.\n- Per ASHI standards, inspectors are not required to inspect interiors of non-readily-accessible vents/flues/chimneys or walk unsafe roofs; walking when safe improves service.\n- Inspect chimneys starting at the crown working downward, checking height, caps, condition, leaning, plus attics/basements/crawlspaces where accessible.\n- ASHI §13.2.F.1 exempts dangerous tasks, yet walking when safe uncovers broken flue tiles invisible from ground/ladder and concealed by rain/animal caps.\n- Wind-turbine roof vents move little air on still days; fixed square hood vents give more consistent ventilation.\n\n## Roof Drainage\n- Common gutter defects: rusted steel, cracked plastic, leaking joints, clogged, downspouts not extended.\n- Downspouts should extend a minimum of 5 feet away from the house; splash blocks are worthless.\n- Always recommend gutters at eaves if missing.\n- Roof drains are primary; scuppers are secondary overflows; if scuppers are too high, water accumulates; clogged drains cause ponding.\n- Referral matrix: masonry to mason/chimney contractor; wood-frame chase to carpenter; metal chimney to chimney contractor; chimney flue defects (e.g., vent too short) to chimney contractor; gas/oil vents to heating technician or chimney contractor; slate/tile to a slate/tile specialist.\n"}, {"title": "Module 6 exterior inspection 1", "md": "# Module 6 exterior inspection 1\nThis module covers the ASHI exterior inspection Standard of Practice, siding functions and weather barriers, window/door flashing, common siding defects and characteristics, and detailed characteristics and defects of each major siding type including vinyl, wood, engineered wood, fiber cement, asphalt, metal, stucco, and EIFS.\n\n## Standard of Practice (ASHI Section 4)\n- The inspector shall inspect wall coverings, flashing and trim; exterior doors; attached/adjacent decks, balconies, stoops, steps, porches and their railings; eaves, soffits, and fascias accessible from ground level; vegetation, grading, surface drainage, and retaining walls likely to adversely affect the building; and adjacent/entryway walkways, patios, and driveways.\n- The inspector shall describe wall coverings; ASHI defines wall covering as a protective or insulating layer fixed to the outside of a building, such as aluminum, brick, EIFS, stone, stucco, vinyl, and wood.\n- The inspector is NOT required to inspect screening, shutters, awnings, seasonal accessories, fences, boundary walls, geological/soil conditions, recreational facilities, outbuildings other than garages/carports, seawalls, break-walls, docks, or erosion control/earth stabilization measures.\n- Recreational facilities include spas, saunas, steam baths, swimming pools, exercise, entertainment, athletic, playground equipment, and associated accessories; avoid commenting on playground equipment even as customer service due to liability.\n\n## Siding Functions and Weather Barriers\n- Siding has two functions: to look attractive and to shed moisture/resist weather; because any siding can fail, a weather-resistant barrier must be installed underneath.\n- Older houses used red rosin paper, then 15- or 30-pound building paper (felt/tar paper); newer houses use building wraps such as Tyvek (introduced by DuPont in 1979), which resist air infiltration while allowing trapped vapors to escape.\n- Combination sheathing/barriers such as ZIP System® and Nautilus® are OSB panels with factory-applied building wrap; panel seams must be sealed with the manufacturer’s proprietary tape, and siding/roofing is installed directly over the taped sheathing.\n\n## Window and Door Flashing\n- Flashing is critical to prevent leaks, mold, and rotting; all windows should be watertight at the top via a separate drip cap or a built-in flange relying on hidden building wrap and flashing tape.\n- On existing homes, most flashing is not visible except drip caps, and it is impossible to verify whether built-in flanges are properly flashed and taped.\n- A drip cap directs water out and away over the window; newer windows often use flashing tape only, with building wrap lapped over the tape and siding over that, making a drip cap unnecessary.\n- Sealant alone at the window head will fail and allow moisture into the wall cavity; a visible gap at the window head is an obvious leak.\n- Always inspect interior finished walls around windows and exterior doors for stains, mildew, water damage, or fresh paint to confirm proper flashing.\n\n## Typical Siding Defects\n- Common siding defects include loose, buckled, rotted/delaminated/deteriorated, checking (wood) or cracking (masonry/stucco), warping/splitting, failing mortar, physical damage, weathered/failing paint/sealant, and poor installation.\n- Rigid sidings (masonry, stucco) crack from movement or shrinkage; horizontal cracks are especially concerning because they suggest lateral movement.\n- Typical cracks are single, hairline, same width for their entire length, vertical or near-vertical, with no differential/displacement movement; report them as typical and recommend monitoring.\n- Problematic cracks are multiple or paired from a common point, show differential/displacement movement, widen from the point of origin, or are horizontal; recommend further evaluation by a licensed engineer or qualified contractor.\n\n## Siding Common Characteristics\n- The bottom edge of siding (including brick) should be several inches above the ground so foundation is visible.\n- The path of water should always be down and onto another surface; if water can go under/in or must travel over a horizontal caulked joint, it is almost always wrong.\n- Attached porches and decks commonly have poor siding detailing/flashing and are potential leak sources.\n- Always check under chimney and bay window overhangs for exposed materials, gaps, or insulation; seal any openings such as the A/C refrigerant line set at the siding.\n- Vines covering siding should be reported as a restricted view; vines can damage brick and mortar.\n\n## Siding Types and Identification\n- Siding types include vinyl, plastic imitators, wood, engineered wood, hardboard (Masonite®), fiber cement, asphalt, metal (steel or aluminum), traditional stucco, EIFS, brick/brick veneer, concrete block, stone, and adhered brick/stone.\n- Many materials look alike; always touch/tap: vinyl is usually pliable (solid core vinyl is rigid), EIFS sounds hollow vs. stucco, fiber cement is harder than wood (probe at an edge), and a magnet identifies steel vs. aluminum.\n- For defects with brick, stone, or block, recommend a qualified masonry contractor; for stucco/EIFS, a qualified stucco contractor; for all other siding, a qualified siding contractor or carpenter.\n\n## Vinyl Siding\n- Introduced in 1957; vinyl is the dominant US siding with 32% of the market (2008 data); regional share: Northeast 78%, Midwest 67%, South 28%, West 7%.\n- Advantages: low maintenance, easy installation, lower cost. Disadvantages: leaks even when properly installed, easily damaged in cold climates, and melts from heat/reflected sunlight.\n- Installation issues: over-nailing causes buckling; high-nailing causes loose fit and waviness; sloppy detailing at openings (missing/poor j-channels) is common.\n- Buckled siding is more likely to blow off in high winds; waviness is usually cosmetic but should be reported.\n- Hail damage and melting (from grills or reflected sunlight) are common; report melted siding even if cosmetic.\n- Newer products: solid core vinyl (foam backing, eliminates waviness, profile 1¼” or thicker) and “seamless” vinyl (40-foot panels with special clips to allow expansion).\n\n## Plastic Imitation Siding\n- Includes polypropylene panels, PVC, polymers, resins, and vinyl; many styles imitate wood, stone, brick, shakes, and logs.\n- Always get hands on to verify material; report as “synthetic” or “plastic,” not as the material it imitates.\n- Examples include vinyl board and batten (identifiable by plastic cap trim), polypropylene stone/wood/brick panels, polymer shakes, PVC resin shingles, polyurethane simulated stone, and vinyl log siding.\n\n## Wood Siding\n- Wood species include cedar, redwood, pine, Douglas fir, larch, and teak; styles include clapboards, planks/boards, shingles, shakes, and logs; report simply as “wood.”\n- Defects: failing paint/stain/caulking, warping, cupping, splitting, rotting, mold/algae staining, staining from galvanized or rusted nails, loose siding, missing corner trim caps, impact/woodpecker damage, unsealed cut edges, gaps at trim, and improper clearance at roof material.\n- Wood siding meeting a roof needs about a 1-inch gap with proper step flashing; rot occurs when additional roofing layers eliminate that airspace.\n- EPA RRP Rule (effective April 2010): contractors disturbing finishes in homes built before 1978 must be RRP certified; lead dust causes permanent brain/nerve damage, especially in children.\n- RRP requirements include a 100-series respirator, disposable clothing/hat, contained/sealed interior work areas, ground protection for exterior work, and protection of all windows/doors within 20 feet; homeowners are not bound by RRP but should follow the Lead Paint Safety Field Guide (HUD/CDC/EPA/OSHA, 2001).\n\n## Engineered Wood Siding\n- Engineered wood (composite wood) is made of wood laminates/flakes/fibers with exterior-grade adhesives, resins, or wax; includes hardboard, OSB, and veneered plywood; usually comes in panels.\n- Defects are similar to wood plus delamination, bad seams, and poor seam location; moisture is a major enemy.\n- Masonite® is a brand name for hardboard (wood fibers and glue); T1-11 is a style of plywood siding made from thin layers of real wood and glue.\n- All hardboard brands have had extensive moisture-related warping, rotting, and deterioration, leading to class action lawsuits; recommend evaluation by a contractor experienced with hardboard siding.\n- Hardboard wicks moisture at bottom edges; simulated-stucco hardboard can be mistaken for real stucco.\n\n## Fiber Cement Siding\n- Fiber cement is made of Portland cement, fine aggregate, cellulose/wood fiber, and adhesives; HardiePlank® is a well-known brand.\n- It is not brittle but can break from hard impact; raw cut edges can absorb moisture and must be sealed.\n- Fiber cement siding pre-1970s contains asbestos; asbestos cement siding was installed from the 1930s to the 1960s, is excluded from the SOP, and may be called “fiber cement” on the report; disposal is regulated at state, county, and local levels.\n- Old asbestos siding is very brittle; probe an edge to distinguish it from wood (asbestos/fiber cement is hard, cedar is soft).\n- Fiber cement is vulnerable to moisture intrusion if installed incorrectly; it can warp/ripple if expansion is not allowed for, and warping can pull nails loose.\n\n## Asphalt Siding\n- Asphalt siding is always old; usage peaked in the 1940s and 1950s; it was marketed as maintenance-free and usually shows wear, especially at corners.\n\n## Metal Siding\n- Aluminum siding comes as clapboards or 8- to 10-inch exposure panels and is seldom installed anymore; steel siding includes older clapboard styles and newer panel, seamless clapboard, and log styles.\n- Common defects: oxidized/chalky surface (aluminum), rust (steel), and physical damage; installation issues include failure to allow for expansion and poor detailing at doors/windows.\n- Metal siding is easily dented (often cosmetic); rusted steel may be repairable if solid metal remains; use a magnet to distinguish steel from aluminum or just report “metal.”\n\n## Traditional Stucco\n- Traditional stucco is Portland cement, sand, and water applied in two or three coats to about ¾” to ⅞” total thickness, over wood lath (old) or wire mesh; it can also be direct-applied to concrete/block.\n- It is very hard and durable with minor maintenance; small cracking is typical, especially at openings.\n- A weep screed at the bottom locks the stucco in place and promotes drainage; the felt is lapped over the top leg so moisture exits out and away.\n- Defects: variation in color/texture indicates patching (suggest client ask current owner), cracks allow moisture intrusion and should be caulked/patched, and loose finish coat is caused by moisture or age; moisture damage is common near the ground.\n\n## EIFS (Exterior Insulation and Finish System)\n- EIFS is a thin stucco coating applied to mesh over polystyrene board glued to sheathing or attached through the building wrap; it dents and cracks easily.\n- Barrier EIFS is sealed/wrapped at the bottom, trapping moisture inside and causing rotting and mold growth; identify it by hollow sound when tapped, flexibility when pressed, stucco-wrapped window sills/headers/fascia/soffits, and wrapping at the bottom.\n- Minor cracking is common, but unlike traditional stucco, moisture is trapped inside barrier EIFS; lack of flashing over deck ledgers attached through EIFS allows leaks.\n- Barrier EIFS has been banned from residential use by many building codes; drainable EIFS was introduced but also has moisture retention issues; both have been subject to class action lawsuits.\n- Always recommend in the report that the client obtain a separate EIFS inspection; this is an invasive test requiring current-owner permission, involving small punctures that are patched with matching caulking.\n"}, {"title": "Module 7 exterior inspection 2", "md": "# Module 7 exterior inspection 2\nThis module covers exterior cladding materials (masonry, concrete block, stone, adhered brick/stone), flashing and trim, exterior doors, decks/balconies/porches, eaves/soffits/fascia, vegetation/grading/drainage, and walkways/patios/driveways, including defects, safety criteria, and inspection exclusions.\n\n## Masonry Products\n- Mortar is the glue holding masonry; tuckpointing removes deteriorated mortar to a depth of 1/2 to 1 inch from the brick face.\n- Steel lintels over doors/windows need at least 6 inches of bearing on each side; rusting lintels expand and crack surrounding brick.\n- Masonry is not completely waterproof; pressure differences during storms can wick moisture behind it.\n- Brick types: common (softest), face (more durable), glazed (most durable, unusual in residential).\n- Pre-1950s brick homes are solid masonry (brick backed by brick/block/terra cotta/stone with a 2-inch cavity) and have no weep holes.\n- Since the 1960s, brick is anchored veneer: full brick attached to wood framing; weep holes required, spaced max 32 inches apart (about every 4th brick).\n- Weep holes at the brick ledge allow moisture escape and pressure equalization; cotton cords in weep holes are acceptable.\n- Masonry ties secure brick veneer to framing, installed every other brick and every 2–3 courses; failure causes bowing (gap wider at top) – recommend masonry contractor.\n- Brick defects: spalling (face pops off from freeze-thaw moisture), efflorescence (white chalky deposit from moisture), cracking (may indicate structural/foundation issues), missing or closed weep holes.\n- Star anchors/tie plates are older fire-safety devices (steel rods through walls) to prevent collapse; no longer used.\n- Replacing rusty lintels on older homes leaves a visible patch—old brick can't be matched; warn clients pre-closing.\n\n## Concrete Block and Stone\n- Concrete block defects mirror brick: loose mortar, deterioration, rusting lintels, cracking, efflorescence.\n- Older concrete block is solid masonry, poorly insulated; standard block, slump block, and split-face block are all concrete, not stone.\n- Split-face block may wick moisture and require sealant (ongoing maintenance); newer standard block should be painted or sealed.\n- Real stone homes are typically older and solid masonry; stone defects are the same as brick.\n\n## Adhered Brick and Stone\n- Includes thin brick (Z-BRICK is a brand), panel brick, faux brick, and manufactured stone; often hard to distinguish from full brick.\n- Thin bricks are about 1/2 inch thick, installed thin-set or mud-set on metal lath; premade corners make them look like full brick.\n- Defects: loose pieces (moisture or poor installation), loose mortar, deterioration, cracking, efflorescence.\n- Proper transition between siding and thin brick requires Z flashing (top leg up under siding, bottom leg over trim); a channel will catch water.\n- Manufactured stone (Perma-Stone 1929, Formstone, Rostone, Cultured Stone) is concrete with stone chips/colorants, 25–35% cheaper and much lighter than real stone.\n- On reports, simply say \"brick\" or \"stone\" to cover all types; no need to distinguish thin, panel, or full.\n\n## Flashing and Trim\n- Flashing sheds moisture and should look good; defects: loose/open, missing, poor installation, physical damage – refer to carpenter (roof flashing to roofer).\n- Proper Z flashing protects trim boards: top leg up under siding, bottom leg over trim.\n- Missing kickout/diverter flashing at roof-wall allows water under siding; install to divert water into gutter or away.\n- Short flashing at window sills allows wind-driven rain behind brick; extend at least 1.5 inches.\n- Trim defects: loose, missing, poor installation, physical damage – refer to carpenter.\n- Rotted trim common on homes since 1970s due to newer growth wood (soft, wicks moisture); probe only if obviously rotted (ASHI removed mandatory probing in 2014).\n- Rippled aluminum trim is cosmetic (installer did not allow for expansion).\n- Damaged flashing against EIFS is especially serious—EIFS traps moisture, giving an open path behind the system; treat as major issue beyond generic flashing defects.\n\n## Exterior Doors\n- Common defects: improper operation (out of plumb, rubs jambs, latch doesn't catch), rot/rust, keyed deadbolt on interior (fire safety hazard), non-safety glass, loose/damaged weather stripping.\n- Keyed deadbolts on exterior doors can trap occupants in a fire; report as a safety issue.\n- Safety (tempered) glass required since the 1960s; crumbles on impact; look for tempered symbol; if absent on older home, recommend glazing contractor.\n- Sliding glass doors: verify lock actually catches by locking then tugging.\n\n## Decks, Balconies, Porches\n- Railings required on decks more than 24 inches above grade (codes say 30; inspector uses 24 for safety); perimeter rails at least 36 inches high.\n- Maximum opening in any railing (including balusters) is 4 inches; stair handrails recommended with 3 or more risers.\n- Handrails must be grippable: max 2 inches diameter or 2 1/4 inches cross-section; height 34–38 inches above treads.\n- Most common deck defect: ledger board not properly secured to house; missing or only one bolt is dangerous.\n- Other defects: missing joist hangers, loose/not grippable rails, improper baluster spacing, open risers (best practice: closed or max 4-inch opening), uneven risers (tripping hazard), rotted decking.\n- Inspect decks from underside first; if unsafe (no joist hangers, rotted), don't walk on it and advise clients to stay off.\n- All deck/porch defects refer to a qualified carpenter.\n- Stoops/steps: uneven treads/risers, back-pitched toward house, settled, spalled/cracked concrete, missing handrails.\n- Porches are like decks but covered; older porches pitched to shed water; closed-in porches can trap water and rot.\n- Door opening over stairs needs a landing at least 30 inches deep.\n\n## Eaves, Soffits, Fascia\n- Materials: wood, aluminum, fiberboard, EIFS, composite, polymer; ground inspection allowed but ladder is better.\n- Defects: loose, rotted, animal damage; soffit vents damaged or painted over (painted vents don't work); soffit stains indicate roof leaks.\n- Refer fascia/soffit defects to carpenter; stained/rotted soffits also recommend roofing contractor.\n- Exhaust fan vent stuck open causes heat loss and animal entry.\n- Drip edge flashing needed at exposed sheathing; always recommend gutters at all eaves even on slab to protect finishes.\n\n## Vegetation, Grading, Drainage\n- Keep vegetation trimmed at least 12 inches from house; tree at foundation should be removed.\n- Poor surface drainage causes 90% of foundation seepage; only 10% from groundwater.\n- House sitting in a bowl (low spot) with sump pumps indicates water issues; report.\n- Cisterns/catch basins: underground excluded, but check if lid removable (child hazard) and if collapsing near foundation.\n- Failing retaining wall that affects the building must be reported.\n- Blocked areaway drains near basement stairs risk flooding through door; also check retaining-wall guards to prevent child falls into stairwells.\n- Vine-covered walls restrict view; report as \"restricted view – covered with vines,\" advise on vine removal tradeoffs, warn vines at soffit/fascia can enter attic, include photo.\n\n## Walkways, Patios, Driveways\n- Only required to inspect adjacent/entryway walkways, patios, driveways.\n- Defects: cracked/deteriorated, tripping hazards, ponding, back-pitched toward house (directs water to foundation), firewood stacked near house (insects).\n- Firewood should be at least 5 feet from house.\n- Asphalt against wood causes rotting; report.\n- Driveway drain missing grating/cracked clay tiles – recommend licensed plumber.\n- Exclusions: not required to inspect screening, shutters, awnings, fences, boundary walls, geological/soil conditions, recreational facilities, outbuildings other than garages/carports, seawalls, docks, erosion control.\n\n## Summary\n- Don't guess siding materials; be hands-on. Use generic terms: \"masonry construction\" (covers solid masonry, brick veneer, stone, adhered), \"wood-based\" (clapboards, shingles, T1-11, composites, hardboard, board & batten), \"synthetic\" (plastic), \"metal\" (aluminum/steel).\n"}, {"title": "Module 8 Structural Inspection 1", "md": "# Module 8 Structural Inspection 1\n\nThis module covers the home inspector's scope and limitations for structural inspection, framing components, foundations, common defects, and how to report them.\n\n## Standard of Practice (ASHI SOP)\n\n- ASHI SOP Section 3 requires the inspector to inspect structural components including foundation and framing, and to describe the methods used to inspect under-floor crawl spaces and attics (entered, viewed from hatch, or not inspected), plus the foundation, floor, wall, ceiling, and roof structure.\n- The inspector is NOT required to provide engineering or architectural services, offer opinions about structural adequacy, or determine the strength of systems and components.\n- The inspector is NOT required to enter crawl spaces with less than 24 inches of vertical clearance or with access openings smaller than 16 by 24 inches; entering smaller spaces is optional for customer service.\n- The inspector is NOT required to traverse attic load-bearing components concealed by insulation or other materials.\n- The inspector is NOT required to enter areas that in their professional judgment are dangerous or could damage the property, or crawl spaces/attics that are not readily accessible; document why entry was not made.\n- \"Readily accessible\" means available for visual inspection without moving personal property, dismantling, destructive measures, or actions risking persons or property (e.g., carpeted crawl space hatch, painted-shut attic hatch).\n\n## Structural Goal\n\n- The structural goal is to safely transfer the combined weight of occupants, furnishings, and the house itself to stable ground—solid, undisturbed ground capable of supporting a heavy structure.\n- Foundation problems usually occur when part of the foundation sits on less-than-stable ground, causing shifting or settling.\n- Key terminology: joists are horizontal members supporting floors/ceilings; columns are vertical posts supporting joists and beams; use correct terms in reports.\n- In gable roofs, collar ties form a triangle to counteract side-wall spreading; other loads are resisted by footings on stable ground.\n- Roof framing is either rafters (\"stick built\") or trusses (prefabricated, usually with metal or plywood gussets).\n- Rafters can be field modified by qualified carpenters; trusses can never be field modified.\n- Rafter span can be reduced by collar ties (effective only when roof slope is 4-in-12 or greater), purlins (typically 2x6 minimum running perpendicular to rafters, supported by struts to bearing walls), or knee walls (which often cause cosmetic ceiling cracks directly underneath).\n- Collar ties longer than about 8 feet need lateral support (1x4 nailed perpendicular) to prevent buckling; struts longer than 8 feet should be braced.\n- Purlin supporting struts should be minimum 2x4, typically spaced every ~4 ft, and braced if longer than ~8 ft.\n- When using knee/dwarf-wall framing with roof slopes ≤ 3-in-12 or similar conditions needing extra load capacity, make ceiling joists ~1 inch deeper than normal (or more).\n\n## Trusses are Engineered\n\n- Trusses are engineered, manufactured structural components; every piece is critical because extra material has been eliminated.\n- Engineered lumber (trusses, laminated beams, open-web joists, I-joists) can never be cut, altered, or field modified unless directed by a licensed structural engineer.\n- Dimensional lumber (solid wood 2x4s, 2x12s, etc.) CAN be modified by a qualified carpenter.\n- If an engineered member is observed modified or damaged, always recommend further evaluation by a licensed structural engineer.\n- Truss terminology: top chord, bottom chord, web members, gusset plates; gusset plates may be metal or plywood.\n\n## Subflooring\n\n- Subflooring is the flat material laid directly on top of joists; finish flooring (carpet, sheet goods, tile, hardwood) goes on top.\n- Subflooring is structural and must support appliances, furniture, people, and finish flooring.\n- Typical subflooring types: boards (often perpendicular, sometimes diagonal to joists), plywood (dominant 1950s–1970s), and oriented strand board (OSB, dominant since late 1970s/early 1980s).\n\n## Joists\n\n- Joists distribute floor/ceiling loads to bearing walls, foundation walls, or beams; they may be solid wood or engineered.\n- Joist types: logs (old homes), solid wood, open-web joists (look like trusses), and I-joists (fastest-growing type).\n- Solid wood joists can be field modified by carpenters; open-web and I-joists are engineered and cannot be field modified.\n- Solid wood joist notching rules: notches in top or bottom max 1/6 joist depth; notches not allowed in middle third of span; end notch max 1/4 joist depth; drilled hole max 1/3 joist depth.\n- Actual dimensions: a 2x12 is 1.5\" x 11.25\", so 1/6 depth is just under 2\"; a 2x10 is 1.5\" x 9.25\", so 1/6 depth is about 1.5\".\n- Over-notched joists (e.g., for plumbing) should be reported and referred to a qualified carpenter, even if the house has stood for years.\n- I-joists: top and bottom flanges can NEVER be cut, notched, or modified; web is 3/8\" OSB.\n- I-joist hole rules (per APA EWS): smaller holes near ends, larger holes near center per Table 5; min 6\" from bearing point to first hole; min spacing between holes = 2x diameter of larger hole; min 1/8\" web material from hole edge to flanges; holes 1.5\" diameter or less may be placed almost anywhere (still 2x spacing); limit three maximum-size holes per span; use pre-scored knockouts when possible.\n- I-joists are stronger, stiffer, and lighter than solid wood; may be spaced 24\" on center instead of 16\" (requires thicker subfloor).\n- I-joists may have \"THIS SIDE UP\" markings; installing upside down is a major defect.\n- Squash blocks (usually 2x4s or 2x6s cut 1/16\" longer than joist depth) transfer concentrated loads from bearing walls/columns around the I-joist web to framing/foundation below.\n- I-joist ends need rim board or blocking panels to prevent rollover; web stiffeners/backing blocks are required where I-joists are joined; bearing stiffeners are used with joist hangers.\n- Common I-joist defects: cut top flange (\"bucket cut\"), hacked-out sections, holes too close together—all require recommendation for evaluation by a licensed structural engineer.\n- Joist end support types: most common are bearing on sill plate, supported by joist hangers on beams, and bearing directly on top of beams; mortise-and-tenon joints (old homes) are desirable; joists embedded in masonry walls are undesirable (rot risk).\n- All holes in joist hangers need proper joist hanger nails (not roofing or wire nails); spot-check hangers and look for trends.\n- Joist end bearing minimums: solid wood on wood 1.5\", I-joist on wood 1.75\", solid wood on concrete/masonry 3\", I-joist not recommended on concrete, joist overlap at beam 3\", I-joist minimum support at beam 3.5\".\n- Solid blocking between floor/ceiling joists is required wherever ceilings below are finished.\n- Clustered small holes in I-joists count as one large hole enclosing them all for placement/spacing calculations.\n\n## Bearing and Partition Walls\n\n- Bearing walls support joists, beams, or other bearing walls above and transfer loads down; they cannot be removed without adding alternative support (e.g., beams and columns).\n- Partition walls are fill-in walls that can be removed without structural impact.\n- Wall framing is usually not visible in existing homes; determine bearing vs. p
