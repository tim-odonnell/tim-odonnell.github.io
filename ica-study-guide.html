rvice drop triplex cable has two hot wires and one neutral.\n- Grounding has two main functions: protect equipment from lightning, power surges, and high-voltage crossovers; and minimize danger to people by giving stray electricity a path home.\n- Earth grounding does not remove touch potential and protects equipment more than people; it only reduces shock hazards.\n- Best case in a fault is that a breaker trips and stops current flow; breakers/fuses only open on excess current.\n- A ground-to-earth path is high resistance and often will not trip a breaker; a ground-to-transformer path is low resistance and usually will.\n- Ground conductors must be connected to the neutral only at the service (main) panel—never at subpanels, outlets, switches, fixtures, or appliances.\n- In a Romex panel, white neutrals and bare copper grounds share the same bus bar; in a conduit panel, a green bond screw connects the neutral bus bar to the metal enclosure.\n- Basic rule: do not connect grounds with neutrals at any point after the main panel or disconnect box.\n"}, {"title": "Module 22 Electrical Inspection 3", "md": "# Module 22 Electrical Inspection 3\n\nThis module covers the inspection of electrical service panels, including terminology, grounding and bonding rules, service grounding methods, branch circuit wiring, breaker types and defects, panel enclosure issues, and required clearances.\n\n## Service Panel Terminology\n- Service entrance conductors (two hots and a neutral) enter the main panel from the overhead service drop or underground lateral via the meter.\n- The main disconnect (main breaker) is rated at 60, 100, or 200 amps and determines the service size.\n- The panel box is called the cabinet, tub, or enclosure; bus bars are where ground and neutral wires terminate.\n- The bonding screw ties the cabinet into the ground path (Romex) or connects grounds and neutrals together (conduit system).\n- Main lugs are the connection points for the service entrance conductors.\n- ASHI SOP requires inspection of interior components of service panels and subpanels; never touch anything inside a live panel—use only a flashlight for a limited visual inspection.\n\n## Grounding & Bonding in Panels\n- Electricity needs a primary path (neutral) and an alternate path (ground) back to its source; without a ground, it will find a dangerous path.\n- Branch circuit grounding was not required by the NEC until 1962; knob-and-tube wiring had no ground.\n- Equipment grounding conductors include bare copper in NM cable, metal conduit, metal boxes, MC cable green wire, BX metal jacket, and a separate wire in flexible metal conduit.\n- Hot wires are \"ungrounded conductors\"; neutrals are \"grounded conductors\" because they are bonded to ground in the main panel.\n- Bonding is permanently connecting metal components together to provide a low-resistance fault path to the panel and then to transformer or earth.\n- Basic rule: never connect grounds with neutrals at any point after the main panel or disconnect box; subpanels must have a floating (isolated) neutral.\n- In a conduit subpanel, no ground wires are brought in—the enclosure is the ground; the neutral bus must be isolated from the enclosure.\n- In an NM cable subpanel, grounds go to a separate ground bus bar, never on the same bus as neutrals.\n- Bonding grounds and neutrals in a subpanel creates parallel paths, which can cause fires, electromagnetic interference, and shock hazards, especially with a weak neutral connection.\n- A missing bonding screw in a Romex main panel means the cabinet is not tied into the ground path—report it.\n\n## Service Grounding\n- Every main panel must be connected to the earth via a grounding electrode: a copper or copper-coated rod driven 8 feet, a metal water pipe with at least 10 feet of earth contact, a Ufer ground (20 feet of ½\" rebar or #4 copper in concrete), or a metal well casing.\n- Not allowed as grounding electrodes: metal gas piping or anything made of aluminum.\n- The grounding electrode conductor (GEC, main ground wire) must be continuous with no splices and clamped tightly to the electrode with an approved clamp.\n- GEC size (based on service entrance cable size, but for inspectors when cables match amperage): 125 amps or less = #8 copper (#6 aluminum); 150–175 amps = #6 copper (#4 aluminum); 200 amps = #4 copper (#2 aluminum).\n- A #6 GEC or smaller may be bare if it follows the building contour and is not subject to damage; a #4 GEC must be protected in conduit.\n- For a metal water main ground, the GEC must connect within 5 feet of the building entrance and on the street side of the water meter; older homes may connect to the nearest pipe—verify continuous metal path.\n- Dielectric unions and plastic pipe break the ground path; if uncertain, recommend an electrician.\n- Current practice often uses a driven rod even when a metal water main exists, because water mains are frequently replaced with plastic.\n- 2008 NEC (and later editions) requires all grounding electrodes present to be bonded together with the same gauge wire as the GEC, a supplemental electrode even with a metal water pipe, and electrodes at least 6 feet apart; many areas require two driven rods bonded with #6 copper.\n- NEC is not retroactive—older grounding systems are acceptable if they met the code at the time; recommend electrician if any doubt.\n- Verify ground-rod clamp tightness by touching it with your foot; if the clamp moves at all, it's not tight enough.\n- Check ground rods for full 8-foot burial: hammer marks suggest driving, a cut/smooth top may mean shortened; confirm copper-coated rod, not steel/aluminum/hollow substitutes—when in doubt, report it.\n- Recognize bad GEC clamps: phone/low-voltage clamps (low voltage only), cable under bolt (wrong), hose clamps (unapproved), no clamp (wire twisted on pipe), and loose Weaver clamps needing back piece reversed—report any of these.\n\n## Branch Circuit Amps/Wiring\n- Breaker amp ratings are marked on the breaker; branch wiring must be sized to avoid overheating—wires may be larger than required but never smaller (exception: central A/C).\n- Minimum wire gauge chart (copper/aluminum): 15A–14/12, 20A–12/10, 30A–10/8, 40A–8/6, 50A–6/4, 60A–6/4, 70A–4/3, 100A–2/1/0.\n- Identify wire size by color-coded NM sheathing (since 2001), stamped gauge on older jackets, or comparing to known wires; a wire gauge sampler can help.\n- Undersized wires (e.g., 14 gauge on 20A or 30A breakers) may not overheat until overloaded but are still defects; overheated or melted sheathing indicates a serious issue regardless of gauge match.\n- White wire used as a hot is a safety hazard because it can be mistaken for a neutral at the other end of the circuit.\n\n## Single Pole vs. Double Pole\n- Single-pole breakers serve 120V circuits: outlets, lighting, clothes washers, gas dryers, sump pumps, refrigerators, combustion furnaces.\n- Double-pole breakers serve 240V circuits: electric dryers, stoves/ovens, electric furnaces, electric water heaters, central A/C, heat pumps, and the main disconnect.\n- All double-pole breakers must have factory-provided handle ties; tying two single-pole breakers together is wrong because if one trips, the other still delivers power.\n\n## Double Taps\n- A double tap (double lugging) is two wires under one breaker screw; common but usually wrong—even with same gauge, one wire may be loose, causing arcing and overheating.\n- Double lugging is not allowed for neutrals; a maximum of two ground conductors may share a bus bar lug.\n- Double-tapped main lugs (e.g., to feed a subpanel) are incorrect—subpanels must be fed from a branch circuit breaker after the main disconnect.\n- Neutrals each need a separate terminal; two grounds per lug is acceptable, but a ground and neutral cannot share a lug.\n\n## Mixed Breaker Brands\n- Breakers are UL listed only for specific panel models; many are not physically interchangeable.\n- Some breakers are listed for other panels, but verifying requires pulling the breaker out (beyond SOP); report mixed brands and recommend electrician review.\n\n## Other Interior Panel Issues\n- Panel work must comply with NEC, UL listings, and local codes; unpermitted work is common in rural areas.\n- Stranded aluminum service entrance conductors should have anti-oxidant paste to prevent oxidation; report if missing.\n- Excessive wire in a panel or conduit (visually more than 50% full) should be reviewed by an electrician.\n- Wafer breakers (two in one space) may indicate an overloaded panel and many panels are not listed for them—report.\n- Arcing, scorched bus bars, burned neutrals, or paint-damaged components (which must be replaced, not cleaned) are reportable defects.\n- Low-voltage devices (e.g., doorbell transformers) are not allowed inside the panel; they may be mounted on the exterior of the panel.\n- All circuits must be properly labeled for safety; unlabeled panels should be reported.\n\n## GFCI and AFCI Breakers\n- GFCIs limit shock duration to about 1/40th of a second by tripping when outgoing and returning current differ.\n- AFCIs protect against fires from arcing (e.g., damaged cords, nails through NM cable) by detecting dangerous arc patterns and stopping current flow.\n- Both have test buttons meant for homeowners; inspectors should press them, but in an occupied home may skip and note \"not tested\" on the report.\n- GFCI and AFCI breakers require the branch circuit neutral to return to the breaker; the breaker's pigtail connects to the neutral bus.\n- AFCI requirements vary: some areas require them only on bedroom circuits (2002 NEC), others on most circuits (2008 NEC).\n\n## Maximum \"Throws\" Allowed\n- Before the 1984 NEC, a maximum of 6 throws was allowed to shut off all power; 1984 and after, only 2 throws are allowed.\n- A \"throw\" is any hand movement needed to shut off a breaker or fuse; many newer homes have an exterior main disconnect for fire department use.\n\n## Panel Enclosure/Tub\n- The enclosure must be in good condition with no holes, missing clamps, rust, or corrosion; incoming cables must be clamped.\n- Rigid metal conduit (RMC/IMC) requires bushings: always for threaded terminations, for fitting terminations with 4 AWG or larger conductors, and not required for 6 AWG or smaller or hub/boss terminations.\n- IMC/RMC cannot be mounted directly on concentric rings—use grounding wedges, bushings, or locknuts to ensure proper bonding.\n- Type NM cable cannot be bundled because it prevents heat dissipation.\n- Panels in wood-frame (combustible) walls must have no setback—not even ¼ inch.\n\n## Clearances for Panels\n- In front of any panel or disconnect: 36 inches minimum clear, measured from the outer cover.\n- Side-to-side: 30 inches minimum clear space; the panel does not need to be centered in that space.\n- Violations include permanent obstructions, cabinets over panels, refrigerators, sump pumps, or fuel oil tanks; recommend correction for safety.\n- A/C disconnects technically require 36 inches in front, but this is rarely enforced and often not reported.\n"}, {"title": "Module 23 Electrical Inspection 4", "md": "# Module 23 Electrical Inspection 4\n\nThis module covers dangerous service panels, panel placement rules, fuses and fused neutrals, fixtures and switches, receptacle requirements, grounding/polarity, GFCI devices, smoke detectors, and reporting electrical defects.\n\n## Dangerous Service Panels\n- Federal Pacific Electric (FPE) \"Stab-lok\" and Zinsco panels are documented fire hazards; do not remove their covers.\n- Zinsco panels (1950s–60s) are identified by multi-colored handle ties and a diamond logo; parallel flat bus bars let breakers slide or fall off, causing arcing and overheating; breakers often fail to trip.\n- Exterior type-3 Zinsco panels have an inner dead-front cover that can contact live service conductors during removal.\n- FPE Stab-lok panels (1960s–70s) have up to a 74% failure rate for double-pole breakers; covers are hard to remove; \"E\" and \"F\" breakers are not interchangeable, fit poorly, and can fall out; associated with up to 2,800 fires per year.\n- Report these panels as \"well documented to have a high rate of failure and is a fire hazard,\" recommend electrician evaluation, and suggest the client search the panel name online.\n\n## Electrical Panels Outdoors\n- Outdoor panels must be NEMA type 3 (water-shedding) or inside a weathertight enclosure; they should not be caulked to siding, and surface-mounted panels need ¼-inch clearance from the wall.\n- Type 1 (interior) covers have no overlap, allowing water entry from the top; type 3 covers have a folded \"shoebox lid\" edge.\n\n## Electrical Panels in Closets and Bathrooms\n- Panels in closets are no longer allowed by NEC (flammable materials and storage violate the 36-inch clearance); original panels are grandfathered, but hidden panels are dangerous—use judgment.\n- Panels in bathrooms are no longer allowed (damp areas); report any panel near water, even if grandfathered, because bathrooms are often added after the panel.\n\n## Fuses\n- Two fuse types: cartridge (knife-blade if over 60 amps, ferrule if 60 amps or less) and plug (Type T \"Edison base\" all amperages same size; Type S has unique socket sizes per amperage).\n- Cartridge fuse disconnects are used for central A/C and sometimes main disconnects; wire sizes and amperages must match.\n- Plug fuses are color-coded: blue 15A, orange 20A, green 30A; Type T interchangeability leads to oversized fuses (e.g., 30A on 14-gauge wire), causing fires.\n- Obsolete 60-amp fuse panels should be recommended for electrician evaluation; many insurance companies will not write policies for homes with them.\n- Open fuse sockets are live and hazardous; use a dead fuse or cap.\n- Fused neutrals (1920s–30s) put fuses on both hot and neutral; if a neutral fuse blows, current remains in the circuit—dangerous and obsolete; recommend electrician.\n\n## Fixtures and Switches\n- ASHI SOP requires inspecting conductors, overcurrent devices, a representative number of fixtures/switches/receptacles, and GFCIs/AFCIs; \"representative number\" means one per room interior and one per side exterior.\n- Test all accessible switches and outlets; document blocked ones with photos; if power is off, state that no fixtures/switches/receptacles could be tested.\n- A fixture hanging on hooks and plugged into an outlet is not \"installed\" and is excluded from inspection.\n- Switched lights (or switched outlets) are required by current practice in habitable rooms, bathrooms, hallways, stairs, and garages (attached and detached).\n- Three-way switches are required for stairways with more than 6 risers; they have no on/off markings, and if one must be in a specific position for the other to work, they are installed incorrectly.\n- Closet lighting is not required; pendant lights, exposed incandescent bulbs, and lampholders are not allowed in closets (fire hazard) and should be recommended for change.\n- Recessed lights below an attic must be IC-rated or not covered with insulation; IC fixtures are usually silver, non-IC are usually white with slots/holes—check the attic.\n- Ceiling fans must be tight at the ceiling and use a proper support bracket; check under kitchen exhaust hoods for exposed wiring; timer switches need a shock guard; missing cover plates and porcelain trim rings are safety issues.\n- Pull-chain lighting is permitted in basements and closets (also fine if additionally controlled by a wall switch); however, finished-basement habitable rooms require lighting controlled by a doorway wall switch.\n- To determine IC rating beyond visual cues, check the fixture label (may require pulling trim/bulb) or lift accessible batt insulation near the fixture.\n\n## Receptacles\n- Receptacles are required in all habitable rooms; current practice: no point along a wall/floor line can be more than 6 feet from a receptacle—report rooms with only one outlet (extension cord hazards).\n- Receptacles need proper cover plates, must be secured, and should not be painted over; floor outlets must be secured and have proper covers.\n- Receptacles over electric baseboard heaters cause melted, arcing cords—report as a safety issue.\n- Current practice requires at least one receptacle in hallways 10 feet or longer, at front and back exteriors, on decks/balconies/porches accessible from inside, in garages, and in unfinished basements.\n- Garage door openers should have a ceiling outlet, not an extension cord.\n- Tamper-resistant receptacles (2008 NEC) have a \"TR\" symbol and built-in shutters; new ones are tight.\n- Kitchens require at least two dedicated 20-amp circuits (since 1959 NEC); countertop receptacles must be within 24 inches of any point along the wall line and no more than 20 inches above the countertop.\n- Islands require at least one receptacle regardless of width; if at the end, it must be within 12 inches below the countertop; if on the long side, countertop projection must be 6 inches or less.\n- Outlets above burners are a hazard; recommend capping off.\n- Tamper-resistant receptacles are designed to prevent children inserting single objects; both prongs must engage simultaneously, making new units stiff until repeatedly used; their presence varies with local code adoption, so absence isn't necessarily a defect in older-code areas.\n- Electric baseboard heaters often include a built-in outlet, allowing receptacles above the heater to be terminated/capped instead of running cords over the heating unit.\n- When inspecting floor outlets, be cautious: a loose receptacle can lift out when you remove your tester probe.\n\n## Grounding & Polarity\n- Grounded receptacles became required by NEC in stages: 1951 laundry, 1956 exterior/garages/basements, 1959 kitchen sink, 1962 all 15 & 20-amp receptacles.\n- Open grounds mean no alternate path for electricity—shock hazard; surge protectors will not work without a ground.\n- Reverse polarity (hot/neutral reversed) leaves voltage present in equipment even when off—shock hazard.\n- Three-prong outlets: short slot is hot, long slot is neutral, hole is ground; ground-pin orientation has no code requirement, but inconsistency suggests homeowner wiring.\n- Three-prong outlets testing as not grounded should be reported; two-prong with Romex is not grounded (adding grounds is costly); two-prong with conduit may be grounded by simply changing the receptacle.\n- False (bootleg) grounds connect neutral to the ground pin, often when a 3-prong outlet is installed on a 2-wire system; common testers won't detect them—if outlets test grounded but no ground conductors appear in the panel, suspect false grounds.\n\n## GFCI Devices\n- GFCIs limit shock duration to about 1/40 second by tripping on any difference between outgoing and returning current.\n- Since 1996 NEC, all 20-amp receptacles at kitchen counters and everywhere in bathrooms require GFCI protection, including appliance garages.\n- A GFCI outlet can protect downstream outlets; the \"GFCI Protected Outlet\" label is required but often missing.\n- Test GFCIs by plugging in a tester, pressing the test button on the device, confirming it goes dead, resetting, then testing with the tester's button; if still live, it is wired incorrectly.\n- 2008 NEC requires GFCIs for all 15 & 20-amp outlets in garages (including ceiling for door opener), crawl spaces, and unfinished basements (including sump pumps and HVAC); not retroactive.\n- For ungrounded outlets, NEC allows three options: 1) replace with a new 2-hole ungrounded receptacle, 2) install a GFCI labeled \"No Equipment Ground,\" or 3) replace with a 3-hole grounding type fed through a GFCI, labeled \"GFCI Protected\" and \"No Equipment Ground.\"\n\n## Smoke Detectors\n- ASHI SOP requires describing the presence or absence of smoke and carbon monoxide alarms; do not test them (may summon the fire department if an alarm system is connected).\n- If none are present, recommend adding them; if broken or old (yellow), recommend replacement—NFPA recommends replacing all smoke and CO alarms every 10 years.\n- Many areas/states require CO detectors; know local requirements.\n\n## Not Required to Inspect\n- Excluded from inspection: remote control devices, alarm systems and components, low-voltage wiring systems, and ancillary wiring not part of the primary power distribution system (e.g., ceiling fan remotes, generators, low-voltage lighting).\n\n## Reporting\n- Electrical defects are always potentially life-threatening (shock or fire); communicate their importance both orally and in writing, and always recommend further evaluation by a qualified or licensed electrician.\n"}, {"title": "Module 24 Home Inspection Report Writing", "md": "# Module 24 Home Inspection Report Writing\n\nThis module covers how to produce a clear, defensible home inspection report, including report formats, proper language, comment construction, common mistakes, writing tips, and system ratings.\n\n## Inspection Report Styles\n- The three report formats are checklist (pre-printed items checked off with handwritten comments), narrative (custom-written like a book), and combination (hybrid of both; most current computer systems).\n- Pre-printed handwritten reports are low cost and low tech, but cannot be easily customized, are declining in use, and make including photos difficult.\n- Computer-generated reports are easily customized, adaptable to individual inspection styles, and allow easy photo inclusion, but have higher upfront cost and a longer learning curve (about an hour to produce a report).\n- Software that lets you build your own \"canned\" (pre-written) comments and include photos produces the best report; canned comments give consistency, prevent forgetting key phrases, and are essential for multi-inspector firms.\n- Current state-of-the-art (2020): fill in a computer report on a tablet with built-in camera during the inspection, do final editing with color photos, upload to an FTP site for client download with an emailed password.\n- The report should be ready by 8:00 a.m. the next morning at the latest, even if state regulations allow more time.\n- Know your reporting system thoroughly before your first inspection; practice in your own home and a friend's home.\n- To source a reporting system, consult ICA reference materials or run an Internet search; prices range from $500 up, commonly $700–$1,000, and handwritten reports remain available but are not recommended.\n- Modern clients increasingly prefer receiving reports electronically (emailed PDF) over printed copies delivered at the job site.\n\n## Report Language\n- A proper defect comment contains three elements: a description of the defect, a brief definition of why it is a defect, and a direction for the client (recommended course of action) — the \"3-D method\": Describe, Define, Direct.\n- Use \"qualified\" rather than \"licensed\" when recommending further evaluation unless you know for certain that trade requires a license in your area; \"qualified\" works in every circumstance.\n- Home inspectors are paid for opinions only and cannot legally cause anything to be done; only the client decides when and what corrections are made.\n- Never use these words in a report: needs/needed, necessary, required, only (as in \"rotted only at the corner\"), must, has to be, should, obligated, ought, structurally sound, problem, code/building code.\n- Never say \"structurally sound\" — only a licensed structural engineer has the training, experience, and insurance to make that judgment; using it greatly increases your liability.\n- Avoid \"problem\" because it sounds negative and makes clients nervous; use \"condition,\" \"issue,\" or \"observation\" instead.\n- Never quote building codes in a report; codes are excluded from all Standards of Practice and most pre-inspection agreements, and you cannot know every municipality's code.\n- If you must raise a code-related issue, use phrases like \"not in conformance with local practice\" or \"may not comply with typically observed installation standards for this item.\"\n- Proper report language includes: \"recommended,\" \"further evaluation,\" \"appeared to be\" (e.g., \"the furnace appeared to be short cycling at the time of inspection\"), \"at the time of the inspection,\" \"recommend checking with the current owner,\" \"recommend the item be monitored,\" \"would benefit,\" \"typical,\" \"suggest/suggested,\" \"nearing term replacement,\" \"as expected for a home of this age,\" \"apparently,\" and \"prior to closing.\"\n- Avoid technical jargon; use plain terms: \"spindles\" instead of \"balusters,\" \"roof overhang\" instead of \"fascia/soffit/eaves,\" \"water main\" instead of \"service lateral.\"\n- Keep comments simple and use as few words as possible (e.g., \"The furnace vent connector had multiple holes from corrosion\" instead of a longer wordy version).\n\n## Creating Report Comments\n- Every defect comment should follow the 3-D format: describe what the issue is, define why it matters (what could go wrong, could someone get hurt), and direct the client on how to get it corrected (which tradesperson to call).\n- Develop hundreds of pre-set comments in your computer report system so you don't have to customize each one; most inspectors spend 45–90 minutes completing a report including photos.\n- Example defect comment (stairs): \"One or more of the stair risers were unequal to the others. This is a tripping (safety) hazard and correction by a qualified carpenter is recommended.\"\n- Example defect comment (toilet): \"The toilet was cracked at the base and was also missing a bolt. This may allow leaks and subsequent damage to the floor. Correction by a licensed plumber is recommended.\"\n- Example defect comment (joist): \"A floor joist under the bathtub was over-notched, which may affect the strength of the joist. Further evaluation and possible correction by a qualified carpenter is recommended.\"\n- Even if a defect seems simple and the client says they can fix it themselves, always recommend correction by the proper qualified or licensed tradesperson to protect yourself from liability.\n- For maintenance items like failing paint, a 3-D comment is not always needed; e.g., \"The exterior painted surfaces would benefit from proper preparation and re-painting by a qualified painter.\"\n- Example defect comment (receptacle): \"The outlet cover plate was missing and the receptacle was loose. This is a shock hazard and correction by a qualified electrician is recommended.\"\n\n## Report Comment Mistakes\n- Common mistakes: identifying a defect without explaining its significance, understating the significance of a defect, failing to recommend further evaluation by a qualified professional, and failing to identify or understating a limitation that prevented a complete inspection.\n- Poor comments from real reports include: \"Northwest room on first floor has ungrounded outlets\" (no explanation or action), \"Insulate freon line\" (no why or who), \"Deck has not been bolted to the house, it has been nailed. This is a safety hazard\" (no fix or who fixes it).\n- Avoid using \"must\" in comments; inspectors can only recommend or strongly recommend action, never force correction.\n\n## Report Writing Tips\n- Write every report as if the client was not at the inspection, even if they were; if you omit an expensive or dangerous defect from the report, you may be held liable regardless of what you said verbally.\n- Use a handheld computer format to complete the report as you go and review findings with the client before leaving the job.\n- Take many photos (100 is not out of line); include 15–30 in the report, and keep extras for reference.\n- Always \"write what you say and say what you write\" — be consistent between verbal statements and the written report.\n- Report comments should be clear and well-defined to prevent client follow-up questions; if you get many questions, you are not putting enough information in the report.\n- Do not overwhelm clients with a long list of minor issues, but you must report what you see; do not comment on cosmetic issues (stains, old carpeting, loose wallpaper, dirty surfaces) unless they are safety hazards (e.g., damaged carpeting that is a tripping hazard).\n- Report on things you could not inspect, with a reason and a photo, e.g., \"The roof was covered with snow at the time of the inspection and could not be observed. Recommend observing the roof after the snow has melted and prior to closing.\"\n- If a client is fixated on a minor issue, include it in the report even if trivial, e.g., \"The drywall cracking in the northwest corner of the master bedroom appears to be from typical shrinkage and settlement. Monitoring of the cracking is suggested.\"\n- Report on conditions observed; do not speculate or form conclusions (e.g., say \"The toilet appeared to be leaking at the base. This may damage the flooring and repair is recommended,\" not \"the floor is probably rotted\").\n- For dry stains on ceilings/walls, say: \"A stain was noted at the {location} which was dry when tested. Recommend monitoring of the stain and checking with the current owner for additional information about the stain.\"\n- Never state in writing how much longer something might last, but ASHI and some licensed state Standards of Practice require reporting on items near the end of their service lives.\n- Use the 10/15/20 rule for life expectancies: water heaters last 10 years, A/C condenser/compressors last 15 years (heat pumps 10–12 years), gas furnaces last 20 years; advise clients to budget for eventual replacement when equipment is at or beyond these ages.\n- Always report on items that are part of the Standards of Practice but were not inspected, along with a reason (e.g., \"The garage was not inspected. As per the client, the garage will be torn down after the closing.\").\n- Report limitations like blocked electrical panels (\"The electrical panel was blocked by stored items at the time of the inspection and could not be examined\") or vines covering brick (\"Portions of the brick were covered with vines at the time of the inspection and could not be reviewed\").\n- If part of a roof is not visible from the ground, state it: \"The roof was viewed from the ground. The section of the roof over the shed dormer at the rear was not visible and no comments can be made on its condition. Recommend checking with the current owner as to the condition of this section of the roof.\"\n- Review your final photos on a large computer screen before delivery—they may reveal defects you missed during the inspection.\n- When estimating remaining life, judge water heaters, furnaces, and A/C units by approximate age (using the 10/15/20 rule), but evaluate roofing primarily by overall condition rather than age alone.\n- Make defects easy to find in the report, and use correct grammar and spelling (avoid typos).\n- Template for equipment past its service life: \"The estimated age of the air conditioning exterior condenser/compressor suggests that it is beyond its expected lifespan. Budgeting for eventual replacement is recommended.\"\n- Remember that everything you say during the inspection, whether verbal or written, can influence the client's purchase decision, so treat all statements as part of the record.\n\n## Report System Ratings\n- Many report systems require rating each item (e.g., satisfactory, fair, good, major concern, poor, acceptable, normal, minor concern); these terms are subjective and hard to apply consistently.\n- Ratings can conflict with your defect comments (e.g., rating a switch \"fair\" while calling the missing cover plate a safety hazard) and clients may interpret ratings differently.\n- Recommended approach: use a narrative format that lists items inspected, describes defects, and gives appropriate action; for combination reports, mark items as \"reviewed,\" \"not applicable,\" or \"see comments\" and include narrative defect comments keyed to checklist items.\n- Define \"reviewed\" at the beginning of the report: \"The following items indicated as being reviewed are, in the inspector's opinion, installed and functioning as intended by the original manufacturer. Items marked as 'reviewed' may exhibit typical wear-and-tear as may be expected for comparable homes of this age and in the same neighborhood.\"\n- If you include a summary page, add this statement: \"The items listed on the summary are, in the inspector's opinion, those that pose a safety hazard or affect the habitability or integrity of the house. The client is strongly advised to read the entire report.\" Place the summary at the end and page-number it.\n- Including a separate summary page increases liability if clients mistake it for the whole report; you alone choose which items appear on it.\n\n## Pre-Set Comments\n- Computer report systems allow pre-set comments that automatically print on every report; use them for routine maintenance tips and to minimize liability.\n- Maintenance example: \"All heating equipment should be serviced every year by a qualified heating technician.\"\n- Liability example (plumbing page): \"Water leaks may not appear during the inspection if the home is vacant due to lack of normal usage, but may appear only after repeated usage, and we cannot be held responsible for these.\"\n"}, {"title": "Proofreading Report", "md": "# ICA Inspection Certification - Module Summary Proofreading Report\n\nEach module summary was audited by DeepSeek-V4-Flash-0731 against its source\ntranscript, section by section, for completeness, accuracy, invented content,\nand verbosity.\n\n## Process\n\n1. **Draft** - DeepSeek summarized each of the 24 module transcripts (reasoning\n   enabled). Module 13 was rebuilt section-by-section with reasoning disabled\n   after the reasoning pass repeatedly degenerated on its densest content.\n2. **Audit** - DeepSeek compared each summary against its source and returned the\n   verdict blocks below.\n3. **Revision** - every module flagged NEEDS REVISION was patched: DeepSeek\n   emitted precise ADD/REPLACE/DELETE directives from its own audit findings,\n   which were applied to the existing summary so untouched text was preserved\n   verbatim. Modules 5, 13 and 24 also received a few hand-edits for residual\n   nits (a wrong figure, a missing template sentence, redundant bullets).\n4. **Re-audit** - patched modules were audited again; the blocks below are the\n   latest verdict for each.\n\n## Final status\n\n**All 24 summaries are complete and were judged sufficient on their final audit,\nwith one caveat:**\n\n- **Module 5** still shows *NEEDS REVISION* below, but that block predates the\n  last round of hand-edits. Its final audit found **no missing critical points**\n  (\"coverage is comprehensive across all sections\") - only two redundant bullets\n  and one vague phrase, all since removed. Treat Module 5 as sufficient.\n\n---\n\n### Module 1 Overview of the Home Inspection Profession\n**Verdict:** SUFFICIENT\n**Missing critical points:**\n- none\n**Inaccuracies / invented content:**\n- none\n**Trim (verbose / non-essential):**\n- none\n**Notes:** The summary accurately and concisely captures all critical teaching points, including definitions, standards of practice, exclusions, common defects, and procedural recommendations. Minor non-essential details (e.g., average fee, career rewards) are omitted but do not affect sufficiency.\n\n---\n\n### Module 2 The Legal and Business Aspects\n**Verdict:** SUFFICIENT\n**Missing critical points:**\n- none\n**Inaccuracies / invented content:**\n- none\n**Trim (verbose / non-essential):**\n- none\n**Notes:** The summary accurately and comprehensively captures all major teaching points from the source, including legal structures, financial management, insurance, operations, liability, and marketing. Minor details such as the explicit inclusion of taxes in the 30–45% ongoing expense figure and the option to have a spouse/friend make fee-research calls are not stated, but these are not critical omissions given the overall coverage.\n\n---\n\n### Module 3 The Inspection Process\n**Verdict:** SUFFICIENT  \n**Missing critical points:**  \n- None  \n\n**Inaccuracies / invented content:**  \n- None  \n\n**Trim (verbose / non-essential):**  \n- None  \n\n**Notes:** The summary accurately and comprehensively captures all substantive teachings of the module, including SOP definitions, exclusions, procedural guidance, tools, communication principles, and inspection-order specifics, without material omission or fabrication.\n\n---\n\n### Module 4 Roofing Inspection 1\n**Verdict:** SUFFICIENT\n**Missing critical points:**\n- none\n**Inaccuracies / invented content:**\n- none\n**Trim (verbose / non-essential):**\n- none\n**Notes:** Summary accurately and comprehensively captures all major teaching points from the source module, including SOP requirements, terminology, material specifications, thresholds (pitch ratios, weights, clearances), and inspection procedures without material omissions or fabrication.\n\n---\n\n### Module 5 Roofing Inspection 2\n**Verdict:** NEEDS REVISION\n**Missing critical points:**\n- None significant; coverage is comprehensive across all sections.\n**Inaccuracies / invented content:**\n- Summary states \"Repaired but unmatched patches that function safely merit seller inquiry\" — source frames this as an odd repair that's functioning/safe, so this is accurate.\n- Summary adds \"repair priority matters\" regarding sheathing/H-clips — source recommends carpenter referral, but the phrase \"repair priority matters\" is vague/invented emphasis not in source.\n- Summary omits the specific instruction that for exam purposes, crickets are required at 30 inches (stated accurately), but also omits the source's note that a cricket ma const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inl(s){s=esc(s);
 return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s).,;:]|$)/g,'$1<i>$2</i>');}
function md(t){
 const L=t.replace(/\r/g,'').split('\n');let o='',i=0,stack=[];
 const closeTo=n=>{while(stack.length>n)o+='</'+stack.pop().t+'>'};
 while(i<L.length){const l=L[i];
  let m;
  if(/^\s*$/.test(l)){closeTo(0);i++;continue}
  if(m=l.match(/^(#{1,6})\s+(.*)/)){closeTo(0);const n=Math.min(m[1].length,4);o+=`<h${n}>${inl(m[2])}</h${n}>`;i++;continue}
  if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])){closeTo(0);
   const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));
   o+='<table><tr>'+row(l).map(c=>'<th>'+c+'</th>').join('')+'</tr>';i+=2;
   while(i<L.length&&/^\s*\|/.test(L[i])){o+='<tr>'+row(L[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>';i++}
   o+='</table>';continue}
  if(m=l.match(/^(\s*)([-*]|\d+\.)\s+(.*)/)){
   const d=Math.floor(m[1].replace(/\t/g,'  ').length/2)+1,tag=/\d/.test(m[2])?'ol':'ul';
   if(stack.length>d)closeTo(d);
   while(stack.length<d){o+='<'+tag+'>';stack.push({t:tag})}
   o+='<li>'+inl(m[3])+'</li>';i++;continue}
  if(/^---+\s*$/.test(l)){closeTo(0);o+='<hr>';i++;continue}
  closeTo(0);let p=[l];i++;
  while(i<L.length&&L[i].trim()&&!/^(#|\s*([-*]|\d+\.)\s|\s*\|)/.test(L[i]))p.push(L[i++]);
  o+='<p>'+inl(p.join(' '))+'</p>';}
 closeTo(0);return o}
const side=$('#side'),main=$('#main'),q=$('#q');
const short=t=>t.replace(/^Module (\d+)\s*/,'$1. ').replace(/^_/,'');
side.innerHTML=DOCS.map((d,i)=>`<a data-i="${i}">${esc(short(d.title))}</a>`).join('');
function show(i,term){
 q.value=term||'';side.classList.remove('open');
 [...side.children].forEach((a,j)=>a.classList.toggle('on',j==i));
 let h=md(DOCS[i].md);
 if(term)h=hl(h,term);
 const prev=i>0?`<button data-i="${i-1}">← ${esc(short(DOCS[i-1].title))}</button>`:'<span></span>';
 const next=i<DOCS.length-1?`<button data-i="${i+1}">${esc(short(DOCS[i+1].title))} →</button>`:'<span></span>';
 main.innerHTML=h+`<div class="nav">${prev}${next}</div>`;
 const mk=main.querySelector('mark');
 if(mk)mk.scrollIntoView({block:'center'});else window.scrollTo(0,0);
 try{localStorage.setItem('ica-last',i)}catch(e){}
 history.replaceState(null,'','#'+i);}
const re=t=>new RegExp('('+t.trim().split(/\s+/).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
function hl(h,term){const r=re(term);return h.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(r,'<mark>$1</mark>'))}
function search(term){
 term=term.trim();if(!term){const i=+(location.hash.slice(1)||0);show(i);return}
 const words=term.toLowerCase().split(/\s+/),r=re(term);let out='',n=0;
 DOCS.forEach((d,i)=>{
  const lines=d.md.split('\n').filter(l=>{const x=l.toLowerCase();return words.every(w=>x.includes(w))});
  const loose=lines.length?lines:d.md.split('\n').filter(l=>{const x=l.toLowerCase();return words.some(w=>x.includes(w))&&words.length==1});
  if(!loose.length)return;n+=loose.length;
  out+=`<h3>${esc(short(d.title))} <small>(${loose.length})</small></h3>`+loose.slice(0,12).map(l=>`<div class="res" data-i="${i}" data-t="${esc(term)}">${esc(l.replace(/^\s*([-*#]+)\s*/,'')).replace(r,'<mark>$1</mark>')}</div>`).join('')+(loose.length>12?`<div style="color:var(--mut)">+${loose.length-12} more in this module — open it to see all highlighted</div>`:'');});
 main.innerHTML=`<h1>${n} match${n==1?'':'es'} for “${esc(term)}”</h1>`+(n?out:'<p>Nothing found. Try fewer or different words.</p>');
 [...side.children].forEach(a=>a.classList.remove('on'));window.scrollTo(0,0);}
let tm;q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>search(q.value),150)});
$('#clr').onclick=()=>{q.value='';search('')};
$('#menu').onclick=()=>side.classList.toggle('open');
document.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t)show(+t.dataset.i,t.dataset.t)});
let start=+location.hash.slice(1);
if(!(start>=0&&start<DOCS.length)){try{start=+localStorage.getItem('ica-last')||0}catch(e){start=0}}
show(start);
</script></body></html>
